zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: d74d7388e7ad4ab495363f488921708a
    template: Canon imageCLASS LBP674Cdw by SNMP
    name: Canon imageCLASS LBP674Cdw by SNMP
    description: 'Zabbix 7.0.x SNMP template for Canon imageCLASS LBP674Cdw.


      Verified source database date: 2026-09-27.

      Family/series: imageCLASS LBP600.

      Category: Laser printer; Colour.

      Network: Gigabit Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product/catalog page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.canon.ca/en/product?category=%2Fen%2Fproducts%2FPrinters-and-All-in-Ones%2FSmall-Office-and-Home-Office-Printers%2FLaser&name=imageCLASS_LBP674Cdw

      SNMP evidence source: https://www.canon.ca/en/product?category=%2Fen%2Fproducts%2FPrinters-and-All-in-Ones%2FSmall-Office-and-Home-Office-Printers%2FLaser&name=imageCLASS_LBP674Cdw

      Verification notes: Canon Canada product/specification pages list SNMP V3.0 and network connectivity.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Canon
    - tag: model
      value: imageCLASS LBP674Cdw
    - tag: family
      value: imageCLASS LBP600
    - tag: category
      value: Laser printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 467f54b3e1a34e4dbfbd96d4356aa369
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: d7d66169b03c48738ea3dafb20f0b4e4
        expression: max(/Canon imageCLASS LBP674Cdw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Canon imageCLASS LBP674Cdw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 6ec2b6bfeacb4307b61eebb1d4231acb
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: b1bee1e5aa8247c6bc65653a692ccb1b
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1723ad05240841a8ba7516c26f07b8ea
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c7b2605a3f7c4b1db98c60138ba435f6
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 104fcf82faba484ea8bd2e0a0e3262f8
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: feba291037e047bca7512186da70e501
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: e21f8760c6a34c159190613dbed2de5e
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 2f9e74a3adf14b8f92412b0225b7eb10
        expression: last(/Canon imageCLASS LBP674Cdw by SNMP/printer.status)=1 or last(/Canon imageCLASS LBP674Cdw by SNMP/printer.status)=2
        name: 'Canon imageCLASS LBP674Cdw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: cef62c63588747c3b223b5e5a17ca35c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0be036ef3ef642378c34708ec9019acf
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 8b22aec5aa854d1886f39b11553228ed
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: ea45dd97e38d404095628dbe8ab262c1
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 1c766e5bc6f74c9489bf8c8ec87f118d
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 2ea7b06c534947ec81e30c6e95b19843
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: b430fb0eb01a473a966e13c66eb74362
        expression: last(/Canon imageCLASS LBP674Cdw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS LBP674Cdw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: b0e3cbe4920d4abd8c8c29a405ed2001
        expression: last(/Canon imageCLASS LBP674Cdw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS LBP674Cdw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS LBP674Cdw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Canon imageCLASS LBP674Cdw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Canon imageCLASS LBP674Cdw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 64f547fcf19b43fe9d4f93c469564c21
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS LBP674Cdw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS LBP674Cdw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 8a2dd783f6b24543afd7e1dee9a3e28a
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: d5979c28ba4b4c4a90ce32bc6031a0ed
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 40cb9b84e858479f947168225f975dd8
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: d67095cb8d7e4c03b85bf6732ac4ff53
        expression: last(/Canon imageCLASS LBP674Cdw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS LBP674Cdw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 6fd4e09f40814b048c921bcb71baf66c
        expression: last(/Canon imageCLASS LBP674Cdw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS LBP674Cdw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS LBP674Cdw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Canon imageCLASS LBP674Cdw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Canon imageCLASS LBP674Cdw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 1ea38bb94bd44f768c645eef780f0170
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS LBP674Cdw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS LBP674Cdw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 9174e571392a4ae6b02011501d882458
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: a4aeb7737b404b26a48115b6291e73cb
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 83885805d92c46c9874488ec03abcd1b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Canon imageCLASS LBP674Cdw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 2b3b2dad9f494c298ac10121237968c8
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: a744c3b03bbe4f2e88a323825665bcd7
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 419ae22a21864642a9184856551686ce
    name: 'Canon imageCLASS LBP674Cdw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Canon imageCLASS LBP674Cdw by SNMP
        key: printer.page.count
