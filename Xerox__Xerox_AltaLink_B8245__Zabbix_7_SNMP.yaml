zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 8b807be1c8e642b19852b45ab7e03577
    template: Xerox Xerox AltaLink B8245 by SNMP
    name: Xerox Xerox AltaLink B8245 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Xerox Xerox AltaLink B8245.


      Verified source database date: 2026-09-27.

      Family/series: AltaLink B8200/C8200.

      Category: Enterprise MFP; B&W.

      Network: Ethernet.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: B - current model + family/platform.

      Canada status: Current/certified Xerox enterprise family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://securitydocs.business.xerox.com/en-us/documents/common-criteria/

      SNMP evidence source: https://download.support.xerox.com/pub/docs/ALB81XX/userdocs/any-os/en_GB/Xerox_AltaLink_B8100_C8100_AltaLink_B8200_C8200_series_mfp_sag_en-US.pdf

      Verification notes: AltaLink B8200/C8200 system-administration documentation covers SNMP management for the series.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Xerox
    - tag: model
      value: Xerox AltaLink B8245
    - tag: family
      value: AltaLink B8200/C8200
    - tag: category
      value: Enterprise MFP
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 57393b488dce45c1b7a4471edada207a
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: c583d281e0ef42ecacf162bdd3e49a0f
        expression: max(/Xerox Xerox AltaLink B8245 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Xerox Xerox AltaLink B8245: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: b4c21295e67048cea90a2f0acdd2bce5
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 8c23376445d040d5b9073fa394c9643b
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2a2edff96ffc44d191ecb983d0ebf86f
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c0f421d5d8334ebb9074f02185982d03
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a00406d7fb474648a55171fc05391089
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2f2508c3fd9f4285a27d2bedb96ddfa2
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: bd4e5354c93941baae21bce2584ed970
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e56e3a804b5d429caaabb40c96dccfd5
        expression: last(/Xerox Xerox AltaLink B8245 by SNMP/printer.status)=1 or last(/Xerox Xerox AltaLink B8245 by SNMP/printer.status)=2
        name: 'Xerox Xerox AltaLink B8245: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 74b3ee6d4d914f5c95f4360d0a69d3f7
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3f421943edd8471b9e87adf7efec5521
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0a829e8229f7448a943930442fe9d403
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 0c7aee151098423db6c7ccea45ab7fdf
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 751672e0643d4a649b9c927d1ecb2e24
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 5071849497034617a83171ecff46881b
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 61ae5665d1174af9b9d0e4fa41d52121
        expression: last(/Xerox Xerox AltaLink B8245 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox AltaLink B8245: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 6a705ec343ba423686c684ab9b9c8821
        expression: last(/Xerox Xerox AltaLink B8245 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox AltaLink B8245 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox AltaLink B8245 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Xerox Xerox AltaLink B8245 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Xerox Xerox AltaLink B8245: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: aae1124309ae4f1f8b060f0c276b166c
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox AltaLink B8245 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox AltaLink B8245 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: df979ee386184306a20fa6e398be5e3b
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 3905c320fcf24176a2263ea7de9e6783
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: e5943e14f7af44f6b1edd740dc482f49
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: fb03a5d7185f473e9b43945b1a53feaf
        expression: last(/Xerox Xerox AltaLink B8245 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox AltaLink B8245: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 84788db7e38647328adc829d9c77ab73
        expression: last(/Xerox Xerox AltaLink B8245 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox AltaLink B8245 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox AltaLink B8245 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Xerox Xerox AltaLink B8245 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Xerox Xerox AltaLink B8245: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 50c5830c92984d4187e885b964ec5944
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox AltaLink B8245 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox AltaLink B8245 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 673add32e4314fa0bf34c4eb188dd3bb
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 87b56cb832e943eb8bacf8ed00d5dceb
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 68bc9f621417476eab6a55cb927481b0
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Xerox Xerox AltaLink B8245 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 5990880853864cf79d8cd4a3e256a95a
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: d2883d0e13444db995c69b965559b60a
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: c2c7a41b7a70478f9c6ad690e9402e60
    name: 'Xerox Xerox AltaLink B8245: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Xerox Xerox AltaLink B8245 by SNMP
        key: printer.page.count
