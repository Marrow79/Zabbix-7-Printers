zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: c0b0e1e3652140f0805e08a1fa4fe92e
    template: Zebra Zebra ZE511 RFID by SNMP
    name: Zebra Zebra ZE511 RFID by SNMP
    description: 'Zabbix 7.0.x SNMP template for Zebra Zebra ZE511 RFID.


      Verified source database date: 2026-09-27.

      Family/series: ZE500.

      Category: RFID print engine; B&W/label.

      Network: Ethernet standard/optional and/or Wi-Fi depending on model.

      Verified SNMP support: SNMPv3 on Link-OS 7.0+.

      Evidence level: B - current model + platform/firmware.

      Canada status: Current Zebra family/product page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.zebra.com/us/en/products/rfid/rfid-enabled-products.html

      SNMP evidence source: https://support.zebra.com/article/000031511

      Verification notes: Zebra states SNMPv3 is available on printers running Link-OS 7.0 and above. Confirm installed firmware before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Zebra
    - tag: model
      value: Zebra ZE511 RFID
    - tag: family
      value: ZE500
    - tag: category
      value: RFID print engine
    - tag: snmp_support
      value: SNMPv3 on Link-OS 7.0+
    - tag: evidence_level
      value: B - current model + platform/firmware
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 1965e7cacb8a465f99845653e0e48006
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 081d0c4e0cd34eafa75fed90f90638e2
        expression: max(/Zebra Zebra ZE511 RFID by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Zebra Zebra ZE511 RFID: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: ec62690e4eca4b868dc271f8c859a5bb
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: c6768bbf04d844558d6fdb92030cb2fe
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b3a8c5f859fa41928ff8f4dbe7d5216e
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2f9a47cdb0e2434691feb2a6c3092299
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3433fb2e7a5e4ffd95e2ff31d80715fe
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 61b183472ed244fcab8f97eac556a36c
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 4014d1c2acac403f9d0ba2f2ec9098f8
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 9d4c454d8dbe43db90534168422fc86f
        expression: last(/Zebra Zebra ZE511 RFID by SNMP/printer.status)=1 or last(/Zebra Zebra ZE511 RFID by SNMP/printer.status)=2
        name: 'Zebra Zebra ZE511 RFID: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: af81b67b3bea4253a9199749a3889403
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bd50e0e9c541443d988b1d28cf527517
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7aca0b48914a4ab78efd392405aa6f3e
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: eb56ccb9e91e490ba9522f611faa9535
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: e85440c7976d448086538120762a1367
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 21fd8348d4d84d239256a7dffa351460
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: e94c4c8925ab4a5780cf573a766eceb2
        expression: last(/Zebra Zebra ZE511 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Zebra Zebra ZE511 RFID: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 583f715b3348422b876b251f40a61a2a
        expression: last(/Zebra Zebra ZE511 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Zebra Zebra ZE511 RFID by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Zebra Zebra ZE511 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Zebra Zebra ZE511 RFID by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Zebra Zebra ZE511 RFID: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: b33680d7c8964d3bb02912afad18c280
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Zebra Zebra ZE511 RFID by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Zebra Zebra ZE511 RFID by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 7d7798ace9ff42e08868a03be529e87e
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 2fdf5b61bda547bba0b90c1ee37c3eb0
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 2e383dfc588346caba3802b19a43f56a
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 711adad3eaed42d79e1f6693e7b5ea97
        expression: last(/Zebra Zebra ZE511 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Zebra Zebra ZE511 RFID: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 152bcfeeb5be4c4fa4d1748da046f10a
        expression: last(/Zebra Zebra ZE511 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Zebra Zebra ZE511 RFID by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Zebra Zebra ZE511 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Zebra Zebra ZE511 RFID by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Zebra Zebra ZE511 RFID: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: d8aabd51ea3542e89428b77f633bb9f0
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Zebra Zebra ZE511 RFID by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Zebra Zebra ZE511 RFID by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 73f3aa427eba420d8869b966c9bd417f
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 3a75673294b8426ab881fe244a55e89d
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 9e2e1f34f4954184bb81232c49177dc4
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Zebra Zebra ZE511 RFID by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 93f03020bad1471c8951a9264beb6cdf
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 223906feed9a4058a87c925a8ecf347d
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 50604ed0a5f14b94bb7901fd801fe8f2
    name: 'Zebra Zebra ZE511 RFID: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Zebra Zebra ZE511 RFID by SNMP
        key: printer.page.count
