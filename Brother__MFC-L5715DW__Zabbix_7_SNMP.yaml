zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 9bb9acaab7184fd8bede451bd4d56784
    template: Brother MFC-L5715DW by SNMP
    name: Brother MFC-L5715DW by SNMP
    description: 'Zabbix 7.0.x SNMP template for Brother MFC-L5715DW.


      Verified source database date: 2026-09-27.

      Family/series: MFC-L5700.

      Category: Mono MFP; B&W.

      Network: Gigabit Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product page / current or supported.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.brother.ca/en/p/MFCL5715DW

      SNMP evidence source: https://www.brother.ca/en/p/MFCL5715DW

      Verification notes: Brother Canada specifications explicitly list network interfaces and SNMP security/management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Brother
    - tag: model
      value: MFC-L5715DW
    - tag: family
      value: MFC-L5700
    - tag: category
      value: Mono MFP
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 032a2c30a1714bd7a13dcb3b8a307aea
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: a06fbf414e2b41b5b1fafc63674bd567
        expression: max(/Brother MFC-L5715DW by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Brother MFC-L5715DW: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 8f9093be348a44d590af20ad609b2c56
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: db7d49e5a1384306a00ac93fef4726aa
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 035dec79bd4a4ae696413b086a334e02
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 917e2a07416544959750843218c14da4
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 82a53253188a4e048c179b48409518d5
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: db63f26115af4426b99dd55392393343
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 8ea70d357ab94f8b992219758edc48f1
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: a07fd0fcbc2e423ba5d75feb2884e3b5
        expression: last(/Brother MFC-L5715DW by SNMP/printer.status)=1 or last(/Brother MFC-L5715DW by SNMP/printer.status)=2
        name: 'Brother MFC-L5715DW: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 416cd7d0b04240d097069304ff5c0bb7
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5946b4a6a1de4f599722df0cc4ba2afe
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9098069fb6244ab08dcc81b8031962ac
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: a029b36798744f998d70494d4317d5bc
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: edc15e09183e45f8b746bc6a9ea06eab
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: bdc3507e8ab24cae880981f932461f98
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 96b931fd92ab497db0c951e11b96fc10
        expression: last(/Brother MFC-L5715DW by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Brother MFC-L5715DW: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 09b76f87b6744df4a1d35028dbceb074
        expression: last(/Brother MFC-L5715DW by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Brother MFC-L5715DW by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Brother MFC-L5715DW by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Brother MFC-L5715DW by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Brother MFC-L5715DW: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: b439f82b3c084a2a8306bd941659d3ef
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Brother MFC-L5715DW by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Brother MFC-L5715DW by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: faa502caea0247e082fadc73a8255078
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 0032d3bf68814116825ea8fe6b04f102
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: a250a147f60f4148b1314ac7909e75ac
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: bc1ec5d97729464680ff85105e533e92
        expression: last(/Brother MFC-L5715DW by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Brother MFC-L5715DW: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: e5c58cb45fce4a89852783bc27af2ceb
        expression: last(/Brother MFC-L5715DW by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Brother MFC-L5715DW by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Brother MFC-L5715DW by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Brother MFC-L5715DW by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Brother MFC-L5715DW: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: b2e97e1d9d764d2c8ac8fdc6170e5058
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Brother MFC-L5715DW by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Brother MFC-L5715DW by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: fb378fa1631d4800aa841134f73aab8e
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: e2b3a589f75f49a0bfacaa939cfbd843
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 76cad4c8810a40e199656f6c73538867
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Brother MFC-L5715DW by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 80d34884a8704e55b8d1e3f341d19d61
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 93884345048945a6a49a3000db2f33fb
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: ba65765c363a4969b92ad815972799b1
    name: 'Brother MFC-L5715DW: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Brother MFC-L5715DW by SNMP
        key: printer.page.count
