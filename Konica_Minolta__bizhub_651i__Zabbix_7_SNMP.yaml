zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: d7c30a41816c4990ba46bb9910c9c6df
    template: Konica Minolta bizhub 651i by SNMP
    name: Konica Minolta bizhub 651i by SNMP
    description: 'Zabbix 7.0.x SNMP template for Konica Minolta bizhub 651i.


      Verified source database date: 2026-09-27.

      Family/series: bizhub One i-Series.

      Category: MFP / printer; B&W.

      Network: Ethernet; Wi-Fi options vary.

      Verified SNMP support: SNMPv1/SNMPv3 platform support.

      Evidence level: B - current model + platform security paper.

      Canada status: Current Konica Minolta Canada i-Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://konicaminolta.ca/en/business/technology/i-series

      SNMP evidence source: https://www.konicaminolta.com/global-en/security/mfp/setting/pdf/SecurityTechnicalSupportPaper_en.pdf

      Verification notes: Current Canada i-Series model list combined with Konica Minolta''s security technical support paper documenting SNMP device management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Konica Minolta
    - tag: model
      value: bizhub 651i
    - tag: family
      value: bizhub One i-Series
    - tag: category
      value: MFP / printer
    - tag: snmp_support
      value: SNMPv1/SNMPv3 platform support
    - tag: evidence_level
      value: B - current model + platform security paper
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: d98ed0e30c2342839aa626ee621b8a7c
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: f2e85fab80cd416399227688736b6c63
        expression: max(/Konica Minolta bizhub 651i by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Konica Minolta bizhub 651i: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 4c4f173d0adb4908a37cab3dba7285f3
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 97dfab24413942938af36274a34c117c
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2a6d2cb4ebe44debb5607ec3f27cc04b
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3114ade8b5b2454c894a20ccf6eb0064
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bce83bcfe3d34cada9ce447a07e424de
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 062d6287c30f46208784d3c3cc5ff2c9
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 45ccfdd9ee074862b67cc5076a75ef36
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 134139abaad64b89be9f266919b1f88f
        expression: last(/Konica Minolta bizhub 651i by SNMP/printer.status)=1 or last(/Konica Minolta bizhub 651i by SNMP/printer.status)=2
        name: 'Konica Minolta bizhub 651i: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: c39aba1602da45a8831f7ca4b69858f8
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cd3b4d166b3148a1b62bad852cf2d10b
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1a0009e7f39d424e8fe25c79dacca4ef
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 68f121ace2c74d55bc321b74250116fc
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 4c189fb29ebc4ee5a264f629446b17e8
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 5880971fe45843898c60845cbafee174
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: b96e112002434fbaa2e1401777ffc08a
        expression: last(/Konica Minolta bizhub 651i by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 651i: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 68783b05ba114f4eb081e7cae9683aff
        expression: last(/Konica Minolta bizhub 651i by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 651i by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 651i by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 651i by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Konica Minolta bizhub 651i: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 415958cbbfb4447abb605b7166a63f54
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 651i by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 651i by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 1a2db280e0aa4e369eaf65c42781486d
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 06f9ebb73e154f26bf7a79209e09a662
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 9d86035af7224fc58b8da4b6ea712f69
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: bcf24c170e5744d59d4dc51171030296
        expression: last(/Konica Minolta bizhub 651i by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 651i: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: f20ac60d140b4e9dac01d5ed7f9baf3f
        expression: last(/Konica Minolta bizhub 651i by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 651i by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 651i by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 651i by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Konica Minolta bizhub 651i: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: df1e163cab8c449591c98505ab64fd27
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 651i by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 651i by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 52941773d1c545498c7894fff0974eef
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: d2578bb02165432b8b645c53b84ba3ba
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 4fac521e960b4f16b9110b60d050ddeb
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Konica Minolta bizhub 651i by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: e122a6eadb924980821cb7677a7a3d7e
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 671f08179c124da29f5fb7583e332b93
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: c3acc174d5ce42008cf3c2ec8df36f99
    name: 'Konica Minolta bizhub 651i: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Konica Minolta bizhub 651i by SNMP
        key: printer.page.count
