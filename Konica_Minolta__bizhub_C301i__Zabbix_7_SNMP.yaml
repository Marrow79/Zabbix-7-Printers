zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: bdf7048f68e6430a8bedf54763b6fa27
    template: Konica Minolta bizhub C301i by SNMP
    name: Konica Minolta bizhub C301i by SNMP
    description: 'Zabbix 7.0.x SNMP template for Konica Minolta bizhub C301i.


      Verified source database date: 2026-09-27.

      Family/series: bizhub One i-Series.

      Category: MFP / printer; Colour.

      Network: Ethernet; Wi-Fi options vary.

      Verified SNMP support: SNMPv1/SNMPv3 platform support.

      Evidence level: B - current model + platform security paper.

      Canada status: Current Konica Minolta Canada i-Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://konicaminolta.ca/en/business/technology/i-series

      SNMP evidence source: https://www.konicaminolta.com/global-en/security/mfp/setting/pdf/SecurityTechnicalSupportPaper_en.pdf

      Verification notes: Current Canada i-Series model list combined with Konica Minolta''s security technical support paper documenting SNMP device management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Konica Minolta
    - tag: model
      value: bizhub C301i
    - tag: family
      value: bizhub One i-Series
    - tag: category
      value: MFP / printer
    - tag: snmp_support
      value: SNMPv1/SNMPv3 platform support
    - tag: evidence_level
      value: B - current model + platform security paper
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 5f06d0c97575471fbacb21ceb170d239
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 44c4b8dfa40e483794eae2ef46f3306f
        expression: max(/Konica Minolta bizhub C301i by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Konica Minolta bizhub C301i: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 38812a3abd3443088a1619cb3d1ef00b
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 7cd23dd68c254f2eb231c24385f1c7cd
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: ddf73f7382e94b5c8f8c660b6303ceb2
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f0ce4e1637d44ce4a14a117930b78021
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0125a2f8bf7e42c3bfa88238e71f2ef8
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1f521146a2c84b06ba85e2f68321f9f3
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: ea99c350046548738cf9b170aee33e8f
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: af81e1f917524151bc5f5367bce8e6c2
        expression: last(/Konica Minolta bizhub C301i by SNMP/printer.status)=1 or last(/Konica Minolta bizhub C301i by SNMP/printer.status)=2
        name: 'Konica Minolta bizhub C301i: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: accf9fd5d4c3400a917dfcb1ea8382da
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 57ce89e45d4647e39c62581016b35e94
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 46f47981622e4524bc0ed809672fc118
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 3bcb1f0596d14d639d1bd233fdd097aa
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 1f220852c5e74e1d8718132d1bafbb21
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 0aeb8e17984c4b9fbf300a3ca85ae515
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: aa2435d785b7403cbe4512eeacdc885c
        expression: last(/Konica Minolta bizhub C301i by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub C301i: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 3df73a30415f40d9991ff18bc6995f97
        expression: last(/Konica Minolta bizhub C301i by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub C301i by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub C301i by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub C301i by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Konica Minolta bizhub C301i: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: f5454d4640dc4914a5b7d41c245b23d0
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub C301i by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub C301i by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: f872fe99a5894b899fd125722ec70f7c
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 7926565588294f56ab73ff69e84f6582
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: b05f2df4033d43c18066acd393b75dcc
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: def97043151240fc8bc77a0e0c2381c9
        expression: last(/Konica Minolta bizhub C301i by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub C301i: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 565e9d0de0294736b52d7d4aa27205e7
        expression: last(/Konica Minolta bizhub C301i by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub C301i by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub C301i by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub C301i by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Konica Minolta bizhub C301i: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 80272d3056a64050992409601d38fea1
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub C301i by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub C301i by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: a6bd801e1fd444c0b3fde9dbc9295d2b
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 7d1952d36bc141b885b0946452cdd3fa
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 31de6d47c8354683baed31a26772020b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Konica Minolta bizhub C301i by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: ba377a0969474cea94bc82e441183924
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 0fbc045831454f7e83a21f92b6b7118c
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 564c242d552b4ccd83b1d1e353c33000
    name: 'Konica Minolta bizhub C301i: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Konica Minolta bizhub C301i by SNMP
        key: printer.page.count
