zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: beb83df2f99142e3960128cd2ac81807
    template: Toshiba e-STUDIO2822AM by SNMP
    name: Toshiba e-STUDIO2822AM by SNMP
    description: 'Zabbix 7.0.x SNMP template for Toshiba e-STUDIO2822AM.


      Verified source database date: 2026-09-27.

      Family/series: e-STUDIO.

      Category: Office MFP; B&W.

      Network: Ethernet; Wi-Fi available on selected/configured models.

      Verified SNMP support: SNMPv1/v2/v3.

      Evidence level: B - Canada support model + e-BRIDGE platform.

      Canada status: Toshiba Business Canada/North America support family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://business.toshiba.com/tbs/support/

      SNMP evidence source: https://business.toshiba.com/downloads/KB/f1Ulds/14147/TopAccess_EN_%28EBN%29_Ver01F1.pdf

      Verification notes: Toshiba TopAccess/e-BRIDGE documentation supports SNMPv1/v2/v3 monitoring; model list comes from official support/manual families.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Toshiba
    - tag: model
      value: e-STUDIO2822AM
    - tag: family
      value: e-STUDIO
    - tag: category
      value: Office MFP
    - tag: snmp_support
      value: SNMPv1/v2/v3
    - tag: evidence_level
      value: B - Canada support model + e-BRIDGE platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 710028a5303a434bb7659dd73d0eb253
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 0e40bd4cf362477c91d5137ecf77642d
        expression: max(/Toshiba e-STUDIO2822AM by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Toshiba e-STUDIO2822AM: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 5f9a6a8d8d444ebcbf12617c6be5e9f8
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f9ec381512c14316a2d73b76dea9d25b
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a56d4f4273854c898e20b8ac153ab2ce
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 075adb0fc93c403c9cb7fb157bbce879
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 8db118783896447891e685dbfc2050d2
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: aa3ffec6449b47fbb15d39aa4e2b7d9d
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: d4f92368368b4ffc90b826f61bcd94ee
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: d750fc1c7f8f496486bacd3df798a9cc
        expression: last(/Toshiba e-STUDIO2822AM by SNMP/printer.status)=1 or last(/Toshiba e-STUDIO2822AM by SNMP/printer.status)=2
        name: 'Toshiba e-STUDIO2822AM: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 27ca4ed7c7e040a2b1f40aa92d0be204
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 88c042ec05984f1d84cfff4fac83ee47
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9e7e3b1f604944caa1537d1e91f11fad
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 1a0c55e1731044dd8518b90b6008cf68
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 5da83e3f60b24bd09b6800551fb27b2c
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 981a5b89f63c41f89e72b83dff08ee32
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 4e97d202229249e8876dc1c84a5347f0
        expression: last(/Toshiba e-STUDIO2822AM by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO2822AM: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 7c3abac24d44487fbc5cac3207188688
        expression: last(/Toshiba e-STUDIO2822AM by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO2822AM by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO2822AM by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO2822AM by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Toshiba e-STUDIO2822AM: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: f140b0ca11d744dea8a25e57bdccd37f
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO2822AM by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO2822AM by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: e764a8c8945c42039b7555204628cdbe
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 87ab1ad27be648fbb4fc86315f0d29c7
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 280fa67d14394464ad825d45fd13cc32
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 7423ffe9547f4aef9eda914d146b0abe
        expression: last(/Toshiba e-STUDIO2822AM by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO2822AM: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: f6d6ee6209fc4ad09ae75a24ef9f8082
        expression: last(/Toshiba e-STUDIO2822AM by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO2822AM by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO2822AM by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO2822AM by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Toshiba e-STUDIO2822AM: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 37d7cee0f9b34f5bb77fb957e43a6ecc
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO2822AM by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO2822AM by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b6c1d0aac4e649af92995f197c20be79
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 8435b6d00e50498da0d5e3179c3d912c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: dd8b5c2ad72b4e5382ae9ec6aff56a4e
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Toshiba e-STUDIO2822AM by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 781d715e7e9b49a2bae8602d37119bfd
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 80a39252407c4e219179a44c75e22ffa
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 5451485897254a37ac963d3455014b1f
    name: 'Toshiba e-STUDIO2822AM: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Toshiba e-STUDIO2822AM by SNMP
        key: printer.page.count
