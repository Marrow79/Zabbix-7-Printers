zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 0e501d3746f14cfbbfe2320d82b3cf93
    template: Epson Epson P5370 by SNMP
    name: Epson Epson P5370 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Epson Epson P5370.


      Verified source database date: 2026-09-27.

      Family/series: SureColor Large Format.

      Category: Large-format printer; Colour.

      Network: IP network interface (wired and/or wireless by model).

      Verified SNMP support: SNMP (remote SNMP confirmed; version varies).

      Evidence level: A - model-specific SNMP advisory.

      Canada status: Epson Canada support-listed; current-sale status varies.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://epson.ca/support/wa00965

      SNMP evidence source: https://epson.ca/support/wa00965

      Verification notes: Epson Canada''s SNMP vulnerability advisory explicitly lists this model, establishing remote SNMP support. Check the product page for exact
      interface and SNMP version before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Epson
    - tag: model
      value: Epson P5370
    - tag: family
      value: SureColor Large Format
    - tag: category
      value: Large-format printer
    - tag: snmp_support
      value: SNMP (remote SNMP confirmed; version varies)
    - tag: evidence_level
      value: A - model-specific SNMP advisory
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: efc08687f31f4766a3f947aa6d139e98
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: d2eb749a15064a63a2017c056eaabe6b
        expression: max(/Epson Epson P5370 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Epson Epson P5370: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: cdc43095b1f341c993a9d9fb3d7eeac4
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: c8dadb20d39d4a7eaca84219318173b0
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1829b66ee4b04e69bbb5ec66d5e82675
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5680d696b0ab436c996dddaa51d5e6d6
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6d2002e1b763423ebddf962661ee62eb
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9ad629f0583644aea7efe543cfae56eb
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 83bdb4f3a0854d2db1b914655a8046c5
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: d8b979365d084deda72f7673b61f96ab
        expression: last(/Epson Epson P5370 by SNMP/printer.status)=1 or last(/Epson Epson P5370 by SNMP/printer.status)=2
        name: 'Epson Epson P5370: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: b23c6bb107714e2282a39ed943665ca5
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e3f1b5acc19a466a8de5dc66bb05695f
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 204d5d47e1394fdbaac47a9f2b0cb4ea
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 3980530e37514d02bb65674b59197b58
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 45dda75e39414f7d9af9bbe17788f1b5
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: ed9862f3cfee4c1bb081d449efc39eb2
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 2cbe1bcb82e04cafbf94377d53aea6ec
        expression: last(/Epson Epson P5370 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Epson Epson P5370: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 4195fbc265b14a3994dee5157e3164a0
        expression: last(/Epson Epson P5370 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Epson Epson P5370 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson P5370 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Epson Epson P5370 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Epson Epson P5370: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 5bb606534e774b7083a36e2deec6ea9e
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson P5370 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson P5370 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 4e1582639dfd416198aa460251043827
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: fc34c13943944ac0b966473bdd990656
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 629a60ceb8c44ba690dd5199c1ee47c5
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: b20876c38d66421bbda0721acc6ec9a5
        expression: last(/Epson Epson P5370 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Epson Epson P5370: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 94f44969c58b4f47904f57fcda48ec94
        expression: last(/Epson Epson P5370 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Epson Epson P5370 by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and
          (100*last(/Epson Epson P5370 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Epson Epson P5370 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Epson Epson P5370: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 6b8450c072e444af9d02778e22a542b0
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson P5370 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson P5370 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 528d13d637364fab91d7c7e9ba7b571f
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: dabc6dd2070d47198f74e4574294f9ba
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: d06e8898ae104a8692a854752b09c657
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Epson Epson P5370 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: d95605d76e1742e39f579cc42b6c66f1
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: e399b7ce9fe54f8b86757e504a01b66f
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 2fd75a2d46844e6cb031fa10ef7227d4
    name: 'Epson Epson P5370: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Epson Epson P5370 by SNMP
        key: printer.page.count
