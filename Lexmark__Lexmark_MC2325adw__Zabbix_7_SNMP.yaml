zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 7f875aa95d8a424fa72cd8e15ca270b3
    template: Lexmark Lexmark MC2325adw by SNMP
    name: Lexmark Lexmark MC2325adw by SNMP
    description: 'Zabbix 7.0.x SNMP template for Lexmark Lexmark MC2325adw.


      Verified source database date: 2026-09-27.

      Family/series: MC Series.

      Category: MFP; Colour.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: A - model-specific.

      Canada status: Lexmark Canada product/support page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.lexmark.com/en_ca/printers/printer/12477/Lexmark-MC2325adw

      SNMP evidence source: https://www.lexmark.com/en_ca/printers/printer/12477/Lexmark-MC2325adw

      Verification notes: Lexmark Canada connectivity section lists Ethernet and SNMPv1/v2c/v3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Lexmark
    - tag: model
      value: Lexmark MC2325adw
    - tag: family
      value: MC Series
    - tag: category
      value: MFP
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 64934d04bbd84982a5fa1632af000e8a
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 0aaaba410bd54661b9a8c4f8eb3b6a11
        expression: max(/Lexmark Lexmark MC2325adw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Lexmark Lexmark MC2325adw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 15bb921ae80b4fb1bcb737363214f941
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 9d70fa4a312547068bec00d95055b10d
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d2f4facf1f73433bbeba737ec93390f1
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 99941c25222b4748b5e57d07b8480c88
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4937f5c93b944b88952b41323249a68f
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3bf4be12d0994009b70332c72111fbf5
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: a01d955fd2584d66a9d782c7a5f04ea9
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: f08ac26af46f42dab0d21b35551aa90f
        expression: last(/Lexmark Lexmark MC2325adw by SNMP/printer.status)=1 or last(/Lexmark Lexmark MC2325adw by SNMP/printer.status)=2
        name: 'Lexmark Lexmark MC2325adw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: b5e017dbcda54f62a43cea3c59022009
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 21be5bdb5b5b427380851b3ed6277753
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: aed3c12f78b54bbcbbbf754eeddf4996
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 0acdba0f43e44ec8adce96542d439332
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: a3c6e45b41434233bf4cb6321c2da597
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: fea501e44ec04deba14c413f6789ffb8
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 332b46fb3ab647d3b900ec4aacec44c4
        expression: last(/Lexmark Lexmark MC2325adw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark MC2325adw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: a4fdf1d8dccc4639a2fc7a9d51b6531d
        expression: last(/Lexmark Lexmark MC2325adw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark MC2325adw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark MC2325adw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Lexmark Lexmark MC2325adw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Lexmark Lexmark MC2325adw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 8bb12e80bc0a462689bfd26df846daec
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark MC2325adw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark MC2325adw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: f94895b3e44b424baa158f8fc451da16
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: aee4831e659845508b6d41cd9ad9ad09
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: b852750279594bf7b9e0c1e559f1b842
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 11e4768a09174678bc41ccbb21b8f211
        expression: last(/Lexmark Lexmark MC2325adw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark MC2325adw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: b0ecff73b690423dbc6fda63c955feaf
        expression: last(/Lexmark Lexmark MC2325adw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark MC2325adw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark MC2325adw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Lexmark Lexmark MC2325adw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Lexmark Lexmark MC2325adw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 127edf0ec26945c8ac90d3593387745c
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark MC2325adw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark MC2325adw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 409bb24c84e54b5fa220a1e4a34037a7
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 0c4115c11f4946abaa41e10663435bdb
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 8785a43c1cad451e86fe65d2921496af
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Lexmark Lexmark MC2325adw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: f5aac46921874774a0eee6daa7c147ab
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 6c2ef372eb8b42b785d7b8cbc9955a3d
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: a76079ea10d54b1eb352d9c03d87f181
    name: 'Lexmark Lexmark MC2325adw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Lexmark Lexmark MC2325adw by SNMP
        key: printer.page.count
