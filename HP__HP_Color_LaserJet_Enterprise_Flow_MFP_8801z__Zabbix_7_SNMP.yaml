zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 1fd0d4da782142f6b43cb93de2a3488f
    template: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
    name: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
    description: 'Zabbix 7.0.x SNMP template for HP HP Color LaserJet Enterprise Flow MFP 8801z.


      Verified source database date: 2026-09-27.

      Family/series: LaserJet Enterprise.

      Category: Laser Colour MFP; Colour.

      Network: Gigabit Ethernet; Wi-Fi where configured.

      Verified SNMP support: SNMPv2/v3 (v1 on some models).

      Evidence level: B - current model + family/platform.

      Canada status: Current HP Canada enterprise catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.hp.com/ca-en/shop/listings/printers?jumpid=in_r11839_fr&segment=business&subbrand=laserjet-enterprise

      SNMP evidence source: https://www.hp.com/ca-en/shop/products/printers/hp-laserjet-enterprise-m430f-multifunction-black-white-laser-printer-3pz55a-bgj

      Verification notes: HP Enterprise platform documentation/product specs expose SNMP network management; exact legacy SNMP version mix varies by model.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: HP
    - tag: model
      value: HP Color LaserJet Enterprise Flow MFP 8801z
    - tag: family
      value: LaserJet Enterprise
    - tag: category
      value: Laser Colour MFP
    - tag: snmp_support
      value: SNMPv2/v3 (v1 on some models)
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: da9395b1027342deb60304288c5a195e
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: df167950c4954432b4827d42f9070970
        expression: max(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 927977ccea4a45278057738c495e219a
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 54a417f634a74af9873e5d7ca15af44d
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5c3a183bdc80458baf642ab2aac42c5c
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5077e83b8bab478181f8b7d3872d2167
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 05e1dc89934240cf99847db1815de741
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 282ed5aa925d4c7590bc8be7d77e9b6e
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 97a41f01295743dca6c65953c60e22f9
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 4241a5fb8d5b4edb8d5ddae2896d4af5
        expression: last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.status)=1 or last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.status)=2
        name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: c9c3100169934d5cabb3bfa3112a19a8
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b4cae27df48f4fae812b09865f2f6286
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1afc8853ad854b5db7fd97c0993588bf
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: a89d72c0dffa49838bf91379fbde1bed
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 35340c257a234ffba84be8470296fe50
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 134f78bb107045249daf009864f1cd50
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 14133e893b4f4f498366db9db7025b9f
        expression: last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 13bbb844f3044c13b7511b9e43a83cb3
        expression: last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/HP HP Color LaserJet Enterprise Flow
          MFP 8801z by SNMP/printer.supply.max[{#SNMPINDEX}])>0 and (100*last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/HP
          HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: e24a5176528f44ef89b44cb1383b9211
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: d184db1356a247b597bdd780e90698b4
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 1c813cc395db47fc9170eacd175cb24c
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 58139d1445c24552a85f417344cc88f3
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 9b120ddf2cff4089a14640af9db5837a
        expression: last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: b1748575d660401e916313eb6e25c52a
        expression: last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/HP HP Color LaserJet Enterprise Flow
          MFP 8801z by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and (100*last(/HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/HP
          HP Color LaserJet Enterprise Flow MFP 8801z by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a3c7b30709564e208398b01927eca12e
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: c49d563a095d42be8a3c6414bc68a410
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: eede27f7b07b4f879710779f1f4dbead
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: c878e95be3a747538f662fb148e6ce50
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: d2b7689948cb47149d034262c104acdd
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: ca9bc8dc9913408f8503428548d58277
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 1dc0df1197794ee49374fa10301904c0
    name: 'HP HP Color LaserJet Enterprise Flow MFP 8801z: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: HP HP Color LaserJet Enterprise Flow MFP 8801z by SNMP
        key: printer.page.count
