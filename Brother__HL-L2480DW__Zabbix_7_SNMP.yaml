zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 618fd18c0efe4b1795c60e1b1ee7d16a
    template: Brother HL-L2480DW by SNMP
    name: Brother HL-L2480DW by SNMP
    description: 'Zabbix 7.0.x SNMP template for Brother HL-L2480DW.


      Verified source database date: 2026-09-27.

      Family/series: HL-L2400.

      Category: Laser printer; B&W.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product page / current or supported.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.brother.ca/en/p/HLL2480DW

      SNMP evidence source: https://www.brother.ca/en/p/HLL2480DW

      Verification notes: Brother Canada specifications explicitly list network interfaces and SNMP security/management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Brother
    - tag: model
      value: HL-L2480DW
    - tag: family
      value: HL-L2400
    - tag: category
      value: Laser printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 5634f7ffbfa7479e844c97a24d46dec6
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: b8a222c295d843a7bc122015cb603a60
        expression: max(/Brother HL-L2480DW by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Brother HL-L2480DW: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 55349e9e5957405fa99457553ce52c52
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 94b3307f44e74cac8000b7b913d46075
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6810771e69364277b218c14914cb3a09
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b7de2817502547b29287e904e7bdd95f
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6cea7ccc9ef04032a895c00d0c938b5c
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d0692e39534e4783aca83c20d18ef69e
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: d91ea5c8758549d583cb42d338825dcb
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e6825994df4d4b31bdcf0dc11b1bcd4b
        expression: last(/Brother HL-L2480DW by SNMP/printer.status)=1 or last(/Brother HL-L2480DW by SNMP/printer.status)=2
        name: 'Brother HL-L2480DW: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: bed1a7d820af40089a1529216802dc2c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 218100eb58d946a4b2be59178b875c18
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c4e14ea69dd14499b26db4b9cc26c166
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 19ddb969e16b49af9c5064c0871a9311
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 0dbdd17a39384db3b2c87063f0256c57
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: cff2cd36d42e4d9d968aefba43f977b4
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 20bf82b004ee4e2f82b558aec0804159
        expression: last(/Brother HL-L2480DW by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Brother HL-L2480DW: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 70eecaa187b64dd3a9a63310b205ed22
        expression: last(/Brother HL-L2480DW by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Brother HL-L2480DW by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Brother HL-L2480DW by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Brother HL-L2480DW by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Brother HL-L2480DW: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 51640a89d3a04b98825e38227620c035
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Brother HL-L2480DW by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Brother HL-L2480DW by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 5f4fc316508e463d921c142bb1ccba8a
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 7085ce5fffe94739a2c53b6ac35c2223
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 2f9c7a531033479e8c7e7512c2a90f0b
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: e7027500cc2b440ea4558b6a000ffed9
        expression: last(/Brother HL-L2480DW by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Brother HL-L2480DW: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 9dd458f7cab64bdf98a5e75e4ce98fff
        expression: last(/Brother HL-L2480DW by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Brother HL-L2480DW by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and
          (100*last(/Brother HL-L2480DW by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Brother HL-L2480DW by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Brother HL-L2480DW: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 6d346a4fa12041b49d479edff6d4fb32
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Brother HL-L2480DW by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Brother HL-L2480DW by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 07d179f7ebf14e75bbff53b79bc25f1d
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: c254d6fffc634153bf45f0cae00e6cb7
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: bbbf7034df4e4249980369fca1b00d21
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Brother HL-L2480DW by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: ffd8f34843a2432d8b470a3afdd681f3
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: faf5c512961f4925972e106663b639b2
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 4cf9d25bfd0849fb9f695f357ff2bf9b
    name: 'Brother HL-L2480DW: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Brother HL-L2480DW by SNMP
        key: printer.page.count
