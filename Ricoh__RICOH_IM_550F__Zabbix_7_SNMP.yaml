zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 6d096f6216044ce087445306bcabcf8e
    template: Ricoh RICOH IM 550F by SNMP
    name: Ricoh RICOH IM 550F by SNMP
    description: 'Zabbix 7.0.x SNMP template for Ricoh RICOH IM 550F.


      Verified source database date: 2026-09-27.

      Family/series: RICOH IM.

      Category: A4 MFP; B&W.

      Network: Ethernet; Wi-Fi on selected/configured models.

      Verified SNMP support: SNMPv1/v2 + SNMPv3.

      Evidence level: B - current model + platform/manual.

      Canada status: Current Ricoh Canada Always Current Technology list.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.ricoh.ca/en-CA/products/always-current-technology/always-current-technology-instructions-and-versions

      SNMP evidence source: https://manuals.ricoh.com/mfp/p_manual/IM6000JPN/ja/security/int/control.htm

      Verification notes: Ricoh''s current Canada list establishes active models; Ricoh IM security documentation describes SNMPv1/v2 and SNMPv3 network management.
      Exact interface options vary.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Ricoh
    - tag: model
      value: RICOH IM 550F
    - tag: family
      value: RICOH IM
    - tag: category
      value: A4 MFP
    - tag: snmp_support
      value: SNMPv1/v2 + SNMPv3
    - tag: evidence_level
      value: B - current model + platform/manual
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: c446107a517d4e5bb3655e6200382ff6
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: dfae74561f1f4dc9aa431a6f5f8d90eb
        expression: max(/Ricoh RICOH IM 550F by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Ricoh RICOH IM 550F: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 1488703c390a4c3784d1a9e025fe7410
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 0e4e8f35047049b2a390a5240b7e0b30
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 91773726f6264ab582120c6310dd018c
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b9e324b1ef3f423aaf192ab32ac85ee5
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: ce03faf443344477b4b40a9fe3ce0de3
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cd3e5f7a42a147dc9950756e0265a22f
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 13e556d3320846259f69d76475061d33
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 855d6edf674e4d08b88190693115b23f
        expression: last(/Ricoh RICOH IM 550F by SNMP/printer.status)=1 or last(/Ricoh RICOH IM 550F by SNMP/printer.status)=2
        name: 'Ricoh RICOH IM 550F: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 09255d66de7349ac8dad5c7435fbcf73
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 97fab3baaefc4d02ac3c0c6a071fa389
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 978f110737db493285ca93ef5e4c56e1
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 9d8de3fa326d4a19b16f6c3c2780daf2
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 38d1c64c2795456cb89243cd324fba40
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: e58aa2b7f4a749a3918af70e0d144e08
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: b67921329f844d6ab0a3ba1d79df63a4
        expression: last(/Ricoh RICOH IM 550F by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 550F: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 67e961ba725f4d63a0546629ee04d4ee
        expression: last(/Ricoh RICOH IM 550F by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 550F by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 550F by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 550F by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Ricoh RICOH IM 550F: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a503e5e3552f4bc38c726ef15a4cace2
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 550F by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 550F by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 98fc2b9f57e04f329742e94851783bee
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: e577b051cb344a38b43c454251dd32be
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 216d394679f2468f9417fff75a30d26e
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: cd4823ad4f4c45a3b5063b00e62b76dd
        expression: last(/Ricoh RICOH IM 550F by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 550F: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: d7eef8c0396f4e48916004a8c996ac53
        expression: last(/Ricoh RICOH IM 550F by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 550F by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 550F by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 550F by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Ricoh RICOH IM 550F: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: bcf42b7c05324c29b58ece2706b49a4b
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 550F by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 550F by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 18ebd427fb7a42779be0a37119628a98
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 4238d01df8814f2a949bfd874c1048b5
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 4633a16d9ec048e39ecd7b0cf1a8d05e
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Ricoh RICOH IM 550F by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 02c7c9850c0f4c0ebe63702164798bd0
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: e42625e0f57744d09a6aaab241e1590c
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: dcaff96207b445919759c13880e83b52
    name: 'Ricoh RICOH IM 550F: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Ricoh RICOH IM 550F by SNMP
        key: printer.page.count
