zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: e50392cb567e4e249568c7d7864f797d
    template: Toshiba e-STUDIO7527AC by SNMP
    name: Toshiba e-STUDIO7527AC by SNMP
    description: 'Zabbix 7.0.x SNMP template for Toshiba e-STUDIO7527AC.


      Verified source database date: 2026-09-27.

      Family/series: e-STUDIO.

      Category: Office MFP; Colour.

      Network: Ethernet; Wi-Fi available on selected/configured models.

      Verified SNMP support: SNMPv1/v2/v3.

      Evidence level: B - Canada support model + e-BRIDGE platform.

      Canada status: Toshiba Business Canada/North America support family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://business.toshiba.com/tbs/support/

      SNMP evidence source: https://business.toshiba.com/downloads/KB/f1Ulds/14147/TopAccess_EN_%28EBN%29_Ver01F1.pdf

      Verification notes: Toshiba TopAccess/e-BRIDGE documentation supports SNMPv1/v2/v3 monitoring; model list comes from official support/manual families.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Toshiba
    - tag: model
      value: e-STUDIO7527AC
    - tag: family
      value: e-STUDIO
    - tag: category
      value: Office MFP
    - tag: snmp_support
      value: SNMPv1/v2/v3
    - tag: evidence_level
      value: B - Canada support model + e-BRIDGE platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: efbd430e7d924817b35f23afd48c31fc
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: e87f65986d6246ccb8f03a3f3a33419a
        expression: max(/Toshiba e-STUDIO7527AC by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Toshiba e-STUDIO7527AC: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 6b807b6f5c7c407cb9d79a922ec6ab74
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: e58d1a1333a94c9597aa75a7409714e1
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 96f0ce40919343ba954f3a6b4577c7a5
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: be17d1546555464aa2a593d65ccd5767
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: aae21ce7d1ed4f5baca761c9ae3b384c
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c7d58685cb914d359709d37c23927813
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 22f64185f6e740b6bbe7edfcf878de8b
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 9109764df0f44c5d8ab41e1b43e06b1f
        expression: last(/Toshiba e-STUDIO7527AC by SNMP/printer.status)=1 or last(/Toshiba e-STUDIO7527AC by SNMP/printer.status)=2
        name: 'Toshiba e-STUDIO7527AC: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 8bdfeae29050473d938146b472c76bd4
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9cc788d2a171457187bf28d6a397b889
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f57bc3e8308c4ee7a93fbad67b003285
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: b47d762bf15c4fb5a0bb7c712a2dbf78
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: bc51585e182048128b951e2fb7940396
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 046094232c6c428d92f46a27476d0605
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 3c981f0c0c884c66a24318fed148b471
        expression: last(/Toshiba e-STUDIO7527AC by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO7527AC: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: d1c635b9883742049f1a559870d2a832
        expression: last(/Toshiba e-STUDIO7527AC by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO7527AC by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO7527AC by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO7527AC by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Toshiba e-STUDIO7527AC: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: f5304e73b5594cc383a86e2d96ab9cd2
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO7527AC by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO7527AC by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 089dbc6b12e145a6a7eeeac53491a932
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: e2da9544567b48b4a0000c00b23df9fb
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 76ad95ea35f349d9a3b09e9ef5b2b977
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 2d6acfefbe0b4d1e98f796b84bd1b8fd
        expression: last(/Toshiba e-STUDIO7527AC by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO7527AC: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: da0f2252a4ba43099e9c3ea2146b3b9c
        expression: last(/Toshiba e-STUDIO7527AC by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO7527AC by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO7527AC by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO7527AC by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Toshiba e-STUDIO7527AC: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: c0ecbd4e92374ae1ad267f692d5b1782
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO7527AC by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO7527AC by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 34e09581d0224729aab1f4a0ddca70d3
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 1e46e2a7681e4989a2f765a711ad15fc
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 4a37873ebae340bea623e6d879e897f6
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Toshiba e-STUDIO7527AC by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: a341e258bc2a462f9458a49d38170d96
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: e9b9d14129bb4cf996ba1450b9e5c6f4
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 987b7343b39c469391592ab17f2dc861
    name: 'Toshiba e-STUDIO7527AC: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Toshiba e-STUDIO7527AC by SNMP
        key: printer.page.count
