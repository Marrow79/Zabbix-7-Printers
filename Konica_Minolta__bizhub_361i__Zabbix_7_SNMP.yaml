zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 35045d18ee7c4110a4ea7d3859184e29
    template: Konica Minolta bizhub 361i by SNMP
    name: Konica Minolta bizhub 361i by SNMP
    description: 'Zabbix 7.0.x SNMP template for Konica Minolta bizhub 361i.


      Verified source database date: 2026-09-27.

      Family/series: bizhub One i-Series.

      Category: MFP / printer; B&W.

      Network: Ethernet; Wi-Fi options vary.

      Verified SNMP support: SNMPv1/SNMPv3 platform support.

      Evidence level: B - current model + platform security paper.

      Canada status: Current Konica Minolta Canada i-Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://konicaminolta.ca/en/business/technology/i-series

      SNMP evidence source: https://www.konicaminolta.com/global-en/security/mfp/setting/pdf/SecurityTechnicalSupportPaper_en.pdf

      Verification notes: Current Canada i-Series model list combined with Konica Minolta''s security technical support paper documenting SNMP device management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Konica Minolta
    - tag: model
      value: bizhub 361i
    - tag: family
      value: bizhub One i-Series
    - tag: category
      value: MFP / printer
    - tag: snmp_support
      value: SNMPv1/SNMPv3 platform support
    - tag: evidence_level
      value: B - current model + platform security paper
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: cec6b35d024242e9b7deb876880696a1
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 3c00300719054cf79fee8f71fa4041be
        expression: max(/Konica Minolta bizhub 361i by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Konica Minolta bizhub 361i: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 8410fb7e7ab2486fb61bace2dab9711a
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: c2284d9a66c54bb3a3e56fc18c39a5e4
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 76a2a8056b5046fe8d65b222642415b5
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 889ae0b2b9ef456bac2bb0244d19fbb7
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 8cbfec70ad28409cbf4f9251479bfb22
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b9edf00b3e694ea59d176cd6b3d2bf89
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 6cdd2a47b8d544509454235c085d0745
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: fdc677c1aeec4df5abab5fecb56c598a
        expression: last(/Konica Minolta bizhub 361i by SNMP/printer.status)=1 or last(/Konica Minolta bizhub 361i by SNMP/printer.status)=2
        name: 'Konica Minolta bizhub 361i: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 290d985f31c448a0926f05892bc451e2
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1da02910c40d4e0188efdce40478d3e1
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e729e1ba487244dd92c4a17bfe07c138
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 6257583fcc83422eafc1a3adea280d66
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: ac86b472d08446259da8f92c6d1b9dd3
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 845343ce45514179847c4a01f1b6016c
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: feef18a26a194e2f82f8d0ff04ba6a43
        expression: last(/Konica Minolta bizhub 361i by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 361i: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 39ae32a6222543ae8fae99bc73bddb8a
        expression: last(/Konica Minolta bizhub 361i by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 361i by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 361i by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 361i by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Konica Minolta bizhub 361i: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a6d6f984459a4ef49bcb479ad4c7bba4
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 361i by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 361i by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: f2bcfd71d6ef4c6982d51d2106e490e6
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 36efb98de2cd4325b174e34666c8b659
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 7b592d89948f4dc1a724a92c74b7f982
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 944ad64edee643de9876389c2f81be1a
        expression: last(/Konica Minolta bizhub 361i by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 361i: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 3e6e28b430db47378118492226078dd7
        expression: last(/Konica Minolta bizhub 361i by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 361i by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 361i by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 361i by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Konica Minolta bizhub 361i: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a974c41fb89a4dbebd8c9f8ca0cef6fa
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 361i by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 361i by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: af1d75b2b3fc43ed8618c7c1e7c913cd
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 8993c25cd1fe4f9f996ed6165855648b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 9c33515b748a44d9a758f42b52d20eb2
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Konica Minolta bizhub 361i by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: ab048ed434f1457db8bb621be77f716c
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: f992cb03196b4bd0af2a0fd5130d1157
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 03da6006490b4d8f965b3e3fbe2877f6
    name: 'Konica Minolta bizhub 361i: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Konica Minolta bizhub 361i by SNMP
        key: printer.page.count
