zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 620c1a043c394e2cbf8dee585d507dc7
    template: HP HP LaserJet Pro 3101fdw by SNMP
    name: HP HP LaserJet Pro 3101fdw by SNMP
    description: 'Zabbix 7.0.x SNMP template for HP HP LaserJet Pro 3101fdw.


      Verified source database date: 2026-09-27.

      Family/series: LaserJet Pro.

      Category: Laser MFP; B&W.

      Network: Ethernet; Wi-Fi on wireless variants.

      Verified SNMP support: SNMPv1/v2/v3.

      Evidence level: B - current model + family/platform.

      Canada status: Current HP Canada business catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.hp.com/ca-en/shop/listings/printers?segment=business&subbrand=hp-laserjet+hp-laserjet-pro+hp-laserjet-pro

      SNMP evidence source: https://www.hp.com/ca-en/shop/products/printers/hp-laserjet-pro-4301fdn-multifunction-colour-laser-printer-4ra81f-bgj

      Verification notes: HP Canada catalog confirms current Ethernet models; representative current LaserJet Pro model specs explicitly list SNMPv1/v2/v3 management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: HP
    - tag: model
      value: HP LaserJet Pro 3101fdw
    - tag: family
      value: LaserJet Pro
    - tag: category
      value: Laser MFP
    - tag: snmp_support
      value: SNMPv1/v2/v3
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 6d0c866bdbee44c3bb16d2aa5480d866
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 6ee7bb53137d46c994a038613f0a26ae
        expression: max(/HP HP LaserJet Pro 3101fdw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'HP HP LaserJet Pro 3101fdw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 307f613fff4d401496b80fea59caa497
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f4219c9437784f14b06a894dc9a5dea9
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9f678a47ddcc42198c37c2beb39a3948
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 86ab786a3dde4f01b44f4cf479513a0e
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: db49825121974e17a1b405c802f4a341
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3e45f052d3d04008aa9f9a25609fb720
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 69c5d013009647189621d82def0d39d7
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 361e798e8d764d9aba72a3cbe4b89d26
        expression: last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.status)=1 or last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.status)=2
        name: 'HP HP LaserJet Pro 3101fdw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 3aa96871b4014f1ca32901d662f9cfea
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 865e8f04d1534d0697499f2bb28b8d8a
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 29746d6ba3e44b5391edbcedd82fa9c2
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 4b0d13db499a4d0b8d99348b09724faa
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: a076c12e7db24e778701079111839eea
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: febe546f4438444b97172920b8752a66
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: b256774aacb3407dba920783a0f619bf
        expression: last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Pro 3101fdw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: ed5df57052bd4d159e1d7bf19deb8fcd
        expression: last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'HP HP LaserJet Pro 3101fdw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: d1877fa973004f0795130750ff96ab40
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Pro 3101fdw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Pro 3101fdw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 34ccec6a28be4f6983724d8411937749
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: c5d2a1cf6a794d3f812a2974c9c3b9c8
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 86dd299f2b6a46229b5707076652b9ea
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 4be66d5a98c145aca07db24ead198a84
        expression: last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Pro 3101fdw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: cebd2d4955464d76bec8c4b05ae1f02c
        expression: last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/HP HP LaserJet Pro 3101fdw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'HP HP LaserJet Pro 3101fdw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 9c9060425f6d42ad9573cd9b09e4f944
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Pro 3101fdw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Pro 3101fdw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b27139fb23da403eb720e4857071c80a
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 8c66aa2511534105add01d9b228fbf62
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 66a4dd5435414815bcd99b4dcb933307
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: HP HP LaserJet Pro 3101fdw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 7ac6b50432bf4a918ff8da9730b87ea2
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: c12403b8fdfa4c23ab1f01743b9564eb
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 0558f83e5d6a45398bf3ca630acdee7a
    name: 'HP HP LaserJet Pro 3101fdw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: HP HP LaserJet Pro 3101fdw by SNMP
        key: printer.page.count
