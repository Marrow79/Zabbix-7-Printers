zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 5e71fa025ac64a8aa02997f4723d9e55
    template: Canon imageCLASS MF287dw by SNMP
    name: Canon imageCLASS MF287dw by SNMP
    description: 'Zabbix 7.0.x SNMP template for Canon imageCLASS MF287dw.


      Verified source database date: 2026-09-27.

      Family/series: imageCLASS MF200.

      Category: Mono MFP; B&W.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product/catalog page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.canon.ca/en/product?category=&name=imageCLASS_MF287dw

      SNMP evidence source: https://www.canon.ca/en/product?category=&name=imageCLASS_MF287dw

      Verification notes: Canon Canada product/specification pages list SNMP V3.0 and network connectivity.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Canon
    - tag: model
      value: imageCLASS MF287dw
    - tag: family
      value: imageCLASS MF200
    - tag: category
      value: Mono MFP
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 53034a5b36404296a67c5cbca0b0e164
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: b0fa8a3007d0451b978b80b31a6d47c0
        expression: max(/Canon imageCLASS MF287dw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Canon imageCLASS MF287dw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 6f94484c40464cfd9f5099f5e62e1448
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 2412a48049ad44c1ad1a09ae8b26c186
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f3f5f55abe8b4883b698286186b9f2ba
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2a64fde2e4b64b8f8e5bfd5222385565
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7813a4d933e349b99b85f909b8114a81
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 348821d0c85649cbb0c2659ff51a2774
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 8bd83fccc9c74301b47d0dfd9692bc66
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: f41d643ec18347b29abcaadc3ae6c479
        expression: last(/Canon imageCLASS MF287dw by SNMP/printer.status)=1 or last(/Canon imageCLASS MF287dw by SNMP/printer.status)=2
        name: 'Canon imageCLASS MF287dw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: afe763397440495c8253be0e5b0072b8
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 83642a0fd8114d519317dea62208424f
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: df19bb03912445fbb6767fcaf4c42ae0
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 68870c107e5a443aabf6965c188123d6
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: c598407355d0455d903176832a9d0aa3
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: df5b374294074370ad0c4d37146d61ee
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: a29933592417493f837dc0eb06202aba
        expression: last(/Canon imageCLASS MF287dw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS MF287dw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 54f2dc2311024415ae9caa7aa205bcd0
        expression: last(/Canon imageCLASS MF287dw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS MF287dw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS MF287dw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Canon imageCLASS MF287dw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Canon imageCLASS MF287dw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 3ebb998b8bfc4bd48c2aa361eb17e706
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS MF287dw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS MF287dw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 759d70a3172b4076bb91778a4ff37057
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 9c9de29be84f411683836c57ecc7a1b0
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 9506c7e46ef441f798fb6e27b5689d5d
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 3b3104cb57d9414f813ac1b58491e042
        expression: last(/Canon imageCLASS MF287dw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS MF287dw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: dfd78ddb4d32460ea38c4f759f07b879
        expression: last(/Canon imageCLASS MF287dw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS MF287dw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS MF287dw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Canon imageCLASS MF287dw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Canon imageCLASS MF287dw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 003b31a8dcff4d8cb1d4652b103431f6
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS MF287dw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS MF287dw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 083fb52eb0f748ada6ba87bd0cf15468
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 9b7ffe67ddbd4898a772d4c290ef84d9
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 2748e04213574d53bab708c6f91a6d57
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Canon imageCLASS MF287dw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 8bef75bc79da43a9a206f8b11ec95b04
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 58ab634fe6cb4ef4a903cdc7347ba47d
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 0e2c06f028ee4e55a4fb04d3f9e0969e
    name: 'Canon imageCLASS MF287dw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Canon imageCLASS MF287dw by SNMP
        key: printer.page.count
