zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: db55d3ff92fe468f93dc4228bd869df4
    template: Epson Epson P7370 by SNMP
    name: Epson Epson P7370 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Epson Epson P7370.


      Verified source database date: 2026-09-27.

      Family/series: SureColor Large Format.

      Category: Large-format printer; Colour.

      Network: IP network interface (wired and/or wireless by model).

      Verified SNMP support: SNMP (remote SNMP confirmed; version varies).

      Evidence level: A - model-specific SNMP advisory.

      Canada status: Epson Canada support-listed; current-sale status varies.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://epson.ca/support/wa00965

      SNMP evidence source: https://epson.ca/support/wa00965

      Verification notes: Epson Canada''s SNMP vulnerability advisory explicitly lists this model, establishing remote SNMP support. Check the product page for exact
      interface and SNMP version before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Epson
    - tag: model
      value: Epson P7370
    - tag: family
      value: SureColor Large Format
    - tag: category
      value: Large-format printer
    - tag: snmp_support
      value: SNMP (remote SNMP confirmed; version varies)
    - tag: evidence_level
      value: A - model-specific SNMP advisory
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: dd08711ff7b84c978b83cde99c12fef0
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 10a795482d964c638c2aac1bafa6e11b
        expression: max(/Epson Epson P7370 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Epson Epson P7370: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 77cd796b1dd04bb8bc443cc07ef914e5
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 6c7c943c1682485fa6b00d639c588029
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cfedf22b366a451cab378313a52e75fa
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1625a3aa38e44fb89e97f271e17caa28
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 29bc1688010845df8edc703019c7c7d3
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9be072f0f8894a69b444329c3bf51173
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 16411528e392434698170900d3aa6b44
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e50aa3d1cb314b98974086374772130f
        expression: last(/Epson Epson P7370 by SNMP/printer.status)=1 or last(/Epson Epson P7370 by SNMP/printer.status)=2
        name: 'Epson Epson P7370: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: fc9ea07baae84dca875be9a63215ebfe
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f54cd269ed10465ab2827455dee78e33
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2dd5037853f14e3a8b27b880e60b5713
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 83e7c4a8a60f48989932b61db8e807cc
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 6cc6349f71df445a96a5e47136284b23
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: d72b3f61a6be4017b52c107d9a6dbd65
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 3b516866180c4350add03e87c424aeb5
        expression: last(/Epson Epson P7370 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Epson Epson P7370: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 550b25c95a264740b8aaac0f6be35005
        expression: last(/Epson Epson P7370 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Epson Epson P7370 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson P7370 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Epson Epson P7370 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Epson Epson P7370: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: fc533f4f0b8a4844b2f1a22f7391d7cd
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson P7370 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson P7370 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 14d5cb791c29420589d255c87c195e87
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: a44eaefab00f4ee481f49cd384ae6094
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 569b6e1182eb4765a3e6456a55a15417
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: ae322a3a23a646e3b9475f9501716563
        expression: last(/Epson Epson P7370 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Epson Epson P7370: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 1737ff8e2a6e482485b412096fe58e5c
        expression: last(/Epson Epson P7370 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Epson Epson P7370 by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and
          (100*last(/Epson Epson P7370 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Epson Epson P7370 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Epson Epson P7370: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: c3807d5084f34906ba9c1a7346e7d992
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson P7370 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson P7370 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: bab7525b7f104f63a1521e19e3efff60
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 93325c6c0fc54eb39485ef0075941129
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: c552522c3bca40a1a9c6f324e9ee7465
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Epson Epson P7370 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 8f1c7525d8be4b5a9b24c02ab9df7095
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: a0a122e5eeaa466c95b5efa636e8a91c
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: eea39163326c40fbaaad968e22c91dc7
    name: 'Epson Epson P7370: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Epson Epson P7370 by SNMP
        key: printer.page.count
