zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 7e6e60141e9c49a6acc777d89748664d
    template: Konica Minolta bizhub 5001i by SNMP
    name: Konica Minolta bizhub 5001i by SNMP
    description: 'Zabbix 7.0.x SNMP template for Konica Minolta bizhub 5001i.


      Verified source database date: 2026-09-27.

      Family/series: bizhub One i-Series.

      Category: MFP / printer; B&W.

      Network: Ethernet; Wi-Fi options vary.

      Verified SNMP support: SNMPv1/SNMPv3 platform support.

      Evidence level: B - current model + platform security paper.

      Canada status: Current Konica Minolta Canada i-Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://konicaminolta.ca/en/business/technology/i-series

      SNMP evidence source: https://www.konicaminolta.com/global-en/security/mfp/setting/pdf/SecurityTechnicalSupportPaper_en.pdf

      Verification notes: Current Canada i-Series model list combined with Konica Minolta''s security technical support paper documenting SNMP device management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Konica Minolta
    - tag: model
      value: bizhub 5001i
    - tag: family
      value: bizhub One i-Series
    - tag: category
      value: MFP / printer
    - tag: snmp_support
      value: SNMPv1/SNMPv3 platform support
    - tag: evidence_level
      value: B - current model + platform security paper
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: ce07b44a2f3c42509a06bc0cdbdd3759
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 603c50bc9e26436e9f0a37053780c1de
        expression: max(/Konica Minolta bizhub 5001i by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Konica Minolta bizhub 5001i: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 3e1cd79f4a2d4dd6bd12d511ec9b54cd
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: e84ef6ca6e61427294de1aa0d501fcc1
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 37b5da84bc35405696e638cc57210eb3
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 78fc02c28dc14f64aa25a39bedebf109
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f750b68af4c046199cdf38c66c1ef4be
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 072ee04c34c84363815c8fc7240c1058
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 48569eaf83d848afa53f33defa531663
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 253ab2620a51468ea28ff8969e9e94b3
        expression: last(/Konica Minolta bizhub 5001i by SNMP/printer.status)=1 or last(/Konica Minolta bizhub 5001i by SNMP/printer.status)=2
        name: 'Konica Minolta bizhub 5001i: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 8061aeaaf17f4b77aee6fc045f6d9a13
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b6cb34a539b349348c1547d50ac28261
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a1d66d7baea64abf93f3def8d86a4e78
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 987d53187f594eb28432e96aa46c70d5
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 24c9c767ba914a8bb20816b9e163fae1
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: eb5fe285c866451884a015361adb69e0
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 55c3512d52fe4b1cb11f18034f49a52a
        expression: last(/Konica Minolta bizhub 5001i by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 5001i: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: d72014b8298c41b3898a0424757caf91
        expression: last(/Konica Minolta bizhub 5001i by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 5001i by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 5001i by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 5001i by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Konica Minolta bizhub 5001i: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 6ac1aece8b28443ea2b11b34b5e17eb8
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 5001i by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 5001i by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 7e675b07ae2840fd830c6320dc9f90ca
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 7e928260752a4390b0fa6749b032924d
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: c6a2b516d1554616bcfe3ad59833894e
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 7daee87e5d684eb2b07b5121885169af
        expression: last(/Konica Minolta bizhub 5001i by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 5001i: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 1fd0b657eddd42a2ae12ab328c782f27
        expression: last(/Konica Minolta bizhub 5001i by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 5001i by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 5001i by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 5001i by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Konica Minolta bizhub 5001i: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 11eb743b345e49979ec51528a2729cb6
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 5001i by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 5001i by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 51a0abeba66843a898a6da9d30f8dfe6
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 7691694e34644052a012d5ccdc84dee3
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: b852f2ca1b054a03b795dcfaa329ae2c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Konica Minolta bizhub 5001i by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: ae496140352b4978a4ef24c42553ae5e
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 9cbf78f740854e8bb0f3c6514f6ff8c5
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: db991353d01e4a8296e418189ae15c17
    name: 'Konica Minolta bizhub 5001i: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Konica Minolta bizhub 5001i by SNMP
        key: printer.page.count
