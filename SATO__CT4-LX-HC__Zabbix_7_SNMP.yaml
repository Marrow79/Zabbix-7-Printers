zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: a3aed7d5ec10448bbe9e7ae1958af541
    template: SATO CT4-LX-HC by SNMP
    name: SATO CT4-LX-HC by SNMP
    description: 'Zabbix 7.0.x SNMP template for SATO CT4-LX-HC.


      Verified source database date: 2026-09-27.

      Family/series: CT4-LX.

      Category: Healthcare label printer; B&W/label.

      Network: Ethernet standard; Wi-Fi optional.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: North American product page; Canada sales/support via SATO Americas.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.satoamerica.com/products/printers/desktop/ct4-lx-hc/specifications/

      SNMP evidence source: https://www.satoamerica.com/products/printers/desktop/ct4-lx-hc/specifications/

      Verification notes: Official specifications explicitly list Ethernet and SNMP Ver. 3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: SATO
    - tag: model
      value: CT4-LX-HC
    - tag: family
      value: CT4-LX
    - tag: category
      value: Healthcare label printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 09587bf65c6f4428adac0f072e1c9e1b
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 7b8df944deff491db578f19a91efd2c8
        expression: max(/SATO CT4-LX-HC by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'SATO CT4-LX-HC: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 8d0507d89307439d9860c32e9534a566
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 6c9b22fe4fcf49d5bf037cfd54d8abf4
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9d5d0c80237e49cd89c22a1f589981cc
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 34e0a564a908497ea74689cb7787e6db
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c15dcc06d34a48ebb81cf732067cb0dd
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 73ee5734801f49319b767ede59877007
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: ddfa439982b04143a02d5034115e8733
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 7edf74392fe24ac38b3298612bd931e3
        expression: last(/SATO CT4-LX-HC by SNMP/printer.status)=1 or last(/SATO CT4-LX-HC by SNMP/printer.status)=2
        name: 'SATO CT4-LX-HC: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 755492880317468b98fc7b82681a6e5d
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b5d5296afd0243c8a9d5d9f6837c81cb
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e3acb556e5184fdea7e44d7c299fa9f8
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: e379544bc27a4e6c8be0f6513a13e2ac
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 82702048950b45829dc5a0cb25516bfc
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 2141a6a9699a40aabdf82564e71d8fd6
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: d61a262823a74bd096cbcf0063e94b4f
        expression: last(/SATO CT4-LX-HC by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'SATO CT4-LX-HC: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 51b613616a334d4492d1a840487687d7
        expression: last(/SATO CT4-LX-HC by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/SATO CT4-LX-HC by SNMP/printer.supply.max[{#SNMPINDEX}])>0 and (100*last(/SATO
          CT4-LX-HC by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/SATO CT4-LX-HC by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'SATO CT4-LX-HC: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 1e646a9951bf400cb945aa6f036736c0
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: SATO CT4-LX-HC by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: SATO CT4-LX-HC by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 179eb6df73d94d73b9d6e6201bc1efdd
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: e1d2587d68cc4ed59682edb0f5a374fa
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 015b52be0ad74deea5af2fd61b5858e5
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 7fd6edbaf0fb45af91ccfc6acb6253f1
        expression: last(/SATO CT4-LX-HC by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'SATO CT4-LX-HC: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: f4e07b5cae744002a4408a493eeaad33
        expression: last(/SATO CT4-LX-HC by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/SATO CT4-LX-HC by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and (100*last(/SATO
          CT4-LX-HC by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/SATO CT4-LX-HC by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'SATO CT4-LX-HC: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 192d330a2f7d4c9ab34de521a916c6f5
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: SATO CT4-LX-HC by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: SATO CT4-LX-HC by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: c31eafc69d324d53b1c0e413d76c1732
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 00ad405d4ad84d89a9d928507d64b27c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 5cf77047530645b19e20d280b6d9a82e
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: SATO CT4-LX-HC by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 12c1e45639f142e7b32e3d5312f04ee0
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 451dc037455f4111a6698f2bbe0af428
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 299d7f15ccb54c678056135e67a4c7c1
    name: 'SATO CT4-LX-HC: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: SATO CT4-LX-HC by SNMP
        key: printer.page.count
