zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: bc4944b3acb540ab958438365c7a554d
    template: Canon imageCLASS MF465dw II by SNMP
    name: Canon imageCLASS MF465dw II by SNMP
    description: 'Zabbix 7.0.x SNMP template for Canon imageCLASS MF465dw II.


      Verified source database date: 2026-09-27.

      Family/series: imageCLASS MF400.

      Category: Mono MFP; B&W.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product/catalog page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://shop.canon.ca/en_ca/p/imageclass-mf465dw-ii

      SNMP evidence source: https://shop.canon.ca/en_ca/p/imageclass-mf465dw-ii

      Verification notes: Canon Canada product/specification pages list SNMP V3.0 and network connectivity.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Canon
    - tag: model
      value: imageCLASS MF465dw II
    - tag: family
      value: imageCLASS MF400
    - tag: category
      value: Mono MFP
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: b85910ac2d544684b661dff096d6077c
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: c2add135b4d645a08af62f850cd0e004
        expression: max(/Canon imageCLASS MF465dw II by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Canon imageCLASS MF465dw II: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 1c47018f547a4eb2bbaf3c4454426278
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 210cf18733e74bd499ba1c111a2d9488
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 41ccccae662d44f9a2a8428366a9fde2
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 220507d724564ac1bcd7c871e41528b1
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 87bb1c60daaa4507b1fda18d28593aa7
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4b94f4e35eeb41f7a8769d8360dd202e
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 7b1e0be2b867431c9d0491e89dd7080b
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e49b06c16f46423194e710182321ed57
        expression: last(/Canon imageCLASS MF465dw II by SNMP/printer.status)=1 or last(/Canon imageCLASS MF465dw II by SNMP/printer.status)=2
        name: 'Canon imageCLASS MF465dw II: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: c2ef2105a76d43b6aeee110e6439dce5
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7c2a9488793e4f9d83ee264e90e3dec9
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: dc486d77b4194a1894ed49bff2b204bf
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 4e7fd2edd9d347a89457358e31a19809
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: da35c66612bd453eba6b3f0ed36bee4c
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: a744bbb16d934a6ba2cab50a155bf273
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 3fdca1f9ca1643a59c77b528437c728c
        expression: last(/Canon imageCLASS MF465dw II by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS MF465dw II: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 3d8abd5b68004da98a8ca7d449462d6f
        expression: last(/Canon imageCLASS MF465dw II by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS MF465dw II by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS MF465dw II by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Canon imageCLASS MF465dw II by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Canon imageCLASS MF465dw II: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a1c9a98775ea40d9b5019f4f9220d23c
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS MF465dw II by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS MF465dw II by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: bf17c61dd9314704bd976476dc5f2887
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 30898aaa8e214caa825c8a22360bcd75
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: af4940b7c5fd42bb911b4339b72cefdd
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 226a5bc9014c4cffa483586bfcae056a
        expression: last(/Canon imageCLASS MF465dw II by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS MF465dw II: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 26b2729677254cbdb46bbc7f508b2f74
        expression: last(/Canon imageCLASS MF465dw II by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS MF465dw II by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS MF465dw II by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Canon imageCLASS MF465dw II by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Canon imageCLASS MF465dw II: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 530b45fbef0345c089880967c8561470
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS MF465dw II by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS MF465dw II by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: fb249f5bdbcd4723969eee7bf2faec23
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: dd8600e7b5134088b792d97e4d2afc37
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: db425f482bf942159ec3dcd502deb050
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Canon imageCLASS MF465dw II by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 80d839d1ad574f7fa30ddebf3fcf3fed
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 1fdfe504ed684747a90e39c0d55e8871
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 16c222045c4c42018ca4064947b3b4dd
    name: 'Canon imageCLASS MF465dw II: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Canon imageCLASS MF465dw II by SNMP
        key: printer.page.count
