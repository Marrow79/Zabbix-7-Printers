zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: cb93bbae1384474287e37adf9ee4254a
    template: Canon imageCLASS LBP647Cdw by SNMP
    name: Canon imageCLASS LBP647Cdw by SNMP
    description: 'Zabbix 7.0.x SNMP template for Canon imageCLASS LBP647Cdw.


      Verified source database date: 2026-09-27.

      Family/series: imageCLASS LBP600.

      Category: Laser printer; Colour.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product/catalog page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://shop.canon.ca/en_ca/p/imageclass-lbp647cdw

      SNMP evidence source: https://shop.canon.ca/en_ca/p/imageclass-lbp647cdw

      Verification notes: Canon Canada product/specification pages list SNMP V3.0 and network connectivity.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Canon
    - tag: model
      value: imageCLASS LBP647Cdw
    - tag: family
      value: imageCLASS LBP600
    - tag: category
      value: Laser printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: fe71b6b4ae9749739c949ad19aff2b88
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: ee0b42c814334eb0945a178f4a099b57
        expression: max(/Canon imageCLASS LBP647Cdw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Canon imageCLASS LBP647Cdw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: d59e2bd587b24a45a7d24c7fff7e3358
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 5b0f268418144d7580035310a8353b8b
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e2165fffa1134dde87914705627316c5
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0ef9b94fa4f847ffb0af6faea7888257
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 193d70a7974d4a8e89d350c250fd4977
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f87d6966f758420388f2203a4be4691b
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 23a6e1b37e8a4c298955b9984a392046
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: c19ec612e5524a4a9470d0f16fd53e6f
        expression: last(/Canon imageCLASS LBP647Cdw by SNMP/printer.status)=1 or last(/Canon imageCLASS LBP647Cdw by SNMP/printer.status)=2
        name: 'Canon imageCLASS LBP647Cdw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 31d925d16df147a5a14a6f9fe71bc202
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0ffb89f0a63c45b4a680d9dd48801bfb
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6a20ff5e92664576a5eb6452f03f3120
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 572e5aca7e544381a62bda93fcd9218a
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 0be54a3936bd4abf9f207d08642eb936
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: a9ccfe2673394c8dbe41f5a12ba40b08
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 276ec5f8ec58459b940ac9f0ab20df3e
        expression: last(/Canon imageCLASS LBP647Cdw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS LBP647Cdw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 449658b9fecf483e95c85e1a36758faa
        expression: last(/Canon imageCLASS LBP647Cdw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS LBP647Cdw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS LBP647Cdw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Canon imageCLASS LBP647Cdw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Canon imageCLASS LBP647Cdw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a2071f15dca34dcca41dbe89c90836cc
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS LBP647Cdw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS LBP647Cdw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 9e9ae8075767463598c2e8853896e1f3
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 84098ffdcad74b82aceef645e6a985b3
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 7afbfcb9dfb240f48a62124ce9cf3845
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: c9dbe77362514e0ab9c5fdb4ee2a2c59
        expression: last(/Canon imageCLASS LBP647Cdw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS LBP647Cdw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: be5b7afede744395b77a2a874c595295
        expression: last(/Canon imageCLASS LBP647Cdw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS LBP647Cdw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS LBP647Cdw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Canon imageCLASS LBP647Cdw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Canon imageCLASS LBP647Cdw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 73eaad3510d04b489cf23eca2b434b17
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS LBP647Cdw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS LBP647Cdw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: d63be1a0d6ed42b6a188daa1b6bcedf1
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: e3bd21959cf84271b8a61d49c6d78228
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 3f3920ed4abf472b813015fcd8326555
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Canon imageCLASS LBP647Cdw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 1ff9f2f8e7eb4d1c82b0896d7ffb1b2a
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 2c99c49667c44373a26eef77e2359d43
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: f88a4a51563d40b8a2b9b1ab021f017b
    name: 'Canon imageCLASS LBP647Cdw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Canon imageCLASS LBP647Cdw by SNMP
        key: printer.page.count
