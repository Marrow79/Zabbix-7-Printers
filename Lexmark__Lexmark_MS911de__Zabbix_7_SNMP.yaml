zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 530764c455864984a68f42998a4a003f
    template: Lexmark Lexmark MS911de by SNMP
    name: Lexmark Lexmark MS911de by SNMP
    description: 'Zabbix 7.0.x SNMP template for Lexmark Lexmark MS911de.


      Verified source database date: 2026-09-27.

      Family/series: MS Series.

      Category: Printer; B&W.

      Network: Ethernet (Wi-Fi optional on some).

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: A - model-specific.

      Canada status: Lexmark Canada product/support page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.lexmark.com/en_ca/printers/printer/9326/Lexmark-MS911de

      SNMP evidence source: https://www.lexmark.com/en_ca/printers/printer/9326/Lexmark-MS911de

      Verification notes: Lexmark Canada connectivity section lists Ethernet and SNMPv1/v2c/v3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Lexmark
    - tag: model
      value: Lexmark MS911de
    - tag: family
      value: MS Series
    - tag: category
      value: Printer
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 1a44df7e5fae466fba9da54ef7d80df1
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 4b740c332b7c43fb806fe01a53678fee
        expression: max(/Lexmark Lexmark MS911de by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Lexmark Lexmark MS911de: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 0bbe42abbe134dd1ae5a88383ba8406d
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 5da4cca7bad5428687ef5d1ed6b56df9
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 23e7244de8154af4b62d6a8c575713d3
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b901260272c74f5e9f0ebe4103a7ee2c
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0a3775d39e774b3fbaed817b61801803
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b9c5df129050468bbc9979d281422f6c
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 27a541688b5a4b3d9f07c24460348c61
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 39236d2430fd4165afd0ba202365b5c2
        expression: last(/Lexmark Lexmark MS911de by SNMP/printer.status)=1 or last(/Lexmark Lexmark MS911de by SNMP/printer.status)=2
        name: 'Lexmark Lexmark MS911de: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: ba17a47bd8a64a5cb7fa83a2c1df865c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 75610749377c4266b7f066fd0a6641bb
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3e098dca4a4b48d2be2c953191d95cf8
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 9c16aa9100084aa1a669255d2f86789a
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 90801f143099462bbfeec153bc274a2c
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: d2157ee2e2044ba1bdb536401cc9a39d
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 119518b17ef24eae9c3d3fde7eadccc6
        expression: last(/Lexmark Lexmark MS911de by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark MS911de: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 9048b7375c014ed2b4695ae54749d57b
        expression: last(/Lexmark Lexmark MS911de by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark MS911de by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark MS911de by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Lexmark Lexmark MS911de by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Lexmark Lexmark MS911de: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 338f10edfff9484b9015cfa8faaf4592
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark MS911de by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark MS911de by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 1329815e60994d24a0d5885220ff078d
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 7586749164b843378d99109594b059db
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: ee8168b7b8b5486d9c2beeaeae2aa975
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: bcc7b935c98f4b83b0d60ab1968ddea1
        expression: last(/Lexmark Lexmark MS911de by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark MS911de: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 12aaec286b6c4dfca6d578ced666dd52
        expression: last(/Lexmark Lexmark MS911de by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark MS911de by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark MS911de by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Lexmark Lexmark MS911de by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Lexmark Lexmark MS911de: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 149c3468ab2d4bc5afdd1011073f88d7
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark MS911de by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark MS911de by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 82182fe713714f9eb8e019b06c0116ee
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 94a5b85d8ad845bfa2cdcbd3f19bcf00
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: cf7a6c33274649ecb205bb18ccc673b1
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Lexmark Lexmark MS911de by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: bdaf627d327e401ab6e99cba6f382bab
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 1bf3b863c43c466989ea70143a742db4
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: cf3f119d33c0409fa1c77ab00a14def9
    name: 'Lexmark Lexmark MS911de: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Lexmark Lexmark MS911de by SNMP
        key: printer.page.count
