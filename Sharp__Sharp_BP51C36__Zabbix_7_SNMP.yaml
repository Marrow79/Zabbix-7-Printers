zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: a089556655f04b9786253de8f224a2d1
    template: Sharp Sharp BP51C36 by SNMP
    name: Sharp Sharp BP51C36 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Sharp Sharp BP51C36.


      Verified source database date: 2026-09-27.

      Family/series: Sharp BP Series.

      Category: Office MFP / printer; Colour.

      Network: Gigabit Ethernet; Wi-Fi standard/optional by model.

      Verified SNMP support: SNMPv3.

      Evidence level: B - current/recent model + BP platform.

      Canada status: Sharp Canada current/recent business catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://sharp.ca/en/products/business-copiers-printers-office-copiers-printers/

      SNMP evidence source: https://sharp.ca/en/products/business-copiers-printers-office-copiers-printers/

      Verification notes: Sharp BP product pages use a common network stack and list SNMPv3; exact current catalog status varies for older BP70/BP80 models.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Sharp
    - tag: model
      value: Sharp BP51C36
    - tag: family
      value: Sharp BP Series
    - tag: category
      value: Office MFP / printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: B - current/recent model + BP platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 59620a8661304e9ea07e93aef4c57f5c
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: ac65546873d54d3382d9f9381f1a9ff7
        expression: max(/Sharp Sharp BP51C36 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Sharp Sharp BP51C36: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 004f1d97a65142c3af726af6c9bd09e5
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 50c72e75f18e46e9aa3d3ac5afb9d3f7
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5827386aa45843b4838de4af5c8f2999
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: fcc58ad427834a9385f75a47c1e62ac3
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9d323824cfd14ac195ecc35d295bf4ff
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bff0726c5b28459b88f5f0b78967e7fe
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 359adc720dc54563a0b2f51b033fcd20
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 8797b359f7434c7c89aaa2c3fd399673
        expression: last(/Sharp Sharp BP51C36 by SNMP/printer.status)=1 or last(/Sharp Sharp BP51C36 by SNMP/printer.status)=2
        name: 'Sharp Sharp BP51C36: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: e71c85c8d3f2413f89c0255c645169fb
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1da889e5d5644a7abc064cd704fe98cc
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 311f27fe6e564da3a30ba8f01c04e098
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: a51865d219aa4310b886a8ddd135f517
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: a69ec43f131f49299e9c4020100a7c07
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 9b398feb2dd4418193e16645c9554701
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: d6262a063b694acfb6d36a8c6ad989a2
        expression: last(/Sharp Sharp BP51C36 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Sharp Sharp BP51C36: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 840346e794b3404587037d42e58bfda5
        expression: last(/Sharp Sharp BP51C36 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Sharp Sharp BP51C36 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Sharp Sharp BP51C36 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Sharp Sharp BP51C36 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Sharp Sharp BP51C36: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 194822ca60924a7ead64d860402c22dc
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Sharp Sharp BP51C36 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Sharp Sharp BP51C36 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 0ee1bbbba32c406c93676b40923734ec
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 703053994d5842028ed35468d131a89f
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 25d189c9351f4608a94ec9fc4dd3c765
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 8ef18164d64b473699a886f67ae44b4c
        expression: last(/Sharp Sharp BP51C36 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Sharp Sharp BP51C36: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: eca90a60296b494787a51e20a49b7b88
        expression: last(/Sharp Sharp BP51C36 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Sharp Sharp BP51C36 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Sharp Sharp BP51C36 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Sharp Sharp BP51C36 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Sharp Sharp BP51C36: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 64b5c54f2a734b01975bbd40915f7c29
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Sharp Sharp BP51C36 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Sharp Sharp BP51C36 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 212af3fe947a4ade942f9587859094dd
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 48f3c830cce9465db2712d4430c0e377
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 7962f2335d0944dba207228cdd32fcb2
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Sharp Sharp BP51C36 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 33c3fbe8993b48b1adbee50010b0b595
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 47c8a5dd9a454989a54056a4a30ed659
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 9640872f6449418b9703a89f538071d4
    name: 'Sharp Sharp BP51C36: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Sharp Sharp BP51C36 by SNMP
        key: printer.page.count
