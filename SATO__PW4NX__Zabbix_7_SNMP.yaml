zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 91cf655035304f2bb9fe6fde4119248a
    template: SATO PW4NX by SNMP
    name: SATO PW4NX by SNMP
    description: 'Zabbix 7.0.x SNMP template for SATO PW4NX.


      Verified source database date: 2026-09-27.

      Family/series: PW4NX.

      Category: Mobile label printer; B&W/label.

      Network: Wi-Fi.

      Verified SNMP support: SNMP.

      Evidence level: A - model-specific manual.

      Canada status: North American product/support documentation.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.satoamerica.com/content/dam/sato/sales/content/us/en/support-downloads/printers/mobile-printers/pw4nx/operator---technical-manuals/20221222_PW4NX_Operator_Manual_Version3.pdf.coredownload.inline.pdf

      SNMP evidence source: https://www.satoamerica.com/content/dam/sato/sales/content/us/en/support-downloads/printers/mobile-printers/pw4nx/operator---technical-manuals/20221222_PW4NX_Operator_Manual_Version3.pdf.coredownload.inline.pdf

      Verification notes: Operator manual documents SNMP network monitoring/management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: SATO
    - tag: model
      value: PW4NX
    - tag: family
      value: PW4NX
    - tag: category
      value: Mobile label printer
    - tag: snmp_support
      value: SNMP
    - tag: evidence_level
      value: A - model-specific manual
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 56b9808867664e2489fb37f0022131ce
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 39a2203332864c7dbb72983e73227bba
        expression: max(/SATO PW4NX by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'SATO PW4NX: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 0aadf915d1544c7b8c80a1cd1b7b0569
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 14ea9f20f53d429088585f94d64b1b65
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 86746ed86c694841810bf1b72fcde215
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9deda3acb8734e24a53388be5f868dcc
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 01a92702da2f48a39d85c2f9eac7ba56
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 762d784f7763403e8dede1e0a142bb7b
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: f24a230fddeb497bb7fa4815378857d2
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: f664649b29a64d17ac1471fac5495691
        expression: last(/SATO PW4NX by SNMP/printer.status)=1 or last(/SATO PW4NX by SNMP/printer.status)=2
        name: 'SATO PW4NX: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 46d09f018b7747128e8599fa95e6b2c3
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 00836edeafa54041af7cb8ff4942458f
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cfa1247f535f4fecaf2a6f0c7202580c
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 43a9ee4727144b358a721cba3e22dc98
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: d68d684a04a54086882161d9f364a09b
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: c5d51e2aa02548e491404673f2ada206
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 16e9f200c186493398c303d2dae77c17
        expression: last(/SATO PW4NX by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'SATO PW4NX: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 151c936e9c124176a4b037abf1def65c
        expression: last(/SATO PW4NX by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/SATO PW4NX by SNMP/printer.supply.max[{#SNMPINDEX}])>0 and (100*last(/SATO
          PW4NX by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/SATO PW4NX by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'SATO PW4NX: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 5d74a3904b9940beb88f7c98e8df952b
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: SATO PW4NX by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: SATO PW4NX by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 2131b1b2254a48139616ccc8fbfc6144
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 0a1679a1e5c942baa94e436681dc6b77
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 2c477e80457649c5a77cb6ab37bae3a0
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: dc3706e01b4e407d8c2a8d3e9ec2f4fd
        expression: last(/SATO PW4NX by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'SATO PW4NX: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: c8a44e1d03924addb9ec35a252227cae
        expression: last(/SATO PW4NX by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/SATO PW4NX by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and (100*last(/SATO
          PW4NX by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/SATO PW4NX by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'SATO PW4NX: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 7265a0956d5c4f469b8880790cce6769
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: SATO PW4NX by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: SATO PW4NX by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: bde3d7024b8c44fb837b72ee635714bf
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 0f1f22ed68104897929d1c72020517e2
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 44bd7a6ee5bc4861a6a7a80295cbdc83
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: SATO PW4NX by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 7960eb83fec54bb18d58ee09ff40ea62
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 846c38f0cef941a3a2e99065f42e3c05
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 7199c69b69e34942bd4a93b494d000ff
    name: 'SATO PW4NX: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: SATO PW4NX by SNMP
        key: printer.page.count
