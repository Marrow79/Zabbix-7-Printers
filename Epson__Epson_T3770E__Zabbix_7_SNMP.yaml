zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: df071f023e1547ba80cbb74cf408bb30
    template: Epson Epson T3770E by SNMP
    name: Epson Epson T3770E by SNMP
    description: 'Zabbix 7.0.x SNMP template for Epson Epson T3770E.


      Verified source database date: 2026-09-27.

      Family/series: SureColor Large Format.

      Category: Large-format printer; Colour.

      Network: IP network interface (wired and/or wireless by model).

      Verified SNMP support: SNMP (remote SNMP confirmed; version varies).

      Evidence level: A - model-specific SNMP advisory.

      Canada status: Epson Canada support-listed; current-sale status varies.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://epson.ca/support/wa00965

      SNMP evidence source: https://epson.ca/support/wa00965

      Verification notes: Epson Canada''s SNMP vulnerability advisory explicitly lists this model, establishing remote SNMP support. Check the product page for exact
      interface and SNMP version before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Epson
    - tag: model
      value: Epson T3770E
    - tag: family
      value: SureColor Large Format
    - tag: category
      value: Large-format printer
    - tag: snmp_support
      value: SNMP (remote SNMP confirmed; version varies)
    - tag: evidence_level
      value: A - model-specific SNMP advisory
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: cdf9b759bac94c9ebafadffed135ac72
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 4b966890315e46f99c26ee42abf10c06
        expression: max(/Epson Epson T3770E by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Epson Epson T3770E: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 52e294d78ac448899c5ca5f9e98dd8e2
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 0621e68afeee4e82b737b760150778d6
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: be267dbc13434ee5a945cf93c6fabd86
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 846eb2f821b2486a982b3c1f3117a185
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c722f1b7fb9a419ba383d860f50f0906
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: dd0b99ada9bb4119b06d8fc2c6f14dcd
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 2c3fd68007c34675a75566cdc0b1212c
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: f29d1f21c06044768f01cab7baec799b
        expression: last(/Epson Epson T3770E by SNMP/printer.status)=1 or last(/Epson Epson T3770E by SNMP/printer.status)=2
        name: 'Epson Epson T3770E: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 92c63ccad52c4f41852d7a0ced106c63
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cc8a332372b141fab0604530b9d80711
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 795b76917923483a8053d2e9c6f0de9f
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 6e619cda8b0e44b7bc70531caf7502fc
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: d4be1e3cd31f4edeb6e344b28f52fe47
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 34a89ee33d0d40f5aa24a5ca22dacc0f
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 413a554ad3de44d79ec9bca699e4e69f
        expression: last(/Epson Epson T3770E by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Epson Epson T3770E: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: e90ef974aa164fe9a9e684c1504ad532
        expression: last(/Epson Epson T3770E by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Epson Epson T3770E by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson T3770E by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Epson Epson T3770E by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Epson Epson T3770E: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: cd4f5ec7144049d7878b2a7238f4f46d
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson T3770E by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson T3770E by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: d0e501bb508148f986617e68371f4ca7
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 41ab43568e51414ebc727600e421735c
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 9079c03f8cad4b62b62df862081440ad
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 4130c7bc9ef24ae8974cb8f6672de80f
        expression: last(/Epson Epson T3770E by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Epson Epson T3770E: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 273a1db96a0045d9a68f2a9aa17ce1bc
        expression: last(/Epson Epson T3770E by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Epson Epson T3770E by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and
          (100*last(/Epson Epson T3770E by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Epson Epson T3770E by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Epson Epson T3770E: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 7dbb0a6134e6476d9d4fb72646757c8f
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson T3770E by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson T3770E by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: a1028130e83247678a61b3a8609c0d25
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 05e9a7ce44b841f8ad2efbef60b64ee5
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 5ea66582c55e4c2c9e296c2964de21ef
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Epson Epson T3770E by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 413f8608c94e4c9081e216d51ab43d53
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: d9cdd3a68514498c91efeb8bc767c8ec
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: f5d2d0cddfd44387aab7316433cc0abe
    name: 'Epson Epson T3770E: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Epson Epson T3770E by SNMP
        key: printer.page.count
