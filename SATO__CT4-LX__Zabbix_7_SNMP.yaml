zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 055a98432c514699afc2ff0a27baa58b
    template: SATO CT4-LX by SNMP
    name: SATO CT4-LX by SNMP
    description: 'Zabbix 7.0.x SNMP template for SATO CT4-LX.


      Verified source database date: 2026-09-27.

      Family/series: CT4-LX.

      Category: Desktop label printer; B&W/label.

      Network: Ethernet standard; Wi-Fi optional.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: North American product page; Canada sales/support via SATO Americas.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.satoamerica.com/products/printers/desktop/ct4-lx/specifications/

      SNMP evidence source: https://www.satoamerica.com/products/printers/desktop/ct4-lx/specifications/

      Verification notes: Official specifications explicitly list Ethernet and SNMP Ver. 3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: SATO
    - tag: model
      value: CT4-LX
    - tag: family
      value: CT4-LX
    - tag: category
      value: Desktop label printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 6e232ac057f244709320310d62149ae1
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 3c198c7a8d3e47d080d59e9c0326764c
        expression: max(/SATO CT4-LX by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'SATO CT4-LX: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 006476935da24059af2720d40032d4ae
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: ee6f50904c1f473486c8e07a6cbc94c5
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 49fa9a8ccfd440108e213ea19405cd65
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cf7408835e094e6e86c7c2cb8bc41dc7
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 71154bc40d1645fa83faf8aa78d8e848
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: de00eea390f84173b4875bc14d4b1d78
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: ef5dea112410467386c18d5615b4e8e2
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 66d50215f1be4fa28ebbbaad66e58adf
        expression: last(/SATO CT4-LX by SNMP/printer.status)=1 or last(/SATO CT4-LX by SNMP/printer.status)=2
        name: 'SATO CT4-LX: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 5c889a28faf04bc9ae299885006871a2
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 63bd58b8e6b04f728a97ccd456a41b8d
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9cb0e963df804553a094bc9131d81435
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 403218dc5685407c82c37d4558d4c9b4
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 4ace13556d214d209d22e479f11718d7
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: ce3b203767c3445e9b6f7681d6dcf63c
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 27cfd5a747094e3684be68d9f53a90de
        expression: last(/SATO CT4-LX by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'SATO CT4-LX: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 4b54597d92d24455ad85f6851d71c1ab
        expression: last(/SATO CT4-LX by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/SATO CT4-LX by SNMP/printer.supply.max[{#SNMPINDEX}])>0 and (100*last(/SATO
          CT4-LX by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/SATO CT4-LX by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'SATO CT4-LX: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 7effb5b44b704524bdec35ba373b8b6b
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: SATO CT4-LX by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: SATO CT4-LX by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: ff00bb911bf24ad2a7c53c9723ed5e9d
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: c93f74c1bf394adcb195b9359ef9ad5e
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: dc9402a5903541848a52c19a91775c11
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 4f8ac90b093442598aaf596983bc0b2e
        expression: last(/SATO CT4-LX by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'SATO CT4-LX: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 8e1e5bac24ec4a36a30255e5aac99321
        expression: last(/SATO CT4-LX by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/SATO CT4-LX by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and (100*last(/SATO
          CT4-LX by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/SATO CT4-LX by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'SATO CT4-LX: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: e92de88c51e54b498ca8a0597dc0155a
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: SATO CT4-LX by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: SATO CT4-LX by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b222bbb80a674b11b2e026a80181bbe1
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: fd3fd0268d55486c8ddaeab8f22e2cd6
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: bcdcb6c4692d4786b153b1e5df923e9d
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: SATO CT4-LX by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 4f6968e881614d369d0145114e244c9a
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: c5e1c87934e942eeb9a202d7dc119888
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: fc8257a55a49439d99d75060414790e9
    name: 'SATO CT4-LX: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: SATO CT4-LX by SNMP
        key: printer.page.count
