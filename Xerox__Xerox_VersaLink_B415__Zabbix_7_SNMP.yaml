zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 77e473831df54cf1af65ee4149f4293f
    template: Xerox Xerox VersaLink B415 by SNMP
    name: Xerox Xerox VersaLink B415 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Xerox Xerox VersaLink B415.


      Verified source database date: 2026-09-27.

      Family/series: B400 Series.

      Category: Mono MFP; B&W.

      Network: Ethernet.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Current Xerox Canada shop.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.shop.xerox.ca/en/versalink-b415

      SNMP evidence source: https://www.shop.xerox.ca/en/versalink-b415

      Verification notes: Current Xerox Canada product/security documentation explicitly lists SNMPv3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Xerox
    - tag: model
      value: Xerox VersaLink B415
    - tag: family
      value: B400 Series
    - tag: category
      value: Mono MFP
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 9fc68bdf53a54f578a98817bd1646910
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: fef7b1c81f694571bdf751cafe2944b8
        expression: max(/Xerox Xerox VersaLink B415 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Xerox Xerox VersaLink B415: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 73288c3ec5884305971ce1e43f504367
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: b6c4c9fdd7c34a93b91c0fc990528651
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a6308f7f6e6a44188eac55291312a62d
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b6168f7608a443d7adebbe72edbd5130
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4a6bba2f4ce24319b041d3c8a5247f18
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9ba9bc8b084a4baba186ea0a8d1e1ddf
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 89549ba6c21c43cc886dbca5cc8f1db8
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 447745e4c99a45efa1d14ee8f95ed8d8
        expression: last(/Xerox Xerox VersaLink B415 by SNMP/printer.status)=1 or last(/Xerox Xerox VersaLink B415 by SNMP/printer.status)=2
        name: 'Xerox Xerox VersaLink B415: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 5d7d9cd0eb6e4243ad9db0bf9e8e7b77
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2c421bd9fe3f4a71abac6eb93c991713
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 32abb9f44ff9426aa212f360d8b43bf8
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: b6b1a5a0525c4549b31acd8758bfe131
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: a98ece67bb704886b0bc9550b73a1970
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: c67a5c5f04bc425885161a03e9af08c6
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: a407a409ed314c73bd3d5cebf3bac76c
        expression: last(/Xerox Xerox VersaLink B415 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox VersaLink B415: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 77188e1332b647c8a629e0e3d87e32c4
        expression: last(/Xerox Xerox VersaLink B415 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox VersaLink B415 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox VersaLink B415 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Xerox Xerox VersaLink B415 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Xerox Xerox VersaLink B415: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 9103d3fd2cf247bcb8bd2e8f74986812
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox VersaLink B415 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox VersaLink B415 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 43f10c4fce784e378564650d22852c36
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: c1c5038e12134ac1b2e786298734b02d
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 5ffea2d8b4fa4856ad3dbf17696b7152
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 3da84442175346eb8dcf0f71944486a8
        expression: last(/Xerox Xerox VersaLink B415 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox VersaLink B415: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 793d1954ffc64b8bbe2925a938b64f75
        expression: last(/Xerox Xerox VersaLink B415 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox VersaLink B415 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox VersaLink B415 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Xerox Xerox VersaLink B415 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Xerox Xerox VersaLink B415: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: bf0055599d084989b378677f0690566e
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox VersaLink B415 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox VersaLink B415 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 9d8f05af06424d738dfb76a55d580a16
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 36c7ff9df6204b85bf64ba3f6c8ecb0d
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 5cb62386c4924f3d8c0662cd9edc6eb3
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Xerox Xerox VersaLink B415 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: ec2c22e974c84407ba0703a922348d43
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: d5952a3c62cf43f193def3e04be7c3e2
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 21fa6c9dfab4450da61110e98b7dccdf
    name: 'Xerox Xerox VersaLink B415: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Xerox Xerox VersaLink B415 by SNMP
        key: printer.page.count
