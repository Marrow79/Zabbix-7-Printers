zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 045841edb5ca48879ca0033ac0a8fee3
    template: HP HP LaserJet Enterprise M776dn MFP by SNMP
    name: HP HP LaserJet Enterprise M776dn MFP by SNMP
    description: 'Zabbix 7.0.x SNMP template for HP HP LaserJet Enterprise M776dn MFP.


      Verified source database date: 2026-09-27.

      Family/series: LaserJet Enterprise.

      Category: Laser MFP; Colour.

      Network: Gigabit Ethernet; Wi-Fi where configured.

      Verified SNMP support: SNMPv2/v3 (v1 on some models).

      Evidence level: B - current model + family/platform.

      Canada status: Current HP Canada enterprise catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.hp.com/ca-en/shop/listings/printers?jumpid=in_r11839_fr&segment=business&subbrand=laserjet-enterprise

      SNMP evidence source: https://www.hp.com/ca-en/shop/products/printers/hp-laserjet-enterprise-m430f-multifunction-black-white-laser-printer-3pz55a-bgj

      Verification notes: HP Enterprise platform documentation/product specs expose SNMP network management; exact legacy SNMP version mix varies by model.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: HP
    - tag: model
      value: HP LaserJet Enterprise M776dn MFP
    - tag: family
      value: LaserJet Enterprise
    - tag: category
      value: Laser MFP
    - tag: snmp_support
      value: SNMPv2/v3 (v1 on some models)
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 0f97fd0a19e54220abdfe444a21ee4fe
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 3cef5a12491849d3bbd956ae661a6371
        expression: max(/HP HP LaserJet Enterprise M776dn MFP by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'HP HP LaserJet Enterprise M776dn MFP: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: a771f03fe74f49d484daee1a02963d02
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: ab7f149a8c864ba699d0dd2d0ff3cbf6
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c059ce60ed46465086c09386eb29e0fd
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 253c3461077744408df6442601f3dbd8
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 325283a9b6b74aaf8177bb26663117cb
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7d52791daef5461b839563d09eac004f
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 7dd06e4fee1d4677b5464baba6c578e4
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e7096d00f8b84cbfa4159f9b7923d97c
        expression: last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.status)=1 or last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.status)=2
        name: 'HP HP LaserJet Enterprise M776dn MFP: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: c152521e4e3c472fb3285826eaf4d9f2
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 293c761659d047219e6b542f5f1115d0
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0a0160375d524a80ad3f88d9d459bbb8
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 55aec6ba9412460c85e2edf2cdf71951
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 75eabc56329d49718934bec92257308f
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: b72126b5e66a43299e80f4ad31ab081e
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 591da050031b49e1ad209bab736dec97
        expression: last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Enterprise M776dn MFP: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 33bc431430a74562a6b44faf8daf8435
        expression: last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'HP HP LaserJet Enterprise M776dn MFP: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 62fc2253ec174ff3bf5180d0d9c82ac2
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Enterprise M776dn MFP by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Enterprise M776dn MFP by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 9925f6f82a7749209eeecfd9a6d09fab
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 5d3844f344944080bfec6de56eac2e5e
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 0cb7f417090945ecbb6765bd8d891b50
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 10c12beb76624b21911d253474a11e8b
        expression: last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Enterprise M776dn MFP: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 65e985e75d864b6ca16c467134041c8d
        expression: last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/HP HP LaserJet Enterprise M776dn MFP by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'HP HP LaserJet Enterprise M776dn MFP: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 7ea544236fe14f58b3d77017101991ba
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Enterprise M776dn MFP by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Enterprise M776dn MFP by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 83e738972dda454c9e6f552939e35822
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 97585745a4734787abb5d8da36a4901a
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: bf515af5566a4d9c8849b997575dfa39
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: HP HP LaserJet Enterprise M776dn MFP by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 1bdf468c4f1747c593ae64f8b6f3aaad
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: da27b411872842eda9da9914f90a8868
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 98b4d343372148109a53a80807d151a4
    name: 'HP HP LaserJet Enterprise M776dn MFP: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: HP HP LaserJet Enterprise M776dn MFP by SNMP
        key: printer.page.count
