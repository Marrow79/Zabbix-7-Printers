zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 9146d621eacc442db6b526a413c08678
    template: Ricoh RICOH IM 5510 by SNMP
    name: Ricoh RICOH IM 5510 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Ricoh RICOH IM 5510.


      Verified source database date: 2026-09-27.

      Family/series: RICOH IM.

      Category: A3 MFP; B&W.

      Network: Ethernet; Wi-Fi on selected/configured models.

      Verified SNMP support: SNMPv1/v2 + SNMPv3.

      Evidence level: B - current model + platform/manual.

      Canada status: Current Ricoh Canada Always Current Technology list.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.ricoh.ca/en-CA/products/always-current-technology/always-current-technology-instructions-and-versions

      SNMP evidence source: https://manuals.ricoh.com/mfp/p_manual/IM6000JPN/ja/security/int/control.htm

      Verification notes: Ricoh''s current Canada list establishes active models; Ricoh IM security documentation describes SNMPv1/v2 and SNMPv3 network management.
      Exact interface options vary.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Ricoh
    - tag: model
      value: RICOH IM 5510
    - tag: family
      value: RICOH IM
    - tag: category
      value: A3 MFP
    - tag: snmp_support
      value: SNMPv1/v2 + SNMPv3
    - tag: evidence_level
      value: B - current model + platform/manual
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 124b97424c7e469eab633b09990be603
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: bd103e7ec5474d17b216acffbad2077c
        expression: max(/Ricoh RICOH IM 5510 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Ricoh RICOH IM 5510: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 9f74e300a1784992bf215678706ff1ab
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 49d6cc6bfb634a73a5523ff2832582f5
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 90426cb201ce4456bb40c2935bea9d9e
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a7128f4409ca4a428b552c557a8e1093
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 13ae225b897b419ab1400955292757ef
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4ef338d03e244603937187bf05a8ba47
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 4f9706fc6a2f44ecaa695757e28e9956
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e4a32b420fef4a618a62c088b2bee780
        expression: last(/Ricoh RICOH IM 5510 by SNMP/printer.status)=1 or last(/Ricoh RICOH IM 5510 by SNMP/printer.status)=2
        name: 'Ricoh RICOH IM 5510: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 3226a37995f44d2e8906d73511519b8b
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7f42b11f364b44fc97278b439a5a2e6c
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e425bc8812ad44f5825897ea8f56a094
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: c164bed8e30244f59b9161932b4f6866
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 2c07401d3e0a43bebea4e4b048a9cc74
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 829ebc129e68461ea31489a2dcaf430a
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 59f2480059d841f58408e9bbcd181fb5
        expression: last(/Ricoh RICOH IM 5510 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 5510: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: a1a9b97ad5b44c66b3530eeac07fe68c
        expression: last(/Ricoh RICOH IM 5510 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 5510 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 5510 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 5510 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Ricoh RICOH IM 5510: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: fd2e46fa593f41ecaf1e0d81081d0e1c
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 5510 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 5510 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: e522e4c487eb498d99e90a21bcc60dc5
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 747888213ded43bc9a0e7d21a9c459cb
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: ab984cd4ad8b401599ad62bcec7ba2a4
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 87aeec70ae29411597389f60aed83df7
        expression: last(/Ricoh RICOH IM 5510 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 5510: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 099f2f39add64ad59a95ef1ff5d36beb
        expression: last(/Ricoh RICOH IM 5510 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 5510 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 5510 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 5510 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Ricoh RICOH IM 5510: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 00977d410d4b4200b928b2b93a196ad2
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 5510 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 5510 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 1f84c29892d747e0a2ecdf9f97c4b2c5
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 227c51c0479046fe804e33ff17d8df9d
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: d986704453c24dfb951901bde5852ef9
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Ricoh RICOH IM 5510 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: ba31338393704d9cb7d5bd33791135e6
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 7984f67192f346adad8ce2ccfb7af3c0
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 8d31ca46c6a346ee836c2a49b61d1312
    name: 'Ricoh RICOH IM 5510: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Ricoh RICOH IM 5510 by SNMP
        key: printer.page.count
