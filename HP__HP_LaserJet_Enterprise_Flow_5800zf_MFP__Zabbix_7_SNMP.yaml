zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: a66ed33117cc445c8de8ea43c5e86afc
    template: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
    name: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
    description: 'Zabbix 7.0.x SNMP template for HP HP LaserJet Enterprise Flow 5800zf MFP.


      Verified source database date: 2026-09-27.

      Family/series: LaserJet Enterprise.

      Category: Laser MFP; Colour.

      Network: Gigabit Ethernet; Wi-Fi where configured.

      Verified SNMP support: SNMPv2/v3 (v1 on some models).

      Evidence level: B - current model + family/platform.

      Canada status: Current HP Canada enterprise catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.hp.com/ca-en/shop/listings/printers?jumpid=in_r11839_fr&segment=business&subbrand=laserjet-enterprise

      SNMP evidence source: https://www.hp.com/ca-en/shop/products/printers/hp-laserjet-enterprise-m430f-multifunction-black-white-laser-printer-3pz55a-bgj

      Verification notes: HP Enterprise platform documentation/product specs expose SNMP network management; exact legacy SNMP version mix varies by model.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: HP
    - tag: model
      value: HP LaserJet Enterprise Flow 5800zf MFP
    - tag: family
      value: LaserJet Enterprise
    - tag: category
      value: Laser MFP
    - tag: snmp_support
      value: SNMPv2/v3 (v1 on some models)
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 84ad40897e0d4e5dbe3d2ac0820aa8bb
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 2d8bb8daac1f4663a2c5e7f5a943ca59
        expression: max(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: d9881d309b754ac4834edecdcaaa0899
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: acbd25145efa450c830cba56e367adc9
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 43586077eace4b7cbd6245d52801a579
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 8868dbdac5424ad2bc47cff4aa80f0d3
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4fb4213f4600451197da620c21f4679e
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2da205f6dcbc44a0a8792453de021261
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: d5c3b3bc2cc14b49bdd4d1b3ccb17888
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: adebd40783084c32ac3d9a07a3080b32
        expression: last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.status)=1 or last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.status)=2
        name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 6f1982cfb26849f1ab142f54cdc794df
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 927d728fce754d1bb909dcb7de818a9b
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e24e97fd1985445c880776e7a43a9a46
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 4c6e5b16a8ac44dcb23b201805924324
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: f4e100d4d50c449a960d1aa048e8e93e
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 7e4d499bc6de40efafadabadc29c1574
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 272913c13e9144eca2551e2e26af6509
        expression: last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 35df55cbf4eb4db794e81832bc9684b8
        expression: last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Enterprise Flow 5800zf
          MFP by SNMP/printer.supply.max[{#SNMPINDEX}])>0 and (100*last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/HP
          HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 18f66efc1b1443e1a59c5bc1bd5b4706
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: d72392b06b5b4286afe426170b7cb494
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 157be88ede6d46f18c2b8dd875762147
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: f6607b0c9b914b58aacf44a698d3d746
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: e5e587d52ae14ab5bf6c9bbbe00f193e
        expression: last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 7b5722e96ff6475b9468d899647bb7ca
        expression: last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Enterprise Flow 5800zf MFP
          by SNMP/printer.tray.max[{#SNMPINDEX}])>0 and (100*last(/HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/HP HP
          LaserJet Enterprise Flow 5800zf MFP by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 61b220f3e1d24c599a10951bb03e1729
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: adc00fe75b4b4e0fa55cb27ba0bc902b
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 9863236f71c9420e868d3a22cb29aa0e
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: d054df3001a9461b86591296477a3955
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 2390fef620f74a459b12cc60b76152c4
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: b3c958e29a9d4dc397eb22e8de83366b
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 6572293ee6d24e20a99127efeb4d46e2
    name: 'HP HP LaserJet Enterprise Flow 5800zf MFP: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: HP HP LaserJet Enterprise Flow 5800zf MFP by SNMP
        key: printer.page.count
