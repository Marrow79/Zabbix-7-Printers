zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 1beaff7e25824ce5b10ff7959de55bf0
    template: Kyocera TASKalfa 2554ci by SNMP
    name: Kyocera TASKalfa 2554ci by SNMP
    description: 'Zabbix 7.0.x SNMP template for Kyocera TASKalfa 2554ci.


      Verified source database date: 2026-09-27.

      Family/series: TASKalfa Evolution.

      Category: A3 MFP; Colour.

      Network: Gigabit Ethernet; Wi-Fi optional/standard by model.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: B - current model + series/platform.

      Canada status: Current Kyocera Canada Evolution Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.kyoceradocumentsolutions.ca/en/products/mfp/kyocera-evolution-series.html

      SNMP evidence source: https://www.kyoceradocumentsolutions.ca/content/download-center-americas/ca/documents/brochures-and-specs/KYOCERA_TASKalfa3554ci_SpecGuide_2023JAN09_pdf.download.pdf

      Verification notes: Kyocera Canada Evolution family is current; series specification/driver grouping and model spec document SNMPv1/v2c/v3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Kyocera
    - tag: model
      value: TASKalfa 2554ci
    - tag: family
      value: TASKalfa Evolution
    - tag: category
      value: A3 MFP
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: B - current model + series/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: bcbd187f8a5b450fae4ebf5b2fe6aed4
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 3c3fb13975bf4a1983b08c1e4dc6fa6c
        expression: max(/Kyocera TASKalfa 2554ci by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Kyocera TASKalfa 2554ci: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 1b0955285ca147eaa3cd147c4509cd0a
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: ddab88a338b44a439e5f5384cc329baf
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7f092be5b5d4480aab15677077cb96e0
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 166028a0d96e47e7894105d3ff82ba02
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 16430243247041a4a734ce3f767909dd
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b7ef7521c048440c9389f17018da5e18
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: bf9e24a0b0c24ad0b005046b3c8229b7
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e8423432868648e6b6c0906046d4f78b
        expression: last(/Kyocera TASKalfa 2554ci by SNMP/printer.status)=1 or last(/Kyocera TASKalfa 2554ci by SNMP/printer.status)=2
        name: 'Kyocera TASKalfa 2554ci: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 93cd9629e4a2458f94fd6d20992feaa7
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b4c73c527ee04109b4a9e4e41caf6fae
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3479f8d43c7241a9b6756ccaceb574c5
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 51f912c17fd4499d86b3d28da89ab589
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 71f37965f4ce4d81a010bc7c7b7454af
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 9e74d3bcad35422796023f7e72e0a0a7
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 598765af96d142cd9634fc616ff08dbe
        expression: last(/Kyocera TASKalfa 2554ci by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Kyocera TASKalfa 2554ci: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: b014851e2f304906bb5a6a45e9d427ae
        expression: last(/Kyocera TASKalfa 2554ci by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Kyocera TASKalfa 2554ci by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera TASKalfa 2554ci by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Kyocera TASKalfa 2554ci by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Kyocera TASKalfa 2554ci: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a55f901f689d4b16959b89459d37038f
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera TASKalfa 2554ci by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera TASKalfa 2554ci by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: ca46f0c1b4554226bc72d8cb04ae0b1e
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 7438636ef6a6413982f1fd5281fd1495
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 00ea103eaf274887b42001179128f727
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: f06868270d2246d49a183beb6f8728a0
        expression: last(/Kyocera TASKalfa 2554ci by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Kyocera TASKalfa 2554ci: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 7d5505094081414b9e4587c6ebe6d946
        expression: last(/Kyocera TASKalfa 2554ci by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Kyocera TASKalfa 2554ci by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera TASKalfa 2554ci by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Kyocera TASKalfa 2554ci by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Kyocera TASKalfa 2554ci: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 124ee5f726434fdcbfa4d24e1eda68b7
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera TASKalfa 2554ci by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera TASKalfa 2554ci by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 18152e6bab004f91b3e58923ac84b813
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: e046c6ce752445238464d9eb8aa6ea53
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: f5d4b7619a2449f9868b243bd4e20095
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Kyocera TASKalfa 2554ci by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 9f6a0bf38daa41cda85607f8595a3ba8
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: c59de5aabc06438d86be056b606aaab2
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 2d368b765c274cd4a807ae9fba0fde3c
    name: 'Kyocera TASKalfa 2554ci: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Kyocera TASKalfa 2554ci by SNMP
        key: printer.page.count
