zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 745a66fddd424198ae5dfdd2e55d8e1a
    template: Toshiba e-STUDIO3025AC by SNMP
    name: Toshiba e-STUDIO3025AC by SNMP
    description: 'Zabbix 7.0.x SNMP template for Toshiba e-STUDIO3025AC.


      Verified source database date: 2026-09-27.

      Family/series: e-STUDIO.

      Category: Office MFP; Colour.

      Network: Ethernet; Wi-Fi available on selected/configured models.

      Verified SNMP support: SNMPv1/v2/v3.

      Evidence level: B - Canada support model + e-BRIDGE platform.

      Canada status: Toshiba Business Canada/North America support family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://business.toshiba.com/tbs/support/

      SNMP evidence source: https://business.toshiba.com/downloads/KB/f1Ulds/14147/TopAccess_EN_%28EBN%29_Ver01F1.pdf

      Verification notes: Toshiba TopAccess/e-BRIDGE documentation supports SNMPv1/v2/v3 monitoring; model list comes from official support/manual families.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Toshiba
    - tag: model
      value: e-STUDIO3025AC
    - tag: family
      value: e-STUDIO
    - tag: category
      value: Office MFP
    - tag: snmp_support
      value: SNMPv1/v2/v3
    - tag: evidence_level
      value: B - Canada support model + e-BRIDGE platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: db3678035ab6472a81757fd865537317
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 040bf2fa5fcb4d54a54e5ecd08b2c5fc
        expression: max(/Toshiba e-STUDIO3025AC by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Toshiba e-STUDIO3025AC: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 55a31423c8424b688270d9082970cbbf
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 179d351625b8480c9939a6ca52b161b9
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 12e2b890922e4284a93bd4218a73e38f
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4b302bba30514f63bf39f195e835e659
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 96f6fc75dfcb420e99dd6e790bc2b959
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0f315a1e2dc84e26b8d7f75c5ab2696b
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 3d6afa972a9a49d0b2ca22a37015695f
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: f5ae1cf1c8f24f04bbf1703373a60fa0
        expression: last(/Toshiba e-STUDIO3025AC by SNMP/printer.status)=1 or last(/Toshiba e-STUDIO3025AC by SNMP/printer.status)=2
        name: 'Toshiba e-STUDIO3025AC: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 8460256259274995bcf3d74903422358
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 53498853a9644f6bb7c8fc342176dfe4
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 24f21e8435994a129cff1111b2ea816f
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 1fe429be94384e0a85e1666de2a8e897
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: ff73d8f675d548f297d8452d4ac8d891
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 74bba8929b654450bd9f7873ab04a815
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 090c6b4ec3754f77b6eb3777b801b062
        expression: last(/Toshiba e-STUDIO3025AC by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO3025AC: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 04d56bde9aac4a2b917ac7a470fbf3cd
        expression: last(/Toshiba e-STUDIO3025AC by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO3025AC by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO3025AC by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO3025AC by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Toshiba e-STUDIO3025AC: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: edef172260614f1ea3f6e31bad4390cf
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO3025AC by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO3025AC by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 7336d92f7bd44ae1a5246f36c6280684
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: f2b21866010a4106acaea2555b7c7a6f
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 2e43b432e1204e91b9066e8c78b6e567
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: e22d21dc18b94ecf82c54667004b1bb8
        expression: last(/Toshiba e-STUDIO3025AC by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO3025AC: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 8e310123a1904ee683529b6bc6a0ac5a
        expression: last(/Toshiba e-STUDIO3025AC by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO3025AC by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO3025AC by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO3025AC by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Toshiba e-STUDIO3025AC: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: e12fee41d247489dbd75c278d08e51d3
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO3025AC by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO3025AC by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b7f632cf96ec44b4bbcf3ae758740faf
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: b6189da0d48c4bffbacf0a5604adee92
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 796cef8296744a60a3de94b66129a542
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Toshiba e-STUDIO3025AC by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: d0fa7256e1c7446a888a938bd8509349
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: f70c439fa00f48e08d77f867ce904aa6
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 5a42f9e2d25a47a6bfd46b084582b4ac
    name: 'Toshiba e-STUDIO3025AC: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Toshiba e-STUDIO3025AC by SNMP
        key: printer.page.count
