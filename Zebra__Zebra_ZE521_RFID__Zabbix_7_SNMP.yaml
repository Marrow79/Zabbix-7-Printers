zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 7ff847429c10400e8b8697b7a93890a5
    template: Zebra Zebra ZE521 RFID by SNMP
    name: Zebra Zebra ZE521 RFID by SNMP
    description: 'Zabbix 7.0.x SNMP template for Zebra Zebra ZE521 RFID.


      Verified source database date: 2026-09-27.

      Family/series: ZE500.

      Category: RFID print engine; B&W/label.

      Network: Ethernet standard/optional and/or Wi-Fi depending on model.

      Verified SNMP support: SNMPv3 on Link-OS 7.0+.

      Evidence level: B - current model + platform/firmware.

      Canada status: Current Zebra family/product page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.zebra.com/us/en/products/rfid/rfid-enabled-products.html

      SNMP evidence source: https://support.zebra.com/article/000031511

      Verification notes: Zebra states SNMPv3 is available on printers running Link-OS 7.0 and above. Confirm installed firmware before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Zebra
    - tag: model
      value: Zebra ZE521 RFID
    - tag: family
      value: ZE500
    - tag: category
      value: RFID print engine
    - tag: snmp_support
      value: SNMPv3 on Link-OS 7.0+
    - tag: evidence_level
      value: B - current model + platform/firmware
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 4c95229f6d21419594df2410aeec4880
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: c1e20f60a4fb4d5fa5cca36be7098e16
        expression: max(/Zebra Zebra ZE521 RFID by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Zebra Zebra ZE521 RFID: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 7a00cd8000274dc0abdddc9a0e367f29
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f2d5f5ffc1be4a27956c2c9345912cf9
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 735b869d21844fa38683b1833a16cd93
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f9371ab02e8b4d2395205e2b7db3f656
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5833e6efcfc64ecbbb4790f0478c3963
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 59bd20df363241318eaae37bad2e0a0b
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: ada9c51e00f64ae88987c24566c331d4
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 211631fd36744c53b2d7bc9d3401c1ee
        expression: last(/Zebra Zebra ZE521 RFID by SNMP/printer.status)=1 or last(/Zebra Zebra ZE521 RFID by SNMP/printer.status)=2
        name: 'Zebra Zebra ZE521 RFID: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: d08a79161bbe44bda84d7f20dd554178
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f3f441ffab514f46a10eab1fed8d63e5
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cc9dadfd118b46e5a7603b7b7ea851f1
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: c6fcd4696eab402f996a154cc3324b8b
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: c72e8970e12a4a9b966a24b988e28820
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 4ec513cff6914dbb9aa094c46c314d26
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 436a5f70037b4fa6b2e4bd764813f02d
        expression: last(/Zebra Zebra ZE521 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Zebra Zebra ZE521 RFID: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: b8394a41b4f44469995e26f7d266eb48
        expression: last(/Zebra Zebra ZE521 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Zebra Zebra ZE521 RFID by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Zebra Zebra ZE521 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Zebra Zebra ZE521 RFID by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Zebra Zebra ZE521 RFID: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 914acc848ab34061807eee431cf4164b
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Zebra Zebra ZE521 RFID by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Zebra Zebra ZE521 RFID by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 7f88e00094a24cdaa6f6883c4a339b18
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: aa31e95476b641318399c28b1962b620
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 964180857d1f4b9a87890426cc7f1c88
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: bc4eb06015b048f5bcd8b4ddd4acf399
        expression: last(/Zebra Zebra ZE521 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Zebra Zebra ZE521 RFID: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: e5f7d187a473447ab41d2ace38015d8f
        expression: last(/Zebra Zebra ZE521 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Zebra Zebra ZE521 RFID by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Zebra Zebra ZE521 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Zebra Zebra ZE521 RFID by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Zebra Zebra ZE521 RFID: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 51e65bca9c764557baa938f2ff907c04
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Zebra Zebra ZE521 RFID by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Zebra Zebra ZE521 RFID by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: d0e57926a6e1414f8968a8af1ab2d595
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 1d3afe75525741deaa75a530dca4cf2a
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 62bc97ecbb3b46d3a71dedde47f3af02
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Zebra Zebra ZE521 RFID by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 5316416db9894319b4410815e1919ac3
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 26e7a7e06ada4947ab0670033cca17c1
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 6ad9266322f443d2a61c807daa2469cf
    name: 'Zebra Zebra ZE521 RFID: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Zebra Zebra ZE521 RFID by SNMP
        key: printer.page.count
