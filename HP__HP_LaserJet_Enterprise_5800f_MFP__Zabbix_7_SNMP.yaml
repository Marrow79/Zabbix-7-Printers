zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 4312a082308a4c50944c83d9b83ef65f
    template: HP HP LaserJet Enterprise 5800f MFP by SNMP
    name: HP HP LaserJet Enterprise 5800f MFP by SNMP
    description: 'Zabbix 7.0.x SNMP template for HP HP LaserJet Enterprise 5800f MFP.


      Verified source database date: 2026-09-27.

      Family/series: LaserJet Enterprise.

      Category: Laser MFP; Colour.

      Network: Gigabit Ethernet; Wi-Fi where configured.

      Verified SNMP support: SNMPv2/v3 (v1 on some models).

      Evidence level: B - current model + family/platform.

      Canada status: Current HP Canada enterprise catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.hp.com/ca-en/shop/listings/printers?jumpid=in_r11839_fr&segment=business&subbrand=laserjet-enterprise

      SNMP evidence source: https://www.hp.com/ca-en/shop/products/printers/hp-laserjet-enterprise-m430f-multifunction-black-white-laser-printer-3pz55a-bgj

      Verification notes: HP Enterprise platform documentation/product specs expose SNMP network management; exact legacy SNMP version mix varies by model.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: HP
    - tag: model
      value: HP LaserJet Enterprise 5800f MFP
    - tag: family
      value: LaserJet Enterprise
    - tag: category
      value: Laser MFP
    - tag: snmp_support
      value: SNMPv2/v3 (v1 on some models)
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: c278cfa6cd374f1891d5c50d7c614366
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: a0a0d84995934ccfb0750769c12caf75
        expression: max(/HP HP LaserJet Enterprise 5800f MFP by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'HP HP LaserJet Enterprise 5800f MFP: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 728050129e6746ab950d418c2ca2da84
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 700f133c241a49f1949966602734b4cc
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b7c2459030a24546a427a4fe7a5680b0
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 90643812ac484b0d85d0ed58599c3897
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9795510fb3fa403d92aa04687a3b27e9
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b0b0e7238d7e43869331a9a62e02195e
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 3c64bd745804429baf13a209e85670cf
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: d62a976e62a944a6b7d26d1ccd60e15c
        expression: last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.status)=1 or last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.status)=2
        name: 'HP HP LaserJet Enterprise 5800f MFP: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 0229bafb3c2f4a539b4f48a8f37a2c6b
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3384950a18114a7a8820cb8596e8d380
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b5256ba730cd4d4bbd65496ed02a7460
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 4011847db4c24463986df295b8b6551b
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 02d2d36157eb4dcdb351f42926fca1f6
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 0701e39ee0464d47b983ce0741e9e16c
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 2d78cd0d6e08405eb21588772b45f539
        expression: last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Enterprise 5800f MFP: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: e0b6db7eb58a42219f78e09ccdd994a5
        expression: last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'HP HP LaserJet Enterprise 5800f MFP: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 6c44a7f9a581493886cf1684666f5659
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Enterprise 5800f MFP by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Enterprise 5800f MFP by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 8e951791f8db4e63adf475dd1ef63c6c
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 39a1411b2a1840fd959d70268c77b430
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: add42604fa3a4a22b00802b71765921f
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 069f6d63746144da915c574173040bbc
        expression: last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Enterprise 5800f MFP: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 93f77f55539747f4b5004789a6babd3e
        expression: last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/HP HP LaserJet Enterprise 5800f MFP by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'HP HP LaserJet Enterprise 5800f MFP: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 5171fa6808cf4f33b9309d0e06c96a39
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Enterprise 5800f MFP by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Enterprise 5800f MFP by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: f310b8aa37fa46ce944eb843d2df0121
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 0caf87c8540f466b8c7353c42d468509
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 3ca42b1f22f6444ca194a119a25b8f5d
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: HP HP LaserJet Enterprise 5800f MFP by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 8ab9310276d04bda9de20f57c6cfb90c
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 34d1240257304499b13e8562e2f4d01a
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 56dc6fff3f794e1e8ed7406d02840499
    name: 'HP HP LaserJet Enterprise 5800f MFP: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: HP HP LaserJet Enterprise 5800f MFP by SNMP
        key: printer.page.count
