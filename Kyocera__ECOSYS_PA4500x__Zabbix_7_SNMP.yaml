zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: bf1d135b8f4c4539ad0602175fc40c13
    template: Kyocera ECOSYS PA4500x by SNMP
    name: Kyocera ECOSYS PA4500x by SNMP
    description: 'Zabbix 7.0.x SNMP template for Kyocera ECOSYS PA4500x.


      Verified source database date: 2026-09-27.

      Family/series: ECOSYS PA6000x Series.

      Category: Mono printer; B&W.

      Network: Gigabit Ethernet; optional Wi-Fi.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: B - current model + series/platform.

      Canada status: Current Kyocera Canada PA6000x family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.kyoceradocumentsolutions.ca/en/products/printers/kyocera-ecosys-pa6000x-series.html

      SNMP evidence source: https://www.kyoceradocumentsolutions.ca/content/download-center-americas/ca/documents/brochures-and-specs/KYOCERA_Spec_Sheet_ECOSYS_PA6000x_061223_pdf.download.pdf

      Verification notes: PA6000x series current page plus official series spec; exact feature set may vary slightly by member.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Kyocera
    - tag: model
      value: ECOSYS PA4500x
    - tag: family
      value: ECOSYS PA6000x Series
    - tag: category
      value: Mono printer
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: B - current model + series/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 0a068ebaeba54bbfb6d2e36487a8b0b0
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: ece50ddbb8db4353b8d7c5311f972756
        expression: max(/Kyocera ECOSYS PA4500x by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Kyocera ECOSYS PA4500x: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 2d7881e2fb2c4838adfaf8c2a1c43455
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: c17d9d1df34a40fd8b91ac2252e74e5a
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4deb09c601814ec09e3d9625d9f0135b
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0ab79312e980458cab7b6f531428d6eb
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 80c63b491fc94137b9c53a00f16e741f
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: be76d9803eaa4adab57361194be52467
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 96d0b5e007e54673a7ac4d4f138ef9cf
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 752bc3bae2df41fda6c539590656c941
        expression: last(/Kyocera ECOSYS PA4500x by SNMP/printer.status)=1 or last(/Kyocera ECOSYS PA4500x by SNMP/printer.status)=2
        name: 'Kyocera ECOSYS PA4500x: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: f1262e01b05f4dc694132ecf97f15ad0
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2df77397d4d44c6db5f14bc63444fdef
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3a80089b6b3d4daa8826cb3a9f00a17e
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 73aa53c2284148478418c097e17b3925
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 900082c6266e4ac58191b70bec395976
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 44105eb53fca464f9d86dd3394e347a7
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 1706c70bd55b48d5a423d964315a8162
        expression: last(/Kyocera ECOSYS PA4500x by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Kyocera ECOSYS PA4500x: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 4d3d5874e1bb4fb28dfc870e8fef5a37
        expression: last(/Kyocera ECOSYS PA4500x by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Kyocera ECOSYS PA4500x by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera ECOSYS PA4500x by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Kyocera ECOSYS PA4500x by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Kyocera ECOSYS PA4500x: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 1fd558d12edb45dba1f4fd31326e63fb
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera ECOSYS PA4500x by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera ECOSYS PA4500x by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: bd864d0d082a4b84ba37ac9ffe1b0137
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 52e06f9e5f6f4bbb86cf0b2ce0d7292c
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 4b351852f3334e6b94b67bc06939797d
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: ba6d239e451d47b98d08f6d2ff0c307e
        expression: last(/Kyocera ECOSYS PA4500x by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Kyocera ECOSYS PA4500x: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 7337cc21d8204f1483422869473ec316
        expression: last(/Kyocera ECOSYS PA4500x by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Kyocera ECOSYS PA4500x by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera ECOSYS PA4500x by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Kyocera ECOSYS PA4500x by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Kyocera ECOSYS PA4500x: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: c57f2c4c06f64103b14ecbb26c16b1b8
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera ECOSYS PA4500x by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera ECOSYS PA4500x by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b764aa13fa91426bbafd2d4d1103874f
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: bee23b379d7d4649b3239a58f7719e78
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 359faa62f7a34885adc56f3bebc89b2b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Kyocera ECOSYS PA4500x by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 628fbb5d287c4d2ab3e51c184e63c623
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: d442b28f1bc042d49c4b229e039351f9
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: ea80c883d6994a0dae06332a3e8781a9
    name: 'Kyocera ECOSYS PA4500x: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Kyocera ECOSYS PA4500x by SNMP
        key: printer.page.count
