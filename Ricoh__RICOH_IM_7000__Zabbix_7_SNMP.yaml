zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: bb0ad69fc3b94fc0a3dee16044f89890
    template: Ricoh RICOH IM 7000 by SNMP
    name: Ricoh RICOH IM 7000 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Ricoh RICOH IM 7000.


      Verified source database date: 2026-09-27.

      Family/series: RICOH IM.

      Category: A3 MFP; B&W.

      Network: Ethernet; Wi-Fi on selected/configured models.

      Verified SNMP support: SNMPv1/v2 + SNMPv3.

      Evidence level: B - current model + platform/manual.

      Canada status: Current Ricoh Canada Always Current Technology list.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.ricoh.ca/en-CA/products/always-current-technology/always-current-technology-instructions-and-versions

      SNMP evidence source: https://manuals.ricoh.com/mfp/p_manual/IM6000JPN/ja/security/int/control.htm

      Verification notes: Ricoh''s current Canada list establishes active models; Ricoh IM security documentation describes SNMPv1/v2 and SNMPv3 network management.
      Exact interface options vary.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Ricoh
    - tag: model
      value: RICOH IM 7000
    - tag: family
      value: RICOH IM
    - tag: category
      value: A3 MFP
    - tag: snmp_support
      value: SNMPv1/v2 + SNMPv3
    - tag: evidence_level
      value: B - current model + platform/manual
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 813c025e1f9447f18b1551a44afd4f89
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 180e61ae2bcb4836b71d138b0626cfa1
        expression: max(/Ricoh RICOH IM 7000 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Ricoh RICOH IM 7000: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: d0f05b3b9eba4582a28ab4a009665515
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: ffc68d3c970849ca9337e79acb915ae0
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6d6e9820122d45869b6f62a95c729a9e
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d9766f3be6564b42a10219f5b67b63b6
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7c72d64c316b42e2a83cbbf334436ce1
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e82bd0cfbde24995beae065f344af56b
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 71d87b725e2b40c1b09ecdc6414ffed7
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 706a94d9ea5c481da5166f8fda389f05
        expression: last(/Ricoh RICOH IM 7000 by SNMP/printer.status)=1 or last(/Ricoh RICOH IM 7000 by SNMP/printer.status)=2
        name: 'Ricoh RICOH IM 7000: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: f1cb7c8f6e184b199609aa0156b82e3c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6291c6d1decd487f822b90538bdc4c75
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1241cd9cdb7f4d72b4c7708c7226ccc7
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: a0277f0d3bac483d9ac62b69a33cc5a4
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: f7a835c03ec24570998f7c2943900b1d
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: b567125a749947a298cbd44bf9ffdf33
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 0f774bc704b6493a83d8f37f559dd63f
        expression: last(/Ricoh RICOH IM 7000 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 7000: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: bd92ea962f514d19aedd550b83f8326d
        expression: last(/Ricoh RICOH IM 7000 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 7000 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 7000 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 7000 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Ricoh RICOH IM 7000: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 3d8a6c7a0f2a412a9ed115da4c297fc3
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 7000 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 7000 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 682ddc9e8dbf4e559b345d7e607c0d99
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: f9119efebcfe4d0c9eedfa39312a5b78
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 8ac7397cf6b3462f8849f4014c9f2d88
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 80e5a44c546b4b85869a29904db3fa55
        expression: last(/Ricoh RICOH IM 7000 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 7000: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 2ecd5bb1e3734673ae9f890a3f999210
        expression: last(/Ricoh RICOH IM 7000 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 7000 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 7000 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 7000 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Ricoh RICOH IM 7000: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 37a9a635fbe64f95a11285d53451381c
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 7000 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 7000 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b2fce0a62c714fbcb0e7c10d138e03a7
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: c6bf81ee58794f968070cc4b3fdcbf05
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 51e41cbd69d544c99651e101eb6ddf9b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Ricoh RICOH IM 7000 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 91ef81dff6ed43d199ede065d9dc4c68
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 1d4f97c287cb4b5b9041dc42fb31b975
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: e02718620fa04546aef47a7d4f92bb1e
    name: 'Ricoh RICOH IM 7000: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Ricoh RICOH IM 7000 by SNMP
        key: printer.page.count
