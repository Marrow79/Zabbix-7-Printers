zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: e9965b86d5f84008b396a7c1af6d3602
    template: Lexmark Lexmark MS321dn by SNMP
    name: Lexmark Lexmark MS321dn by SNMP
    description: 'Zabbix 7.0.x SNMP template for Lexmark Lexmark MS321dn.


      Verified source database date: 2026-09-27.

      Family/series: MS Series.

      Category: Printer; B&W.

      Network: Ethernet (Wi-Fi optional on some).

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: A - model-specific.

      Canada status: Lexmark Canada product/support page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.lexmark.com/en_ca/printers/printer/11830/Lexmark-MS321dn

      SNMP evidence source: https://www.lexmark.com/en_ca/printers/printer/11830/Lexmark-MS321dn

      Verification notes: Lexmark Canada connectivity section lists Ethernet and SNMPv1/v2c/v3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Lexmark
    - tag: model
      value: Lexmark MS321dn
    - tag: family
      value: MS Series
    - tag: category
      value: Printer
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: aa21501fe048444685e2a33a4023a32c
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 4571971b870c4d3d879132356e1816b7
        expression: max(/Lexmark Lexmark MS321dn by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Lexmark Lexmark MS321dn: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: be910892ffb147278ca8d058bf68c074
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 63da1a3203ad4cb3b46839823cbf7392
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 95ee6eee7c8a404fadf82fc0bba33f0f
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f7b423de97934402b85661742ab7f734
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 8effca45167a4c058e4e9325d06e5e27
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 84bec79f6b7049c6aa6ff554380d061a
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: cad2167f38724dc1a1a2b1c06f483d18
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: bdca10867403487cb31fd01572d93378
        expression: last(/Lexmark Lexmark MS321dn by SNMP/printer.status)=1 or last(/Lexmark Lexmark MS321dn by SNMP/printer.status)=2
        name: 'Lexmark Lexmark MS321dn: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: cca95d5eacab4220bc54c61deb8514f3
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4dbef90800dc470d89a4fa66b8b9e37c
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 41e918713efd47c389aef5c13d360d36
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 7d921b0b683f4e4eaf88820ef5447fce
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 8d5fb1150c474d10ab8866a2fc99e526
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: f9f2884161094017a2db740c5388959f
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: d72b718abfa14f1bbb0029177f7c85a5
        expression: last(/Lexmark Lexmark MS321dn by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark MS321dn: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: ffb6270c1e084631aea0f6917bbea4fb
        expression: last(/Lexmark Lexmark MS321dn by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark MS321dn by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark MS321dn by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Lexmark Lexmark MS321dn by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Lexmark Lexmark MS321dn: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: fce0f21d87284ccc81806be7ed53735b
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark MS321dn by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark MS321dn by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: ad67946e1a6d4dbd87ef7b37534bfa14
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 8f1ac8dc020045108f3413055a41b957
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 5a13627916a346459b70d93391418b55
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 7e08a5bbf6b34d34b8c0fa401982839b
        expression: last(/Lexmark Lexmark MS321dn by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark MS321dn: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 2f5b7cc326824639afb9fe799ed57580
        expression: last(/Lexmark Lexmark MS321dn by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark MS321dn by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark MS321dn by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Lexmark Lexmark MS321dn by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Lexmark Lexmark MS321dn: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: f089e7ecdf484734a7023574f2d4c043
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark MS321dn by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark MS321dn by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 8c96afad6e7e4e3f947413b7b5c1f3b9
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 4ccf85181c9a43f0be7b2b576d7e7b53
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 5b6da4fd6abb4a45a1acb87c33029e02
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Lexmark Lexmark MS321dn by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: b494849ada4f4767acd9ef8fb1b6497e
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 2f575aa9751a458781c954d97eacbadf
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 5cb2dd1b1cf74504862690622d37da9e
    name: 'Lexmark Lexmark MS321dn: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Lexmark Lexmark MS321dn by SNMP
        key: printer.page.count
