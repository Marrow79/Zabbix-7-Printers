zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: ed61b7d33f524f05b2d27fb15c33ea58
    template: Epson Epson TM-S1000II by SNMP
    name: Epson Epson TM-S1000II by SNMP
    description: 'Zabbix 7.0.x SNMP template for Epson Epson TM-S1000II.


      Verified source database date: 2026-09-27.

      Family/series: POS.

      Category: POS / receipt printer; Colour.

      Network: IP network interface (wired and/or wireless by model).

      Verified SNMP support: SNMP (remote SNMP confirmed; version varies).

      Evidence level: A - model-specific SNMP advisory.

      Canada status: Epson Canada support-listed; current-sale status varies.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://epson.ca/support/wa00965

      SNMP evidence source: https://epson.ca/support/wa00965

      Verification notes: Epson Canada''s SNMP vulnerability advisory explicitly lists this model, establishing remote SNMP support. Check the product page for exact
      interface and SNMP version before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Epson
    - tag: model
      value: Epson TM-S1000II
    - tag: family
      value: POS
    - tag: category
      value: POS / receipt printer
    - tag: snmp_support
      value: SNMP (remote SNMP confirmed; version varies)
    - tag: evidence_level
      value: A - model-specific SNMP advisory
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: f05df9714cf9499daabae5f1456fd8e2
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 3f43405856fc4b3987aebb71d5b69d5c
        expression: max(/Epson Epson TM-S1000II by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Epson Epson TM-S1000II: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 3f5c9bb3caf14030be255352d1025f1d
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f6a46c5cf122496b8dba6608fdc5bc88
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: fd3b70a795e145f69716e6636452539e
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4e1ff293568145afb7941c9eb91c44a5
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9054fbb255d24ee8bef3c2b404cec095
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d2e7f547ead047e692b227d7073f89a7
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 46e7dc9b7d764c22b26707e6cf6074b4
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 655cd0857e7044ff9c72d85f58d0c8d3
        expression: last(/Epson Epson TM-S1000II by SNMP/printer.status)=1 or last(/Epson Epson TM-S1000II by SNMP/printer.status)=2
        name: 'Epson Epson TM-S1000II: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 4651f6c1568445c78f84a9b8843cd39c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 841a6986f0674610aac5c1a9d3e9dbc9
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d5d81b232e4b4aedacc2f39456e7dbef
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 603c20e81e82411ca1828e720962f5d7
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 6a43c848c57e4a43858432e3bd7d578f
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 3fd4ee1c94ff45b188fb31d33f21726e
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 5d6ae56176fa4a8db56d4b5020a623d5
        expression: last(/Epson Epson TM-S1000II by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Epson Epson TM-S1000II: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 3eaf6d4b567541fd82a6a0edde746a65
        expression: last(/Epson Epson TM-S1000II by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Epson Epson TM-S1000II by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson TM-S1000II by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Epson Epson TM-S1000II by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Epson Epson TM-S1000II: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 82c9ff0739094413ac51e8ce312aff9d
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson TM-S1000II by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson TM-S1000II by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: f5fdf62bf4be44ce8ea3e051e2531946
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 7cc472691fbe43c0be7d12334786998e
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: ac620f7fd7b84fb299be96b080409f09
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: d1f5dbd41b2e47eeb8499f13985fa0cf
        expression: last(/Epson Epson TM-S1000II by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Epson Epson TM-S1000II: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 750efbcaf52842fd9e7f6663d83f544b
        expression: last(/Epson Epson TM-S1000II by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Epson Epson TM-S1000II by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson TM-S1000II by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Epson Epson TM-S1000II by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Epson Epson TM-S1000II: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 4ae66134fdf54b55894f824f6170e77f
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson TM-S1000II by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson TM-S1000II by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: b376e8cd3fed4bad83f02812898013eb
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: f9adff6d80d8446f9a2216d6b4d1fe9b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 01f4a7e763fd47ca9a67b8119cf7e23c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Epson Epson TM-S1000II by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: fe8f77ae976f406a912b62ab9fabf754
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 475565bd22534d2e83754c0e3f903911
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 4b39007351a74d1884c02a5c3ca93160
    name: 'Epson Epson TM-S1000II: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Epson Epson TM-S1000II by SNMP
        key: printer.page.count
