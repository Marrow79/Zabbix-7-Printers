zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 0205e3736c814fd58ab7662aee49a8ec
    template: Lexmark Lexmark XM5270 by SNMP
    name: Lexmark Lexmark XM5270 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Lexmark Lexmark XM5270.


      Verified source database date: 2026-09-27.

      Family/series: XM Series.

      Category: MFP; B&W.

      Network: Ethernet (Wi-Fi optional on some).

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: A - model-specific.

      Canada status: Lexmark Canada product/support page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.lexmark.com/en_ca/printers/printer/10841/Lexmark-XM5270

      SNMP evidence source: https://www.lexmark.com/en_ca/printers/printer/10841/Lexmark-XM5270

      Verification notes: Lexmark Canada connectivity section lists Ethernet and SNMPv1/v2c/v3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Lexmark
    - tag: model
      value: Lexmark XM5270
    - tag: family
      value: XM Series
    - tag: category
      value: MFP
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: c5e57143f33e4eda83df9fcab1a48803
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 4705f5dc71e747fd8b313d3c37be9730
        expression: max(/Lexmark Lexmark XM5270 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Lexmark Lexmark XM5270: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 12f0a34c360c44239ef2ca79bc46bfd2
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 09160ce093cb4d7ca2c827ab88d2382e
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6e36b2264aa94b4183b34ff6672dd5ca
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 23080c42be9b4f7ba95ae8d2a233a60a
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 32e69def00b942edaa03df532e80d430
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 329b0bc7ca9d4e67aeb2bdfc15f6177c
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 2a96187280de4f9c8fe6aa2aaa9f7e49
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 6ff40b3824be494db9b87f3b239585a8
        expression: last(/Lexmark Lexmark XM5270 by SNMP/printer.status)=1 or last(/Lexmark Lexmark XM5270 by SNMP/printer.status)=2
        name: 'Lexmark Lexmark XM5270: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 8f14d4fe56e34903abc2b5c38d76c271
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 98b7742c554e44dfba02088708f49def
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: be41f814042d43b5b838512fdc73e94f
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: cac09a4beeaa48ef9b8e8a2dafd643d4
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: fba47c464ea644d9b60fd72038b22905
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: b5c925e68e9148a3b81cc8f23bd982fc
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: f797a270277642c4bf31eb1c59b01fca
        expression: last(/Lexmark Lexmark XM5270 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark XM5270: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 4b4b73e0289f4e2ba16e044163bac7be
        expression: last(/Lexmark Lexmark XM5270 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark XM5270 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark XM5270 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Lexmark Lexmark XM5270 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Lexmark Lexmark XM5270: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: ce48b1b3ce6d415e983ee786e4546d65
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark XM5270 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark XM5270 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: dea348342dd147bcbd115aa3b0a1ef41
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 9b4859953e114f3aacb6388236537125
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 03bff1b76ee347cbabcd3848d3f528ab
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 69045e040d224c3597b04c7f40b5e60f
        expression: last(/Lexmark Lexmark XM5270 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Lexmark Lexmark XM5270: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 8fafcba9e0314ce79f9f517f23aa9092
        expression: last(/Lexmark Lexmark XM5270 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Lexmark Lexmark XM5270 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Lexmark Lexmark XM5270 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Lexmark Lexmark XM5270 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Lexmark Lexmark XM5270: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 6cf65159c4834f259de53781444ed6db
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Lexmark Lexmark XM5270 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Lexmark Lexmark XM5270 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 62cd40b0329c458f80c593f082c5dbba
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 93b953a09c7e439591967d8ec1234635
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 63df3c15b5b043408f09d476886b3715
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Lexmark Lexmark XM5270 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: f1ee239b8ea24b109a9fc3bb782122a6
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: dcd4b2b7a5fe4ed79a1713b0a61bfe88
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 54b9a1133154460b9ebfeb077cb1de6f
    name: 'Lexmark Lexmark XM5270: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Lexmark Lexmark XM5270 by SNMP
        key: printer.page.count
