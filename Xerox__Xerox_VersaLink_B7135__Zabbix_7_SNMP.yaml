zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 4c9a041b01d64accac666f43244d326a
    template: Xerox Xerox VersaLink B7135 by SNMP
    name: Xerox Xerox VersaLink B7135 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Xerox Xerox VersaLink B7135.


      Verified source database date: 2026-09-27.

      Family/series: B7100 Series.

      Category: Mono MFP; B&W.

      Network: Ethernet.

      Verified SNMP support: SNMP (series management platform).

      Evidence level: B - current model + family/platform.

      Canada status: Current Xerox Canada VersaLink catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.shop.xerox.ca/en/products/versalink

      SNMP evidence source: https://www.shop.xerox.ca/en/products/versalink

      Verification notes: Included as a current VersaLink network model; SNMP management is a platform feature. Exact supported SNMP version should be confirmed in
      the model security guide.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Xerox
    - tag: model
      value: Xerox VersaLink B7135
    - tag: family
      value: B7100 Series
    - tag: category
      value: Mono MFP
    - tag: snmp_support
      value: SNMP (series management platform)
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 961c8623d4bb447d909ab8804b94c693
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 31889c5dd7e145ac8e5aebce31dd1cda
        expression: max(/Xerox Xerox VersaLink B7135 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Xerox Xerox VersaLink B7135: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: ce3b6763a8c54ebbb2a37ab4a1702412
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f71867179247484aac8238f4316248fe
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cb859fa95d1d4b999340be6f1d624b0d
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1f3ef87bd1414dc59825fc22da38bba0
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2b176ae11eb0458988fd693634bfd96b
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2dd0d3b4a75749c498c48fd442e19641
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: ef9384672cc34e7aba9a914a19a2eaf3
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 36a4ae88edab4d5f9a5f8094ce8ba249
        expression: last(/Xerox Xerox VersaLink B7135 by SNMP/printer.status)=1 or last(/Xerox Xerox VersaLink B7135 by SNMP/printer.status)=2
        name: 'Xerox Xerox VersaLink B7135: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 5b0294cac32a4e55a9db40d476f7366b
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: edd82a245a9d47dea92b3560f8e3f6e4
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e762043fae9a46edbe376b30d0bdb135
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: da6c18a03dce4727bdf2d5df9810c1f9
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 213da365e8684d4a957a64b3f66f5147
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 6e45fccec2d7409a83ec568a9a3d3a88
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: adc517f71dfb450bb38a292fe53b87c4
        expression: last(/Xerox Xerox VersaLink B7135 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox VersaLink B7135: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 97cdbfba721d449c811ea85198f9bf50
        expression: last(/Xerox Xerox VersaLink B7135 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox VersaLink B7135 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox VersaLink B7135 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Xerox Xerox VersaLink B7135 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Xerox Xerox VersaLink B7135: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a18d85a13b23433a9cd5386c4d64ad03
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox VersaLink B7135 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox VersaLink B7135 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: e2e76d0853474b1b869cc1ae768f9bbb
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: b810d6403ed74e3bb48b39c63b909bc8
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 1d9a2086f34343ee866d18cad3f76031
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 505346757dba4010ae3d1c4fe881ec44
        expression: last(/Xerox Xerox VersaLink B7135 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox VersaLink B7135: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: a8c52ec4c5dc4dd1873bfcb2634e3600
        expression: last(/Xerox Xerox VersaLink B7135 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox VersaLink B7135 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox VersaLink B7135 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Xerox Xerox VersaLink B7135 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Xerox Xerox VersaLink B7135: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: b65291de40444121a6f0accdc97a00c3
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox VersaLink B7135 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox VersaLink B7135 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 2970a97f33194c1fb44ec2089822ea32
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 375c2871096e40bca4bbffcbe94143b6
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 2050a09b1283405e90403d82eae56ffe
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Xerox Xerox VersaLink B7135 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 6f87b5eed394450cbe582ae14e67e7f9
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: dc57afa2a05e48758cf7807e942b42bb
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: ab16d90a4b2d43ba99c8e73c012236a4
    name: 'Xerox Xerox VersaLink B7135: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Xerox Xerox VersaLink B7135 by SNMP
        key: printer.page.count
