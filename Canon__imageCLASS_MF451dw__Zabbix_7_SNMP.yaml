zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 0e119422bd8c48b6910254b5c589f1c4
    template: Canon imageCLASS MF451dw by SNMP
    name: Canon imageCLASS MF451dw by SNMP
    description: 'Zabbix 7.0.x SNMP template for Canon imageCLASS MF451dw.


      Verified source database date: 2026-09-27.

      Family/series: imageCLASS MF400.

      Category: Mono MFP; B&W.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product/catalog page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.canon.ca/en/product?name=imageCLASS_MF451dw

      SNMP evidence source: https://www.canon.ca/en/product?name=imageCLASS_MF451dw

      Verification notes: Canon Canada product/specification pages list SNMP V3.0 and network connectivity.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Canon
    - tag: model
      value: imageCLASS MF451dw
    - tag: family
      value: imageCLASS MF400
    - tag: category
      value: Mono MFP
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 359cff9620fc42c2b7a383940fc22a8b
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: e571e36e6d5f4aaa91e274dbfa2a2ac9
        expression: max(/Canon imageCLASS MF451dw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Canon imageCLASS MF451dw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 73abe7f8277044aebff935807bee96f7
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 4526dc17cc204c5cbc0c59898e2c271d
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c8025e0971464b299beb74ffee7a47bc
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0ac38d58b6864b6a87117d33482604d6
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3b24d067688c4f259b322e360f766b5b
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5350503d811d49828e623d9c7b927ca8
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: a0f3ee007c474414b2b257a3a67d136c
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: b4f24d968a8945b79980636b79f1d0d7
        expression: last(/Canon imageCLASS MF451dw by SNMP/printer.status)=1 or last(/Canon imageCLASS MF451dw by SNMP/printer.status)=2
        name: 'Canon imageCLASS MF451dw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 812b2ffa9aae4b1fbd2e953b9f6d4d89
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 41ec0264e9204b698ffafc0604842bed
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 20f1ba1e2f4d4620bf2a86fff81bc76a
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: f580950bbec8458fa1065ef372e1d3a9
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 07721d7da0954fee8ec6222c542ca1dd
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 0238725af1cc4790adec3755cb67e2d9
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: f2a4beca9f884443a7899e303b86def3
        expression: last(/Canon imageCLASS MF451dw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS MF451dw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 0719cb926ede4ca88d84c34b74a28f3c
        expression: last(/Canon imageCLASS MF451dw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS MF451dw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS MF451dw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Canon imageCLASS MF451dw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Canon imageCLASS MF451dw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: f84c05dc75864b419748c16c6a358b65
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS MF451dw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS MF451dw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 14ede773accd4c4e8739faaa89878397
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 751dd8078dbe45cfb890fb6a306ae792
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: c479ac1e09304748833b704732d5e738
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: dac0be4d8a234599b575ab31b1cd7898
        expression: last(/Canon imageCLASS MF451dw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Canon imageCLASS MF451dw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: b08bed3e086c481d83f4378dbe04b81f
        expression: last(/Canon imageCLASS MF451dw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Canon imageCLASS MF451dw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Canon imageCLASS MF451dw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Canon imageCLASS MF451dw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Canon imageCLASS MF451dw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 12eb89e1b03c42ada420dd5c1ac9b734
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Canon imageCLASS MF451dw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Canon imageCLASS MF451dw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 165e6d55a10c4c9e8d5289b0860fdb45
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 300221cfaceb4c2884aa54ecae8003f2
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: b861d4e813834a569c9ad7a04aaabc83
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Canon imageCLASS MF451dw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 75ad92b9b8e945c4998db800fb76990f
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 5fc1d208f29b4675ad7cc976b2e00acc
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 232318fa369c4de5855adf290df99d6e
    name: 'Canon imageCLASS MF451dw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Canon imageCLASS MF451dw by SNMP
        key: printer.page.count
