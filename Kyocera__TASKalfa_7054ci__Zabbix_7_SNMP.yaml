zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 5696e90281a14537b70be2d0e041899b
    template: Kyocera TASKalfa 7054ci by SNMP
    name: Kyocera TASKalfa 7054ci by SNMP
    description: 'Zabbix 7.0.x SNMP template for Kyocera TASKalfa 7054ci.


      Verified source database date: 2026-09-27.

      Family/series: TASKalfa Evolution.

      Category: A3 MFP; Colour.

      Network: Gigabit Ethernet; Wi-Fi optional/standard by model.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: B - current model + series/platform.

      Canada status: Current Kyocera Canada Evolution Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.kyoceradocumentsolutions.ca/en/products/mfp/kyocera-evolution-series.html

      SNMP evidence source: https://www.kyoceradocumentsolutions.ca/content/download-center-americas/ca/documents/brochures-and-specs/KYOCERA_TASKalfa3554ci_SpecGuide_2023JAN09_pdf.download.pdf

      Verification notes: Kyocera Canada Evolution family is current; series specification/driver grouping and model spec document SNMPv1/v2c/v3.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Kyocera
    - tag: model
      value: TASKalfa 7054ci
    - tag: family
      value: TASKalfa Evolution
    - tag: category
      value: A3 MFP
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: B - current model + series/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: e8107824e87b4782afd462ecbaf92b23
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: a8cd3a4ac1ff44738e753fe633b3c957
        expression: max(/Kyocera TASKalfa 7054ci by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Kyocera TASKalfa 7054ci: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 3506e19f83614ddc807e8ea9b763f15a
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: e9870df403ff41eb8e05b4d048db29e7
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 45719ec9e61b49f78d98f9a7a7d7d30a
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d1ba2f8b870448eb826ce40babb0b5d2
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bd3f4188b73e4995b4fa42bb6c1fade1
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9aba978f94f54b3288f0b69d395e3b86
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: e004b1de785c4e6f89268a4087c70a80
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 7ac873b3bce54ff0bb82fda4a631e072
        expression: last(/Kyocera TASKalfa 7054ci by SNMP/printer.status)=1 or last(/Kyocera TASKalfa 7054ci by SNMP/printer.status)=2
        name: 'Kyocera TASKalfa 7054ci: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 21b065a2bb1e4f82b7cb9e7f0bf5675d
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bc5ffd4b2d074a5ba29c15ad9f795581
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 40ab544f89cd48848becc7f0c004df3f
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 99b38860478c41af87a5c1cd6e082a80
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 2e9891a6c80a454baaf55bb1528f512d
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 6ba2ddca44694e39af82ce47f5641dc0
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: ff9c198463c84c23bcfcad29abd548f2
        expression: last(/Kyocera TASKalfa 7054ci by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Kyocera TASKalfa 7054ci: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: dddc89506c3542f8a390a7de6954a842
        expression: last(/Kyocera TASKalfa 7054ci by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Kyocera TASKalfa 7054ci by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera TASKalfa 7054ci by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Kyocera TASKalfa 7054ci by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Kyocera TASKalfa 7054ci: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 367a7a6f9b6441f09936b1512c85cfd6
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera TASKalfa 7054ci by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera TASKalfa 7054ci by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 2efeadcff1d149329118d77278316c15
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 43a3acde46854f8eb18889324790cd7d
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: e07246ba54824e0f880d03b3c6645562
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: a1ded7d457184e29b2bf80e618265ce3
        expression: last(/Kyocera TASKalfa 7054ci by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Kyocera TASKalfa 7054ci: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 586467a1805d45f1866d4eca6e12e7cd
        expression: last(/Kyocera TASKalfa 7054ci by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Kyocera TASKalfa 7054ci by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera TASKalfa 7054ci by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Kyocera TASKalfa 7054ci by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Kyocera TASKalfa 7054ci: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 1ba863abc9b44d03bc83282a09bf57ad
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera TASKalfa 7054ci by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera TASKalfa 7054ci by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 67af8cd331234ad19aac280c73dab471
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 04c832d90a1349d79a9f3611c58d3263
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: e8703797bdf5473689d29b0fb503f618
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Kyocera TASKalfa 7054ci by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: f022ca1d62b84cf891db3e75cc3416f0
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 3b124e67d84b4aa4ae8e36e374063c22
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 4163e1df55ee486b875d8687d407f35f
    name: 'Kyocera TASKalfa 7054ci: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Kyocera TASKalfa 7054ci by SNMP
        key: printer.page.count
