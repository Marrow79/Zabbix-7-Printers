zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: a80dd5aa23a949578e64341cef613ea5
    template: Brother HL-L2460DWXL by SNMP
    name: Brother HL-L2460DWXL by SNMP
    description: 'Zabbix 7.0.x SNMP template for Brother HL-L2460DWXL.


      Verified source database date: 2026-09-27.

      Family/series: HL-L2400.

      Category: Laser printer; B&W.

      Network: Ethernet + Wi-Fi.

      Verified SNMP support: SNMPv3.

      Evidence level: A - model-specific.

      Canada status: Canada product page / current or supported.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.brother.ca/en/p/HLL2460DWXL

      SNMP evidence source: https://www.brother.ca/en/p/HLL2460DWXL

      Verification notes: Brother Canada specifications explicitly list network interfaces and SNMP security/management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Brother
    - tag: model
      value: HL-L2460DWXL
    - tag: family
      value: HL-L2400
    - tag: category
      value: Laser printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: A - model-specific
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: b8f52fba8471454bad3304287b629eed
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 7d951b0782a14c4ba135cc109ec732b2
        expression: max(/Brother HL-L2460DWXL by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Brother HL-L2460DWXL: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 84c7fb4d0d994fffa8578b52ffe3ccd1
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 3664f913fc4a4d939caadaf73e616462
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b3d6908afc91449fae035236560334de
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 12063f51c14347608dda4dd60c3e5821
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e831981d9f3f426a8805ef614ceae5d2
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c0b5ecdaeae94145ace2fe99e20328b8
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: bd25d7dc47d94ac28602cc214f4c2185
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 4c5a59a537234f328992722f796e04be
        expression: last(/Brother HL-L2460DWXL by SNMP/printer.status)=1 or last(/Brother HL-L2460DWXL by SNMP/printer.status)=2
        name: 'Brother HL-L2460DWXL: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: ced347482dfc45dc848fabd1caa40f1c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5a90a7870822429480787e5e4bcc41f2
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3c77e5cdd3f846f0b9d28afa05fbd929
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: b955cd1f8ca94dbda0bff7178c92908f
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 5a9e9c2db83c46b88792aa27d8264512
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: c7bad68bfced41a18e9e0251da4a640e
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 38d4610060ee4f06aa60eff040469e0f
        expression: last(/Brother HL-L2460DWXL by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Brother HL-L2460DWXL: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: a29472e8657d401ebad1a295baa9f987
        expression: last(/Brother HL-L2460DWXL by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Brother HL-L2460DWXL by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Brother HL-L2460DWXL by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Brother HL-L2460DWXL by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Brother HL-L2460DWXL: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 0ee33c9d694a4485bfdc5c2771316d3f
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Brother HL-L2460DWXL by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Brother HL-L2460DWXL by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 663bf22c4f8b4f159001f0d7cbdc61a2
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: bbe542389b994fdb92b21f631c6f18a0
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 8ec4a47459604e55b6e2cee3cbe46798
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: b2c8c9641c4a4d5fbda24c47d0aadad3
        expression: last(/Brother HL-L2460DWXL by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Brother HL-L2460DWXL: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: ae5d015e3be64b068e2049361beef4fd
        expression: last(/Brother HL-L2460DWXL by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Brother HL-L2460DWXL by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Brother HL-L2460DWXL by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Brother HL-L2460DWXL by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Brother HL-L2460DWXL: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a20e213773f74e3c977208bb8710b92d
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Brother HL-L2460DWXL by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Brother HL-L2460DWXL by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 2097448451504260858ddbdbe33846ea
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 3e1ac8f537554d8ba7df8a4157617fb3
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: e4e28e407e83465886495c0d32c89089
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Brother HL-L2460DWXL by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 73f74f82f16749a29f226dca0b0bda6d
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 6eb158d6120c4ab78396aa2b5ec6f918
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 7f00e4dc3e2040348a3101e4cd683804
    name: 'Brother HL-L2460DWXL: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Brother HL-L2460DWXL by SNMP
        key: printer.page.count
