zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: a38f3759d55447f58fc98e2addd3dc3c
    template: Sharp Sharp BP71C65 by SNMP
    name: Sharp Sharp BP71C65 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Sharp Sharp BP71C65.


      Verified source database date: 2026-09-27.

      Family/series: Sharp BP Series.

      Category: Office MFP / printer; Colour.

      Network: Gigabit Ethernet; Wi-Fi standard/optional by model.

      Verified SNMP support: SNMPv3.

      Evidence level: B - current/recent model + BP platform.

      Canada status: Sharp Canada current/recent business catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://sharp.ca/en/products/business-copiers-printers-office-copiers-printers/

      SNMP evidence source: https://sharp.ca/en/products/business-copiers-printers-office-copiers-printers/

      Verification notes: Sharp BP product pages use a common network stack and list SNMPv3; exact current catalog status varies for older BP70/BP80 models.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Sharp
    - tag: model
      value: Sharp BP71C65
    - tag: family
      value: Sharp BP Series
    - tag: category
      value: Office MFP / printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: B - current/recent model + BP platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: e022b23d226642ddb58a3754072550bd
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: e6f2cf93a55f467da12495884382d98e
        expression: max(/Sharp Sharp BP71C65 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Sharp Sharp BP71C65: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: b87b2111ee154db495c7c9e48d0653d7
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 9095883f5c9747f19482d80a74269205
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 73d0236ea5d3458dad21e92bacfef161
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c1a3ee57f0414a8baecd31b3eb856927
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b6d252d55ca3482ea4cd64209558a14d
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bb73feeb13994e96b82568a8c706979a
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 7a62b87f2e1544bebd240f228ec4d8e7
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: e78c2566559549c88f651ffc3693858e
        expression: last(/Sharp Sharp BP71C65 by SNMP/printer.status)=1 or last(/Sharp Sharp BP71C65 by SNMP/printer.status)=2
        name: 'Sharp Sharp BP71C65: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: cc513df6dd304e04a10508e5eda34f30
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: eab433da9e25458b977369d36c5d0909
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 884289c24bd04fb188d1c571e664ce70
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 1369df4f216940a4b9fc012cc46fd133
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: fd27da146a2243b38027eda2f64a44bc
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 7e3c25d40693414db47ac5ca696242e0
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 8a8e44ffe0b64785972211053ca507e4
        expression: last(/Sharp Sharp BP71C65 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Sharp Sharp BP71C65: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: f54eee69d714409ba9ec71bc2b8bf9d7
        expression: last(/Sharp Sharp BP71C65 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Sharp Sharp BP71C65 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Sharp Sharp BP71C65 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Sharp Sharp BP71C65 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Sharp Sharp BP71C65: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 7b1f90cf726e463fa501ca406991c71e
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Sharp Sharp BP71C65 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Sharp Sharp BP71C65 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 4e5b332beace4b81aa7ff0974da3016d
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 61c0641551ca416c87cd125a319fa36e
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 188fee8969c64af899a04afbdebfd2b3
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: e652d6fcd730470bb3032ccfdd5143e7
        expression: last(/Sharp Sharp BP71C65 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Sharp Sharp BP71C65: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: fb398f64fe9d44269ef8a91a7e98f11b
        expression: last(/Sharp Sharp BP71C65 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Sharp Sharp BP71C65 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Sharp Sharp BP71C65 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Sharp Sharp BP71C65 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Sharp Sharp BP71C65: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: e589dc17c4044cd78ff8d10fae723925
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Sharp Sharp BP71C65 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Sharp Sharp BP71C65 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 39f17eb08f99475ba053cd565a5fa1e9
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: d500862e34774057b418cb80bcc10604
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 0f1e370fe40249af9ec00220e258b70b
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Sharp Sharp BP71C65 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 62b02ba3ec8a402695f6a49b6106d8aa
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: eccc8e1d929a4ec9acc155d80c6fa562
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 6e53a94efb7f422ca094b35fcaba053b
    name: 'Sharp Sharp BP71C65: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Sharp Sharp BP71C65 by SNMP
        key: printer.page.count
