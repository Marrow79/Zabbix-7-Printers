zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 22f6a2d422464589b24322c80c8bfe1b
    template: Ricoh RICOH IM 3510 by SNMP
    name: Ricoh RICOH IM 3510 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Ricoh RICOH IM 3510.


      Verified source database date: 2026-09-27.

      Family/series: RICOH IM.

      Category: A3 MFP; B&W.

      Network: Ethernet; Wi-Fi on selected/configured models.

      Verified SNMP support: SNMPv1/v2 + SNMPv3.

      Evidence level: B - current model + platform/manual.

      Canada status: Current Ricoh Canada Always Current Technology list.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.ricoh.ca/en-CA/products/always-current-technology/always-current-technology-instructions-and-versions

      SNMP evidence source: https://manuals.ricoh.com/mfp/p_manual/IM6000JPN/ja/security/int/control.htm

      Verification notes: Ricoh''s current Canada list establishes active models; Ricoh IM security documentation describes SNMPv1/v2 and SNMPv3 network management.
      Exact interface options vary.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Ricoh
    - tag: model
      value: RICOH IM 3510
    - tag: family
      value: RICOH IM
    - tag: category
      value: A3 MFP
    - tag: snmp_support
      value: SNMPv1/v2 + SNMPv3
    - tag: evidence_level
      value: B - current model + platform/manual
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 1395f3179ffe452b99008d0785cbd4ac
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 1c30a94e85bc400a9460934d5f25c5fe
        expression: max(/Ricoh RICOH IM 3510 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Ricoh RICOH IM 3510: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: a8c775babe9b4f76ab6afab2de60ee44
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f1876c9d2c3d4bc7b5d8fb9ce9cacaef
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c606092aa5fa42488fc98014a2db681b
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d316df9d2a2e4919a4fb7dcd5d6345b5
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 90e7d6bf423b4c21a8e22d2ddbbd6603
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6d1fd34f3ad347a789c0833b9ee2120d
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: b9048502043b4bd4abde7740f60f48a3
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 76787376a9eb4a97bf7fdc9e7d550217
        expression: last(/Ricoh RICOH IM 3510 by SNMP/printer.status)=1 or last(/Ricoh RICOH IM 3510 by SNMP/printer.status)=2
        name: 'Ricoh RICOH IM 3510: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: d6e593b762dd4a339e7b51403f100cbc
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 19f88ce26a984486b09c6837eeebeb53
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0bb47c7ac2884078bc774bc2cc4ea2a0
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: ef882b7336ac4aeaa39196676fb19af2
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: dfa5d295c7d6498397b71b3bee43afab
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 7e71fca0f923496bb353a4a445b914d5
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: d6a3e98d2d064c77b7239342e092ffd2
        expression: last(/Ricoh RICOH IM 3510 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 3510: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 6af50526a0114537bbaa70c4c5aa0faf
        expression: last(/Ricoh RICOH IM 3510 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 3510 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 3510 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 3510 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Ricoh RICOH IM 3510: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: ba9121dad6d444c1a8cda7e96f886ce9
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 3510 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 3510 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 2755180985f84ad5808a8826e74d3e81
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 692985d8e2944792919bc9581d292b5e
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 84bafcfe6d5c4c1cb151a19c6adfd90c
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 5a6f9eed6c204b6988e4d513e4565cb2
        expression: last(/Ricoh RICOH IM 3510 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Ricoh RICOH IM 3510: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 39c7c3f1634d401c89f1c1599ca58255
        expression: last(/Ricoh RICOH IM 3510 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Ricoh RICOH IM 3510 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Ricoh RICOH IM 3510 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Ricoh RICOH IM 3510 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Ricoh RICOH IM 3510: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 51baa2dca7bd49a599c123d7957542bf
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Ricoh RICOH IM 3510 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Ricoh RICOH IM 3510 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: afbb03172b344e76ab647051371ec3d7
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: afcab7bf7d2a4e9c88fc9685db1990f6
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: dda97dd159e748798928ba8e7f0c795c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Ricoh RICOH IM 3510 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 6bffe6e3cdab477bb5453c8c557e4c6f
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: be023d7204ac4ea9a499a4bf1bb411fd
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 820317b2aca04890acefbdaa3098d404
    name: 'Ricoh RICOH IM 3510: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Ricoh RICOH IM 3510 by SNMP
        key: printer.page.count
