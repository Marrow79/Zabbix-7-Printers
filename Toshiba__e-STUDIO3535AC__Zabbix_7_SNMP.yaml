zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 9cb7105a6392483c9f3505410701d055
    template: Toshiba e-STUDIO3535AC by SNMP
    name: Toshiba e-STUDIO3535AC by SNMP
    description: 'Zabbix 7.0.x SNMP template for Toshiba e-STUDIO3535AC.


      Verified source database date: 2026-09-27.

      Family/series: e-STUDIO.

      Category: Office MFP; Colour.

      Network: Ethernet; Wi-Fi available on selected/configured models.

      Verified SNMP support: SNMPv1/v2/v3.

      Evidence level: B - Canada support model + e-BRIDGE platform.

      Canada status: Toshiba Business Canada/North America support family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://business.toshiba.com/tbs/support/

      SNMP evidence source: https://business.toshiba.com/downloads/KB/f1Ulds/14147/TopAccess_EN_%28EBN%29_Ver01F1.pdf

      Verification notes: Toshiba TopAccess/e-BRIDGE documentation supports SNMPv1/v2/v3 monitoring; model list comes from official support/manual families.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Toshiba
    - tag: model
      value: e-STUDIO3535AC
    - tag: family
      value: e-STUDIO
    - tag: category
      value: Office MFP
    - tag: snmp_support
      value: SNMPv1/v2/v3
    - tag: evidence_level
      value: B - Canada support model + e-BRIDGE platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 608dacef7192411b8789ad085ddd79c5
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 6f9946402dba4aeba4a3c44a7152be08
        expression: max(/Toshiba e-STUDIO3535AC by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Toshiba e-STUDIO3535AC: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 1ff28c34cd6846f3899b4db714909653
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 3d96831902174cb0a1fadb2cda992be3
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 117900bb74cc4f29a0b33831cefef8f1
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: ccfbe15bac6949d8b8ad70fe04584c6b
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a08f63f47ab640128c387df6cc5c3da1
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d1c7475792574bf784d425f43c4af107
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: d54d47ee808b4f1eb732091c323b7ef6
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 80d840d711834751b9cc1271807c0081
        expression: last(/Toshiba e-STUDIO3535AC by SNMP/printer.status)=1 or last(/Toshiba e-STUDIO3535AC by SNMP/printer.status)=2
        name: 'Toshiba e-STUDIO3535AC: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 8cb506325dc445c48182f5b4d3d8df7c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4cf462f0b9254a7f88be520187b97ba0
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 1a5d305b92df40c192ab2d9f2ae755ee
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 886b73aa87854cb9a17daeddfa94f71e
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 4603d65739a249fda8c819488eff7490
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: b837bf0f4aad431dbbe92767e750f012
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 0d88e39e4f2847218401684ecc92c4e2
        expression: last(/Toshiba e-STUDIO3535AC by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO3535AC: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 31f1505b96084a25bae85013a8b0ff6f
        expression: last(/Toshiba e-STUDIO3535AC by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO3535AC by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO3535AC by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO3535AC by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Toshiba e-STUDIO3535AC: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 25a548cbed7e43f5ba972cf798c5a418
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO3535AC by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO3535AC by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 459d46af077a4147bd334551c35feb58
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: b3da45da57434124ac92d1139ccafe88
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 8c322fd84d8e4b559422d89e6dea78c3
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 69f359d8b47c4ee49a7a471c07b19132
        expression: last(/Toshiba e-STUDIO3535AC by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Toshiba e-STUDIO3535AC: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 8ca78aac61364c2ebe6463b9af99c0bd
        expression: last(/Toshiba e-STUDIO3535AC by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Toshiba e-STUDIO3535AC by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Toshiba e-STUDIO3535AC by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Toshiba e-STUDIO3535AC by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Toshiba e-STUDIO3535AC: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 4dadffc79af7438b8b3786effa7f6455
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Toshiba e-STUDIO3535AC by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Toshiba e-STUDIO3535AC by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: ad60cc7f5bc34bb583d2b24641ba340a
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 3bbe130e4acd445fa6a6a8db98059c21
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: fcbe8a446b38494c85b5910d7c9489af
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Toshiba e-STUDIO3535AC by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 8db440cae602472ab2e2a64c64e216ec
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 2ce80d09eedc47998063582d90c3fcd3
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: e0c104c429dd43e9b50e20c80aaccebd
    name: 'Toshiba e-STUDIO3535AC: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Toshiba e-STUDIO3535AC by SNMP
        key: printer.page.count
