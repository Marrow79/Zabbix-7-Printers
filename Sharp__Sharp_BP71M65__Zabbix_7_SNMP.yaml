zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: eb07221cb0044f949b63c6c21cb6efe1
    template: Sharp Sharp BP71M65 by SNMP
    name: Sharp Sharp BP71M65 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Sharp Sharp BP71M65.


      Verified source database date: 2026-09-27.

      Family/series: Sharp BP Series.

      Category: Office MFP / printer; B&W.

      Network: Gigabit Ethernet; Wi-Fi standard/optional by model.

      Verified SNMP support: SNMPv3.

      Evidence level: B - current/recent model + BP platform.

      Canada status: Sharp Canada current/recent business catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://sharp.ca/en/products/business-copiers-printers-office-copiers-printers/

      SNMP evidence source: https://sharp.ca/en/products/business-copiers-printers-office-copiers-printers/

      Verification notes: Sharp BP product pages use a common network stack and list SNMPv3; exact current catalog status varies for older BP70/BP80 models.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Sharp
    - tag: model
      value: Sharp BP71M65
    - tag: family
      value: Sharp BP Series
    - tag: category
      value: Office MFP / printer
    - tag: snmp_support
      value: SNMPv3
    - tag: evidence_level
      value: B - current/recent model + BP platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 6ca63f7c5ab34358a84cab5f7531fedf
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: b4bb1818c9684b66a76e81c91c6d55f9
        expression: max(/Sharp Sharp BP71M65 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Sharp Sharp BP71M65: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: a89aa41eaabe449cab1da2580bfa8aa4
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 00b8b5f80c2447128764b579f3fadf84
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e1894604e6c24c8eb3c849aa2411321c
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: df07e51382624689abf04a86f3156be4
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 7c7a4fa1a641430aa7a1d7eca7cfaf11
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2129efa11c144bb49218618371bcd266
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: e0b4516e288c43e3b077b1b7d2e0809a
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 0ad5035c58744eecb4a599f49d77fbdb
        expression: last(/Sharp Sharp BP71M65 by SNMP/printer.status)=1 or last(/Sharp Sharp BP71M65 by SNMP/printer.status)=2
        name: 'Sharp Sharp BP71M65: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 15e6e8e5ee5c42cb9e834cf254eaff7c
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 857b1c5d121c48388610afb50b160cce
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 6350fe5c4b8544b7b655f8481e270784
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 913185dc817c46879e65c0a553314893
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: fa52e93961ec4427b85ea7a37cae9ea0
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: d59683c414dc4b2a95970961bda6109c
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 67d5aa3611ca48e28b4f32e459a0195c
        expression: last(/Sharp Sharp BP71M65 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Sharp Sharp BP71M65: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 0e9eb8d757284e6587b12d41537522d5
        expression: last(/Sharp Sharp BP71M65 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Sharp Sharp BP71M65 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Sharp Sharp BP71M65 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Sharp Sharp BP71M65 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Sharp Sharp BP71M65: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: fa3ec2ea84f140e1b48f47e66be744d2
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Sharp Sharp BP71M65 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Sharp Sharp BP71M65 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 47ccde81835d4cf9850c9ca6daf2179c
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: f22c2d1a62b840f78afdfee18ac8645f
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 0acd0736d0954a979626767de5b42816
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 76bdfadf4ffd46f1a91e56a768763ea6
        expression: last(/Sharp Sharp BP71M65 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Sharp Sharp BP71M65: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 3d1e2808b9ac4520accb84371471b303
        expression: last(/Sharp Sharp BP71M65 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Sharp Sharp BP71M65 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Sharp Sharp BP71M65 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Sharp Sharp BP71M65 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Sharp Sharp BP71M65: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 75da57b9aabe44b9bbea284de43562b7
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Sharp Sharp BP71M65 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Sharp Sharp BP71M65 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: a91c7db202594828804f7e4cb5b05579
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 653c9d599cf54c08b01e9eaf2fc97d86
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 59dfd8a573e9482d88e0ba1b3c917c6d
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Sharp Sharp BP71M65 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 36f7b2f6ea484f7e9de98b54ffa9ec47
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 60831e4589af40a3839154802700e631
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: ae16e40b555b4372beff5131688bdb9c
    name: 'Sharp Sharp BP71M65: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Sharp Sharp BP71M65 by SNMP
        key: printer.page.count
