zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 398cd0889366490f8d05eee055236a53
    template: HP HP LaserJet Pro 4101fdw by SNMP
    name: HP HP LaserJet Pro 4101fdw by SNMP
    description: 'Zabbix 7.0.x SNMP template for HP HP LaserJet Pro 4101fdw.


      Verified source database date: 2026-09-27.

      Family/series: LaserJet Pro.

      Category: Laser MFP; B&W.

      Network: Ethernet; Wi-Fi on wireless variants.

      Verified SNMP support: SNMPv1/v2/v3.

      Evidence level: B - current model + family/platform.

      Canada status: Current HP Canada business catalog.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.hp.com/ca-en/shop/listings/printers?segment=business&subbrand=hp-laserjet+hp-laserjet-pro+hp-laserjet-pro

      SNMP evidence source: https://www.hp.com/ca-en/shop/products/printers/hp-laserjet-pro-4301fdn-multifunction-colour-laser-printer-4ra81f-bgj

      Verification notes: HP Canada catalog confirms current Ethernet models; representative current LaserJet Pro model specs explicitly list SNMPv1/v2/v3 management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: HP
    - tag: model
      value: HP LaserJet Pro 4101fdw
    - tag: family
      value: LaserJet Pro
    - tag: category
      value: Laser MFP
    - tag: snmp_support
      value: SNMPv1/v2/v3
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 8df3510e80f243e3b0488dff75074939
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 740f0f53d839478fb8e625fd85f28a12
        expression: max(/HP HP LaserJet Pro 4101fdw by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'HP HP LaserJet Pro 4101fdw: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 43df72c0625943908b80667e1ab95a04
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 0aecbe399fab4850a660cf3d0e831383
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 4f9dba33ec294578845d6dd1633166d4
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9fcd0a17b5534187b32e429479f41760
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9300c9afde6a4851952d2a359806d574
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: b34fb607c1604b5aa3dd7825092f1881
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 5759234d56b1439183b576a8df46d44a
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 654a23d7398d4177877ee8ac0fbbc416
        expression: last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.status)=1 or last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.status)=2
        name: 'HP HP LaserJet Pro 4101fdw: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: 8049eb02e8c14a3ba49c2ef4df620458
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: ac586e63c15842ffaa3d372c29af3c65
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d09630eae39949f187b79948c3a2f0be
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: ebfbe5ecde6a4eb392e56ef4c91eb023
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 09a37cbd7594499dbe0c9ed90c473d39
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: b422fdc1984f4badb746e071cf527314
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 5730877430de4762a712ee79f45430da
        expression: last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Pro 4101fdw: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 0ed125dd01f045698b1b8ca86c963ff0
        expression: last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'HP HP LaserJet Pro 4101fdw: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 7d0c059b1ea240ada27ac2329a1d0d19
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Pro 4101fdw by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Pro 4101fdw by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: b4bed55a5b1b46f5a14f85c14f433978
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 00ce7a438b874a7da54e53d004d87bfc
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: d35ebd6387f54bc792069f760c768e60
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 489379d41a67453c883ddf2bc9dcc8f7
        expression: last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'HP HP LaserJet Pro 4101fdw: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 7d71781dd8e5401fae9b888a5fd7e43e
        expression: last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/HP HP LaserJet Pro 4101fdw by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'HP HP LaserJet Pro 4101fdw: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: d4eed0423be14f358f9f7bc69963cf52
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: HP HP LaserJet Pro 4101fdw by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HP HP LaserJet Pro 4101fdw by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: ea408c723e3f41ccbc1b2f5d3f1c2b0d
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 3d386350f0f148df8ec9edb0ed722585
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: c5b61a6018f94f30bee06ad02b3852e4
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: HP HP LaserJet Pro 4101fdw by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 9d83ccf2951c4d53b5cb6283d3cf6031
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 410d079c95f74a6c9d95bd3560ce0b18
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: e511dec1ce414d2f9f1471dac23d336e
    name: 'HP HP LaserJet Pro 4101fdw: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: HP HP LaserJet Pro 4101fdw by SNMP
        key: printer.page.count
