zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: e633b7b5c96145d1a115f3ccb63ddcf0
    template: Epson Epson ET-2850 by SNMP
    name: Epson Epson ET-2850 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Epson Epson ET-2850.


      Verified source database date: 2026-09-27.

      Family/series: EcoTank / Inkjet.

      Category: Printer; Colour.

      Network: IP network interface (wired and/or wireless by model).

      Verified SNMP support: SNMP (remote SNMP confirmed; version varies).

      Evidence level: A - model-specific SNMP advisory.

      Canada status: Epson Canada support-listed; current-sale status varies.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://epson.ca/support/wa00965

      SNMP evidence source: https://epson.ca/support/wa00965

      Verification notes: Epson Canada''s SNMP vulnerability advisory explicitly lists this model, establishing remote SNMP support. Check the product page for exact
      interface and SNMP version before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Epson
    - tag: model
      value: Epson ET-2850
    - tag: family
      value: EcoTank / Inkjet
    - tag: category
      value: Printer
    - tag: snmp_support
      value: SNMP (remote SNMP confirmed; version varies)
    - tag: evidence_level
      value: A - model-specific SNMP advisory
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 704c886bac254580b1d7915ff1eb5258
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 42a8c4f9700e48eaafbcc93ed829bd9d
        expression: max(/Epson Epson ET-2850 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Epson Epson ET-2850: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 3a2dfd4ed89046b4968ced800d7794bd
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 058aa54037ff47f6aae2373a626049ee
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 16afdcab8ba8458abccaa6b78f9c2ca6
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e566f5f269744084b917b28d06d594b2
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 87dd9fdd367b4eb3bc45de69c9f42b99
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 910af167d5d244df8daa225e3b2ff04e
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: fc4a1f10cbc9407b8e78eaaaef8204d9
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 3f018614576d458cb90732e0b5b2784a
        expression: last(/Epson Epson ET-2850 by SNMP/printer.status)=1 or last(/Epson Epson ET-2850 by SNMP/printer.status)=2
        name: 'Epson Epson ET-2850: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: dd5934964bc84b5cb99f0cc6a56397b9
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: f4e3c618f6aa48fca22f0bbb2458cb38
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: ee62ff9872c34f86b01118263d05cc26
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 169d85ebfed4479689877f195c81183a
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 8c49af4a970548adb7666d4249fe9de9
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: a95f44a298954759a52000352a893aa3
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 01f11c5d290b4e3b8190752a6d31bceb
        expression: last(/Epson Epson ET-2850 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Epson Epson ET-2850: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 00eb797b44a34ec2a4f440038218c802
        expression: last(/Epson Epson ET-2850 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Epson Epson ET-2850 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson ET-2850 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Epson Epson ET-2850 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Epson Epson ET-2850: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: b113d694fa294220a8bff0fcdf045cc3
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson ET-2850 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson ET-2850 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 34d1091bcdee470ba388e7a7af97c847
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 789618030e3144f18c21f3dcc2dec25f
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: b30105404a2d4d7499d665e0301a676b
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 5f1ce5bff0f943489508666de0c57fc7
        expression: last(/Epson Epson ET-2850 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Epson Epson ET-2850: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 8f798aa81dfc40d0945025d68dddb66f
        expression: last(/Epson Epson ET-2850 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Epson Epson ET-2850 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Epson Epson ET-2850 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Epson Epson ET-2850 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Epson Epson ET-2850: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 42f06af6ccbc4e7a94be354d7f3edccb
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Epson Epson ET-2850 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Epson Epson ET-2850 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: f1a5635de4cb47cdb522853e3bbda58f
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 219313e79c7c45dbb0845cfa03ddf0fd
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 343f17843b314399b8a6495778f84f63
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Epson Epson ET-2850 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: e2020ffc5ab246198a6821c47e83e69b
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: d1130c1f345c4697be64603dc8d8d8f3
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 4068832518594582af18e06546a33680
    name: 'Epson Epson ET-2850: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Epson Epson ET-2850 by SNMP
        key: printer.page.count
