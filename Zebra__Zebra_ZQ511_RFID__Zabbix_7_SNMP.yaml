zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 0215301e512744728acd6a90bddaffbc
    template: Zebra Zebra ZQ511 RFID by SNMP
    name: Zebra Zebra ZQ511 RFID by SNMP
    description: 'Zabbix 7.0.x SNMP template for Zebra Zebra ZQ511 RFID.


      Verified source database date: 2026-09-27.

      Family/series: ZQ500.

      Category: RFID mobile printer; B&W/label.

      Network: Ethernet standard/optional and/or Wi-Fi depending on model.

      Verified SNMP support: SNMPv3 on Link-OS 7.0+.

      Evidence level: B - current model + platform/firmware.

      Canada status: Current Zebra family/product page.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.zebra.com/us/en/products/rfid/rfid-enabled-products.html

      SNMP evidence source: https://support.zebra.com/article/000031511

      Verification notes: Zebra states SNMPv3 is available on printers running Link-OS 7.0 and above. Confirm installed firmware before deployment.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Zebra
    - tag: model
      value: Zebra ZQ511 RFID
    - tag: family
      value: ZQ500
    - tag: category
      value: RFID mobile printer
    - tag: snmp_support
      value: SNMPv3 on Link-OS 7.0+
    - tag: evidence_level
      value: B - current model + platform/firmware
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 631f9f92aa0240c792f55ab44c03c4b6
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 13c52d744f4249698312930d210f1399
        expression: max(/Zebra Zebra ZQ511 RFID by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Zebra Zebra ZQ511 RFID: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 008f013e708442cd992b1db232cdecc7
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: f2b3d309c90a43f6a93f71c4ce9fb31b
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 2fb8d1344bd3437eb62ccf0332cb75b3
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c84b76b75b4d425d868cb15a156f879a
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: cd963dfab562404f93bc5316cc76cbfd
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c035d8bf0e00483d92a0ede11813ce14
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 8ddd2ce540104f6c86b098bd14ca5b89
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: f90780e8d2ce4de7918b83cefc236a18
        expression: last(/Zebra Zebra ZQ511 RFID by SNMP/printer.status)=1 or last(/Zebra Zebra ZQ511 RFID by SNMP/printer.status)=2
        name: 'Zebra Zebra ZQ511 RFID: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: dbe9e16088804de08447dd2f4e4e8173
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 9e32c9065da64033985a60ab14a84c8b
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 0aa2ada5921547c091cf93f6ea4a6137
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 09cbea7d28fe48aea1972227b9240fce
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 7e3ea54888724021905cb4ed41872824
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 6a2b99a789ed40a0b97e805744ee2f77
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 15bd127f4ae3487b89c406b86edea5e6
        expression: last(/Zebra Zebra ZQ511 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Zebra Zebra ZQ511 RFID: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: cabbbbc62cc6444094334331b01468cb
        expression: last(/Zebra Zebra ZQ511 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Zebra Zebra ZQ511 RFID by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Zebra Zebra ZQ511 RFID by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Zebra Zebra ZQ511 RFID by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Zebra Zebra ZQ511 RFID: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 78af750dd2c1425c95b3e6aae4991e89
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Zebra Zebra ZQ511 RFID by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Zebra Zebra ZQ511 RFID by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 002b421369e949a49422660c577aa87b
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: f45977950d6b49aca7e3df5c9a560143
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 7ed8f6c15cc54d3ab95c3426ffcd80f3
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 27edaa722f26436c913eed83f98bde85
        expression: last(/Zebra Zebra ZQ511 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Zebra Zebra ZQ511 RFID: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: f3e267768cd84a87bd6fa309ae50abdb
        expression: last(/Zebra Zebra ZQ511 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Zebra Zebra ZQ511 RFID by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Zebra Zebra ZQ511 RFID by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Zebra Zebra ZQ511 RFID by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Zebra Zebra ZQ511 RFID: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: a200b3f8b8f745dabf87e7d87908ff8d
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Zebra Zebra ZQ511 RFID by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Zebra Zebra ZQ511 RFID by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 1232f0077b1c48d49fdd5782902c8075
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 255cfaa632da476d92af74769810f1de
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 67b3d81e0c264218b66536c7d569790c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Zebra Zebra ZQ511 RFID by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 7d4f143d1fa44131bac39a7be7c3e2a1
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 5b0822785f524970bb5d0f2904b553f7
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: bec3aae65793455b90d4e6edb803795e
    name: 'Zebra Zebra ZQ511 RFID: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Zebra Zebra ZQ511 RFID by SNMP
        key: printer.page.count
