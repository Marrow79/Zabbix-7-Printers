zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 8ba6f7b57de246c4a3e4de44f06dbb70
    template: Kyocera ECOSYS PA5000x by SNMP
    name: Kyocera ECOSYS PA5000x by SNMP
    description: 'Zabbix 7.0.x SNMP template for Kyocera ECOSYS PA5000x.


      Verified source database date: 2026-09-27.

      Family/series: ECOSYS PA6000x Series.

      Category: Mono printer; B&W.

      Network: Gigabit Ethernet; optional Wi-Fi.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: B - current model + series/platform.

      Canada status: Current Kyocera Canada PA6000x family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://www.kyoceradocumentsolutions.ca/en/products/printers/kyocera-ecosys-pa6000x-series.html

      SNMP evidence source: https://www.kyoceradocumentsolutions.ca/content/download-center-americas/ca/documents/brochures-and-specs/KYOCERA_Spec_Sheet_ECOSYS_PA6000x_061223_pdf.download.pdf

      Verification notes: PA6000x series current page plus official series spec; exact feature set may vary slightly by member.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Kyocera
    - tag: model
      value: ECOSYS PA5000x
    - tag: family
      value: ECOSYS PA6000x Series
    - tag: category
      value: Mono printer
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: B - current model + series/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: b84f72de43c543b8a6da580b09c6f807
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 2bb60975d2a34a75a40abd1a8404287c
        expression: max(/Kyocera ECOSYS PA5000x by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Kyocera ECOSYS PA5000x: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: df9b47510ac14ebc9cc6047853df29c8
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: c4a75e83d9354513bd9e335a49568850
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c46cf6146c8a409fa0fb480e1a1089bb
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3133e7b2aed44eed90f47dd5207dc6c3
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 45dfed94e9664de4a58967129e666b4a
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d72ffe40fdd747a693d1da1587d376ab
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 0ee42a50642043a19183533d4cceeeba
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 3fc84069438a4c1ebce9f23eeee261d2
        expression: last(/Kyocera ECOSYS PA5000x by SNMP/printer.status)=1 or last(/Kyocera ECOSYS PA5000x by SNMP/printer.status)=2
        name: 'Kyocera ECOSYS PA5000x: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: b8adc18b8ad94d1ea6400c9c5a692c96
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 5d95c3ec57b84c0f9ec18ec180c4c5f5
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 639209f18e4b40a88167204560d80d44
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: 84236471ba5a480a81fab80e18eab8df
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: 77f2024209524dc7a17aa5a3aa288295
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 3265694447a942329b580689dba583ff
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 845f9ac00bf345108b407e42848ac55d
        expression: last(/Kyocera ECOSYS PA5000x by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Kyocera ECOSYS PA5000x: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 1e0fc2828466400bb070da50435597f7
        expression: last(/Kyocera ECOSYS PA5000x by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Kyocera ECOSYS PA5000x by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera ECOSYS PA5000x by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Kyocera ECOSYS PA5000x by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Kyocera ECOSYS PA5000x: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 3c3b582561e54bc7b855f98495a168ba
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera ECOSYS PA5000x by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera ECOSYS PA5000x by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 45fdc32bd03e440aa03e2ef09577ea11
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: b6cef9e6d1aa471cb1188b988fcdc9f6
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 9916c0218c0f4ea1ac8dfed36137e12c
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 5eab4e334f554a06b799659612511739
        expression: last(/Kyocera ECOSYS PA5000x by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Kyocera ECOSYS PA5000x: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 8fe1d73ed23f4c4292ed2c7267d0e1ed
        expression: last(/Kyocera ECOSYS PA5000x by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Kyocera ECOSYS PA5000x by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Kyocera ECOSYS PA5000x by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Kyocera ECOSYS PA5000x by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Kyocera ECOSYS PA5000x: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 4d7b4c6a41414a06b236ca5656259b3a
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Kyocera ECOSYS PA5000x by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Kyocera ECOSYS PA5000x by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: e81fe84dd63145fb93778d8da860b3fb
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 09dfb5cedace42dd8cb95dd74d06af63
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: e6e94945bb144bbca29a08048f397524
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Kyocera ECOSYS PA5000x by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 0b503d8665904c36b7db49a3b6be68d7
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 35fa1e161e7d478c9770213d3d552e94
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 77d06195629545c5b8084846c57e6fe8
    name: 'Kyocera ECOSYS PA5000x: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Kyocera ECOSYS PA5000x by SNMP
        key: printer.page.count
