zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 8099fd26d4db48f7b290e662e72ef067
    template: Konica Minolta bizhub 4201i by SNMP
    name: Konica Minolta bizhub 4201i by SNMP
    description: 'Zabbix 7.0.x SNMP template for Konica Minolta bizhub 4201i.


      Verified source database date: 2026-09-27.

      Family/series: bizhub One i-Series.

      Category: MFP / printer; B&W.

      Network: Ethernet; Wi-Fi options vary.

      Verified SNMP support: SNMPv1/SNMPv3 platform support.

      Evidence level: B - current model + platform security paper.

      Canada status: Current Konica Minolta Canada i-Series.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://konicaminolta.ca/en/business/technology/i-series

      SNMP evidence source: https://www.konicaminolta.com/global-en/security/mfp/setting/pdf/SecurityTechnicalSupportPaper_en.pdf

      Verification notes: Current Canada i-Series model list combined with Konica Minolta''s security technical support paper documenting SNMP device management.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Konica Minolta
    - tag: model
      value: bizhub 4201i
    - tag: family
      value: bizhub One i-Series
    - tag: category
      value: MFP / printer
    - tag: snmp_support
      value: SNMPv1/SNMPv3 platform support
    - tag: evidence_level
      value: B - current model + platform security paper
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: d4b3739b708443879394e13b35778595
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 21901dbf0c36451f88d33e32ef94cc3a
        expression: max(/Konica Minolta bizhub 4201i by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Konica Minolta bizhub 4201i: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 31f7656436c043af9db4c8b7a388b681
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 838d53c98d044023917f6de336fc7a29
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 49dc223175704d269fdb5683b16ae81d
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 8dd42bec9fa34f0a8fde941d44ae1af1
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: bb1e397df01e481081fb27a2303db8f0
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: afe8785f55234f478287b94e6450f203
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: c5c4ac1835da4801bc042bb173919ea2
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 452ba3aa8f464db189b4ae87d669c66a
        expression: last(/Konica Minolta bizhub 4201i by SNMP/printer.status)=1 or last(/Konica Minolta bizhub 4201i by SNMP/printer.status)=2
        name: 'Konica Minolta bizhub 4201i: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: a9f074b34ed849f780fe453477ce11c5
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: c86aba6453754d998bd534946973ee38
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 3f02f6ec593b44beb9ca180c2faeec5d
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: af1fa772aeb64b6ebd96232db10d647e
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: c79e669526d74b7c8f4f2b0df92d9c34
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: 62e266a3a0204ca88916400392cce3aa
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 5ae802ffd9214209b8ae9e74e702451f
        expression: last(/Konica Minolta bizhub 4201i by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 4201i: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: 570c497c162c41b38483af15ae586728
        expression: last(/Konica Minolta bizhub 4201i by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 4201i by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 4201i by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 4201i by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Konica Minolta bizhub 4201i: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 5b881bf3d40a49aa9b03f540714f4753
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 4201i by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 4201i by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: 1fe618336a8448bda3d9b1e0164643c6
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 625d0d2e6eb6489daec5322859b03869
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: 7012bb20f5a24a7e90d3bd98a9fe1e73
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: ee2a92cf0d0d41d2bdff89f75d46a701
        expression: last(/Konica Minolta bizhub 4201i by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Konica Minolta bizhub 4201i: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 22cdfe93efe74bbd9df70783506862fa
        expression: last(/Konica Minolta bizhub 4201i by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Konica Minolta bizhub 4201i by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Konica Minolta bizhub 4201i by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Konica Minolta bizhub 4201i by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Konica Minolta bizhub 4201i: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: de1d68c5f0cc429aa0b349271679eedd
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Konica Minolta bizhub 4201i by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Konica Minolta bizhub 4201i by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 982ae848c897468c8e673d80f439b34f
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: 436e9ab631154008990a8eed450798d7
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 6f8a6685c7e34bc5aa08c240d42e45b0
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Konica Minolta bizhub 4201i by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 7cd87d1110e546848050f4081eeb8a2a
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 4c36a068066d4ed7a2c5963c6b8bff33
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: aa19520a90bd4a9689490676b2cbbc4b
    name: 'Konica Minolta bizhub 4201i: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Konica Minolta bizhub 4201i by SNMP
        key: printer.page.count
