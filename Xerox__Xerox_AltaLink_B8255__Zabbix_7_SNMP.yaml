zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e8f2a8480d674fb2a53bea65079ae6e3
    name: Templates/Printers
  templates:
  - uuid: 4776fc21c1c0474f879b308bbf266247
    template: Xerox Xerox AltaLink B8255 by SNMP
    name: Xerox Xerox AltaLink B8255 by SNMP
    description: 'Zabbix 7.0.x SNMP template for Xerox Xerox AltaLink B8255.


      Verified source database date: 2026-09-27.

      Family/series: AltaLink B8200/C8200.

      Category: Enterprise MFP; B&W.

      Network: Ethernet.

      Verified SNMP support: SNMPv1/v2c/v3.

      Evidence level: B - current model + family/platform.

      Canada status: Current/certified Xerox enterprise family.


      Monitoring is intentionally based on standard SNMPv2-MIB, HOST-RESOURCES-MIB and Printer-MIB objects. Supply, tray and marker rows are discovered dynamically.
      Manufacturer-specific private OIDs are not guessed.


      Product/catalog source: https://securitydocs.business.xerox.com/en-us/documents/common-criteria/

      SNMP evidence source: https://download.support.xerox.com/pub/docs/ALB81XX/userdocs/any-os/en_GB/Xerox_AltaLink_B8100_C8100_AltaLink_B8200_C8200_series_mfp_sag_en-US.pdf

      Verification notes: AltaLink B8200/C8200 system-administration documentation covers SNMP management for the series.

      '
    groups:
    - name: Templates/Printers
    tags:
    - tag: class
      value: printer
    - tag: manufacturer
      value: Xerox
    - tag: model
      value: Xerox AltaLink B8255
    - tag: family
      value: AltaLink B8200/C8200
    - tag: category
      value: Enterprise MFP
    - tag: snmp_support
      value: SNMPv1/v2c/v3
    - tag: evidence_level
      value: B - current model + family/platform
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 10m
      description: Time without successful SNMP polling before the availability trigger fires.
    - macro: '{$PRINTER.SUPPLY.LOW}'
      value: '10'
      description: Low supply threshold in percent, used only when both current and maximum capacity are positive.
    - macro: '{$PRINTER.PAPER.LOW}'
      value: '10'
      description: Low paper threshold in percent, used only when both current and maximum tray capacity are positive.
    items:
    - uuid: 8bc7741d7b714498a4994d1b8578f65e
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: Zabbix SNMP availability
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 4c5900132d5e4b6aa6fd448aa2d273cb
        expression: max(/Xerox Xerox AltaLink B8255 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Xerox Xerox AltaLink B8255: No SNMP data collection'
        priority: HIGH
        description: Zabbix has been unable to poll this printer over SNMP for the configured timeout period.
    - uuid: 3bffcf66213d4d208f1f4033f9cc9e93
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: printer.sysdescr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: inventory
    - uuid: 81b32af8c97a48098905f61235bcf284
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: printer.sysname
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: d9d59005fa084dada8ef2bbe87d6cf79
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: printer.sysobjectid
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 08c2a88631a9412c8a8b3b477b0629a6
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: printer.syslocation
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: e3d294e23b6940ef843ef40d6b790428
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: printer.syscontact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a906f961112b4bae9ef5b2db1febfdc5
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: printer.uptime
      delay: 5m
      history: 30d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 81069aedf4b24d7089c14aa03c0d2b2a
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
      key: printer.status
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      description: 'HOST-RESOURCES-MIB hrPrinterStatus: 1=other, 2=unknown, 3=idle, 4=printing, 5=warmup.'
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: b666d016cd3f4bd3ba0a0f5632f00856
        expression: last(/Xerox Xerox AltaLink B8255 by SNMP/printer.status)=1 or last(/Xerox Xerox AltaLink B8255 by SNMP/printer.status)=2
        name: 'Xerox Xerox AltaLink B8255: Printer status is other or unknown'
        priority: WARNING
        opdata: 'Printer status: {ITEM.LASTVALUE1}'
    - uuid: bf66b7e4f50f4bd284e420d1d68491cf
      name: Printer name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.16.1
      key: printer.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: a7624f415bac47a3a26defada8782d53
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: printer.serial
      delay: 12h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: inventory
    - uuid: 594daaec1a1f4d679708a3e2caf28cc3
      name: Lifetime page count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.page.count
      delay: 5m
      history: 90d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      description: Standard Printer-MIB prtMarkerLifeCount for the common .1.1 marker instance. Some devices expose different marker indexes; the generic marker discovery
        rule in this template can still discover alternate indexes.
      tags:
      - tag: component
        value: usage
    discovery_rules:
    - uuid: fc0e60c49e214093b1c8a0e332eaf028
      name: Printer supply discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLYDESC},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLYTYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLYUNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: printer.supply.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers supplies from the standard Printer-MIB. Dynamic indexes prevent assumptions about toner/drum/waste-container positions.
      item_prototypes:
      - uuid: dc3608909c264cae96da354be0b1d42a
        name: 'Supply {#SUPPLYDESC}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: printer.supply.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw current supply level. Printer-MIB special values can include -1=other, -2=unknown, -3=some remains but exact amount is unknown.
      - uuid: e22fd97608c24ea79de0ffc990b64d4b
        name: 'Supply {#SUPPLYDESC}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: printer.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        description: Raw maximum supply capacity. Printer-MIB can return negative special values when capacity is unknown.
      trigger_prototypes:
      - uuid: 32e9f76d2c6441a7b75762f2afe7d0ed
        expression: last(/Xerox Xerox AltaLink B8255 by SNMP/printer.supply.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox AltaLink B8255: {#SUPPLYDESC} is empty'
        priority: HIGH
      - uuid: bdd410b68885498c98a41346256d9088
        expression: last(/Xerox Xerox AltaLink B8255 by SNMP/printer.supply.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox AltaLink B8255 by SNMP/printer.supply.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox AltaLink B8255 by SNMP/printer.supply.level[{#SNMPINDEX}])/last(/Xerox Xerox AltaLink B8255 by SNMP/printer.supply.max[{#SNMPINDEX}]))<{$PRINTER.SUPPLY.LOW}
        name: 'Xerox Xerox AltaLink B8255: {#SUPPLYDESC} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: da56d0be3058459b9608cc461f44913c
        name: Supply {#SUPPLYDESC}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox AltaLink B8255 by SNMP
            key: printer.supply.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox AltaLink B8255 by SNMP
            key: printer.supply.max[{#SNMPINDEX}]
    - uuid: fae1ca1ce943453c9c16a5ab80b76a7d
      name: Paper tray discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAYNAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.tray.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers input trays using standard Printer-MIB prtInputName.
      item_prototypes:
      - uuid: 025ff8ddd7534b818bd27fe509ac716c
        name: 'Paper tray {#TRAYNAME}: current level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      - uuid: ebdb82af5e91415f96feef4135ce55ed
        name: 'Paper tray {#TRAYNAME}: maximum capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.tray.max[{#SNMPINDEX}]
        delay: 1h
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: sheets
      trigger_prototypes:
      - uuid: 76b7ac6f6e624cf68f959ec1e86f641e
        expression: last(/Xerox Xerox AltaLink B8255 by SNMP/printer.tray.level[{#SNMPINDEX}])=0
        name: 'Xerox Xerox AltaLink B8255: Paper tray {#TRAYNAME} is empty'
        priority: AVERAGE
      - uuid: 0c23b513536647779a7d44f49a93deab
        expression: last(/Xerox Xerox AltaLink B8255 by SNMP/printer.tray.level[{#SNMPINDEX}])>0 and last(/Xerox Xerox AltaLink B8255 by SNMP/printer.tray.max[{#SNMPINDEX}])>0
          and (100*last(/Xerox Xerox AltaLink B8255 by SNMP/printer.tray.level[{#SNMPINDEX}])/last(/Xerox Xerox AltaLink B8255 by SNMP/printer.tray.max[{#SNMPINDEX}]))<{$PRINTER.PAPER.LOW}
        name: 'Xerox Xerox AltaLink B8255: Paper tray {#TRAYNAME} is low'
        priority: WARNING
      graph_prototypes:
      - uuid: 0ed8e400886945919f930572c2e4ae4b
        name: Paper tray {#TRAYNAME}
        graph_items:
        - color: 199C0D
          item:
            host: Xerox Xerox AltaLink B8255 by SNMP
            key: printer.tray.level[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Xerox Xerox AltaLink B8255 by SNMP
            key: printer.tray.max[{#SNMPINDEX}]
    - uuid: 9d19bdb488ce4a77b8f87b7eed5e514c
      name: Marker life counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#MARKERCOUNT},1.3.6.1.2.1.43.10.2.1.4]
      key: printer.marker.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers Printer-MIB prtMarkerLifeCount entries so devices with non-.1.1 marker indexes still expose usage counters.
      item_prototypes:
      - uuid: bf3686db94824455a890d5b62abfa4ae
        name: 'Marker {#SNMPINDEX}: lifetime count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.{#SNMPINDEX}
        key: printer.marker.life[{#SNMPINDEX}]
        delay: 5m
        history: 90d
        trends: 365d
        value_type: UNSIGNED
      graph_prototypes:
      - uuid: 7cf3b0aa3b63491780cc60f88b3e053c
        name: 'Marker {#SNMPINDEX}: lifetime count'
        graph_items:
        - color: 2774A4
          item:
            host: Xerox Xerox AltaLink B8255 by SNMP
            key: printer.marker.life[{#SNMPINDEX}]
    valuemaps:
    - uuid: 4d8d6804e11140fea0e4c2859fa84366
      name: Zabbix SNMP availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 994927230ca94d8b8165a1f06df4051e
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: Unknown
      - value: '3'
        newvalue: Idle
      - value: '4'
        newvalue: Printing
      - value: '5'
        newvalue: Warmup
  graphs:
  - uuid: 6756ae33543d412a8d10b9a84701b324
    name: 'Xerox Xerox AltaLink B8255: Lifetime page count'
    graph_items:
    - color: 2774A4
      item:
        host: Xerox Xerox AltaLink B8255 by SNMP
        key: printer.page.count
